---
# ============================================================
# PiQuickHeal - Dynamic DNS Resolution Diagnosis & Remediation
#
# Purpose:
#   Diagnose common DNS resolution failures dynamically and
#   safely remediate only local resolver/cache issues.
#
# AWX Job Template:
#   piquickheal-dns_resolution
#
# Recommended Tags:
#   diagnose
#   remediate
#   validate
#
# Safe automatic remediation:
#   - Flush local DNS cache
#   - Restart local DNS resolver service
#
# NOT automatically modified:
#   - /etc/resolv.conf
#   - DNS server configuration
#   - Routes
#   - Network interfaces
#   - Firewall rules
#   - DNS records
#   - External DNS provider configuration
# ============================================================

- name: "PiQuickHeal - Dynamic DNS Resolution"
  hosts: all
  gather_facts: true
  become: true

  vars:

    # --------------------------------------------------------
    # DNS probe
    # --------------------------------------------------------
    dns_probe_hostname: "example.com"

    # Secondary probe helps distinguish a single-record/domain
    # problem from a general DNS failure.
    dns_secondary_probe_hostname: "cloudflare.com"

    # Public DNS servers used only for diagnosis/comparison.
    # They are NOT configured on the server.
    public_dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"

    # Number of validation attempts after remediation.
    dns_validation_attempts: 3

    # Delay between validation attempts.
    dns_validation_delay: 2

    # DNS diagnostic timeout.
    dns_timeout: 3

    # Log file.
    heal_log_path: "/var/log/piquickheal/dns_resolution.log"

  tasks:

    # ========================================================
    # STAGE 1 - DISCOVERY
    # ========================================================

    - name: "STAGE 1 - Check required DNS diagnostic commands"
      ansible.builtin.shell: |
        command -v dig || true
        command -v nslookup || true
        command -v getent || true
        command -v ping || true
        command -v ip || true
        command -v nc || true
      args:
        executable: /bin/bash
      register: dns_required_commands
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Detect resolver services"
      ansible.builtin.shell: |
        services=""

        for svc in systemd-resolved nscd dnsmasq named bind9; do
          if systemctl list-unit-files "${svc}.service" >/dev/null 2>&1; then
            if systemctl is-active --quiet "${svc}.service"; then
              services="${services} ${svc}"
            fi
          fi
        done

        echo "${services}" | xargs
      args:
        executable: /bin/bash
      register: dns_active_services
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Read resolver configuration"
      ansible.builtin.shell: |
        if [ -e /etc/resolv.conf ]; then
          cat /etc/resolv.conf
        else
          echo "RESOLV_CONF_MISSING"
        fi
      args:
        executable: /bin/bash
      register: dns_resolv_conf
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Extract configured nameservers"
      ansible.builtin.shell: |
        if [ -f /etc/resolv.conf ]; then
          awk '/^[[:space:]]*nameserver[[:space:]]+/ {print $2}' /etc/resolv.conf
        fi
      args:
        executable: /bin/bash
      register: dns_nameservers
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Detect default route"
      ansible.builtin.shell: |
        ip route show default 2>/dev/null | head -1
      args:
        executable: /bin/bash
      register: dns_default_route
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Detect default gateway"
      ansible.builtin.shell: |
        ip route show default 2>/dev/null |
        awk '/^default/ {
          for (i=1; i<=NF; i++) {
            if ($i == "via") {
              print $(i+1)
              exit
            }
          }
        }'
      args:
        executable: /bin/bash
      register: dns_gateway
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Detect default network interface"
      ansible.builtin.shell: |
        ip route show default 2>/dev/null |
        awk '/^default/ {
          for (i=1; i<=NF; i++) {
            if ($i == "dev") {
              print $(i+1)
              exit
            }
          }
        }'
      args:
        executable: /bin/bash
      register: dns_default_interface
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Check /etc/hosts for probe hostname"
      ansible.builtin.shell: |
        if [ -f /etc/hosts ]; then
          grep -E '(^|[[:space:]]){{ dns_probe_hostname | regex_escape }}([[:space:]]|$)' /etc/hosts || true
        fi
      args:
        executable: /bin/bash
      register: dns_hosts_override
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 2 - NETWORK DIAGNOSIS
    # ========================================================

    - name: "STAGE 2 - Test default gateway reachability"
      ansible.builtin.shell: |
        GATEWAY="{{ dns_gateway.stdout | trim }}"

        if [ -z "$GATEWAY" ]; then
          echo "NO_GATEWAY"
          exit 0
        fi

        if ping -c 2 -W {{ dns_timeout }} "$GATEWAY" >/dev/null 2>&1; then
          echo "REACHABLE"
        else
          echo "UNREACHABLE"
        fi
      args:
        executable: /bin/bash
      register: dns_gateway_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 2 - Test configured DNS servers over ICMP"
      ansible.builtin.shell: |
        RESULT=""

        for DNS_SERVER in {{ dns_nameservers.stdout_lines | default([]) | join(' ') }}; do
          if ping -c 1 -W {{ dns_timeout }} "$DNS_SERVER" >/dev/null 2>&1; then
            RESULT="${RESULT}${DNS_SERVER}=ICMP_OK "
          else
            RESULT="${RESULT}${DNS_SERVER}=ICMP_FAIL "
          fi
        done

        echo "$RESULT" | xargs
      args:
        executable: /bin/bash
      register: dns_server_icmp_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 2 - Test configured DNS servers on UDP/TCP 53"
      ansible.builtin.shell: |
        if ! command -v nc >/dev/null 2>&1; then
          echo "NC_NOT_AVAILABLE"
          exit 0
        fi

        RESULT=""

        for DNS_SERVER in {{ dns_nameservers.stdout_lines | default([]) | join(' ') }}; do

          if nc -z -u -w {{ dns_timeout }} "$DNS_SERVER" 53 >/dev/null 2>&1; then
            UDP_STATUS="UDP_OK"
          else
            UDP_STATUS="UDP_FAIL"
          fi

          if nc -z -w {{ dns_timeout }} "$DNS_SERVER" 53 >/dev/null 2>&1; then
            TCP_STATUS="TCP_OK"
          else
            TCP_STATUS="TCP_FAIL"
          fi

          RESULT="${RESULT}${DNS_SERVER}=${UDP_STATUS},${TCP_STATUS} "
        done

        echo "$RESULT" | xargs
      args:
        executable: /bin/bash
      register: dns_port_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 3 - DNS SERVER DIAGNOSIS
    # ========================================================

    - name: "STAGE 3 - Query configured DNS servers directly"
      ansible.builtin.shell: |
        if ! command -v dig >/dev/null 2>&1; then
          echo "DIG_NOT_AVAILABLE"
          exit 0
        fi

        RESULT=""

        for DNS_SERVER in {{ dns_nameservers.stdout_lines | default([]) | join(' ') }}; do

          A_RESULT=$(dig +time={{ dns_timeout }} +tries=1 +short A "{{ dns_probe_hostname }}" @"$DNS_SERVER" 2>&1)
          A_RC=$?

          AAAA_RESULT=$(dig +time={{ dns_timeout }} +tries=1 +short AAAA "{{ dns_probe_hostname }}" @"$DNS_SERVER" 2>&1)
          AAAA_RC=$?

          if [ "$A_RC" -eq 0 ] || [ "$AAAA_RC" -eq 0 ]; then
            STATUS="RESPONDING"
          else
            STATUS="FAILING"
          fi

          RESULT="${RESULT}${DNS_SERVER}=${STATUS};A=${A_RESULT};AAAA=${AAAA_RESULT} || "
        done

        echo "$RESULT"
      args:
        executable: /bin/bash
      register: dns_direct_server_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 3 - Test local DNS resolution with getent"
      ansible.builtin.shell: |
        if ! command -v getent >/dev/null 2>&1; then
          echo "GETENT_NOT_AVAILABLE"
          exit 0
        fi

        if getent ahosts "{{ dns_probe_hostname }}" >/tmp/piquickheal_dns_getent_a 2>/dev/null; then
          echo "A_OK"
        else
          echo "A_FAIL"
        fi

        if getent ahosts "{{ dns_secondary_probe_hostname }}" >/tmp/piquickheal_dns_getent_b 2>/dev/null; then
          echo "SECONDARY_OK"
        else
          echo "SECONDARY_FAIL"
        fi
      args:
        executable: /bin/bash
      register: dns_getent_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 3 - Test local resolver with dig"
      ansible.builtin.shell: |
        if ! command -v dig >/dev/null 2>&1; then
          echo "DIG_NOT_AVAILABLE"
          exit 0
        fi

        A_OUTPUT=$(dig +time={{ dns_timeout }} +tries=1 +short A "{{ dns_probe_hostname }}" 2>&1)
        A_RC=$?

        AAAA_OUTPUT=$(dig +time={{ dns_timeout }} +tries=1 +short AAAA "{{ dns_probe_hostname }}" 2>&1)
        AAAA_RC=$?

        if [ "$A_RC" -eq 0 ] || [ "$AAAA_RC" -eq 0 ]; then
          echo "A_OR_AAAA_OK"
        else
          echo "A_AND_AAAA_FAIL"
        fi

        echo "A_RESULT=${A_OUTPUT}"
        echo "AAAA_RESULT=${AAAA_OUTPUT}"
      args:
        executable: /bin/bash
      register: dns_local_dig_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 4 - PUBLIC DNS COMPARISON
    # ========================================================

    - name: "STAGE 4 - Compare with public DNS resolvers"
      ansible.builtin.shell: |
        if ! command -v dig >/dev/null 2>&1; then
          echo "DIG_NOT_AVAILABLE"
          exit 0
        fi

        RESULT=""

        for PUBLIC_DNS in {{ public_dns_servers | join(' ') }}; do

          A_OUTPUT=$(dig +time={{ dns_timeout }} +tries=1 +short A "{{ dns_probe_hostname }}" @"$PUBLIC_DNS" 2>&1)
          A_RC=$?

          if [ "$A_RC" -eq 0 ] && [ -n "$A_OUTPUT" ]; then
            STATUS="RESOLVES"
          else
            STATUS="FAILS"
          fi

          RESULT="${RESULT}${PUBLIC_DNS}=${STATUS};${A_OUTPUT} "
        done

        echo "$RESULT" | xargs
      args:
        executable: /bin/bash
      register: dns_public_comparison
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 5 - AUTHORITATIVE / DNS RECORD CHECK
    # ========================================================

    - name: "STAGE 5 - Check DNS record response and status"
      ansible.builtin.shell: |
        if ! command -v dig >/dev/null 2>&1; then
          echo "DIG_NOT_AVAILABLE"
          exit 0
        fi

        echo "STATUS:"
        dig +time={{ dns_timeout }} +tries=1 "{{ dns_probe_hostname }}" |
          awk '/status:/{print $0}'

        echo "ANSWER:"
        dig +time={{ dns_timeout }} +tries=1 +short A "{{ dns_probe_hostname }}"

        echo "AUTHORITY:"
        dig +time={{ dns_timeout }} +tries=1 "{{ dns_probe_hostname }}" |
          awk '/AUTHORITY SECTION:/,/^$/' || true
      args:
        executable: /bin/bash
      register: dns_record_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 6 - RESOLVER SERVICE HEALTH
    # ========================================================

    - name: "STAGE 6 - Check detected resolver services"
      ansible.builtin.shell: |
        RESULT=""

        for svc in systemd-resolved nscd dnsmasq named bind9; do
          if systemctl list-unit-files "${svc}.service" >/dev/null 2>&1; then
            if systemctl is-active --quiet "${svc}.service"; then
              RESULT="${RESULT}${svc}=ACTIVE "
            else
              RESULT="${RESULT}${svc}=INACTIVE "
            fi
          fi
        done

        echo "$RESULT" | xargs
      args:
        executable: /bin/bash
      register: dns_service_health
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 7 - DYNAMIC CLASSIFICATION
    # ========================================================

    - name: "STAGE 7 - Classify DNS failure"
      ansible.builtin.shell: |
        GETENT_RESULT="{{ dns_getent_test.stdout | default('') }}"
        LOCAL_DIG_RESULT="{{ dns_local_dig_test.stdout | default('') }}"
        GATEWAY_RESULT="{{ dns_gateway_test.stdout | trim }}"
        DIRECT_RESULT="{{ dns_direct_server_test.stdout | default('') }}"
        PUBLIC_RESULT="{{ dns_public_comparison.stdout | default('') }}"
        NAMESERVERS="{{ dns_nameservers.stdout | trim }}"
        HOST_OVERRIDE="{{ dns_hosts_override.stdout | trim }}"
        ROUTE="{{ dns_default_route.stdout | trim }}"
        RESOLVER_SERVICES="{{ dns_active_services.stdout | trim }}"

        CLASS="DNS_FAILURE_UNDETERMINED"
        REASON="Unable to determine a unique DNS failure category."

        # ----------------------------------------------------
        # 1. Local resolution already works
        # ----------------------------------------------------
        if echo "$GETENT_RESULT" | grep -q "A_OK"; then

          CLASS="RESOLUTION_WORKING"
          REASON="The configured resolver successfully resolved the DNS probe."

        # ----------------------------------------------------
        # 2. No default route / gateway
        # ----------------------------------------------------
        elif [ -z "$ROUTE" ] || [ "$GATEWAY_RESULT" = "UNREACHABLE" ]; then

          CLASS="NETWORK_OR_GATEWAY_FAILURE"
          REASON="The server does not have a usable default route or cannot reach its gateway."

        # ----------------------------------------------------
        # 3. No nameserver configured
        # ----------------------------------------------------
        elif [ -z "$NAMESERVERS" ]; then

          CLASS="NO_DNS_SERVER_CONFIGURED"
          REASON="No nameserver is configured in /etc/resolv.conf."

        # ----------------------------------------------------
        # 4. /etc/hosts may override DNS
        # ----------------------------------------------------
        elif [ -n "$HOST_OVERRIDE" ]; then

          CLASS="HOSTS_FILE_OVERRIDE_POSSIBLE"
          REASON="The probe hostname has an entry in /etc/hosts."

        # ----------------------------------------------------
        # 5. Direct configured DNS server works but local
        #    resolver does not
        # ----------------------------------------------------
        elif echo "$DIRECT_RESULT" | grep -q "RESPONDING"; then

          CLASS="LOCAL_RESOLVER_OR_CACHE_FAILURE"
          REASON="Configured DNS server responds directly, but local resolution fails."

        # ----------------------------------------------------
        # 6. Public DNS works but configured DNS fails
        # ----------------------------------------------------
        elif echo "$PUBLIC_RESULT" | grep -q "RESOLVES"; then

          CLASS="CONFIGURED_DNS_SERVER_FAILURE"
          REASON="Public DNS resolves the probe while configured DNS servers do not."

        # ----------------------------------------------------
        # 7. Neither configured nor public DNS works
        # ----------------------------------------------------
        elif echo "$DIRECT_RESULT" | grep -q "FAILING" &&
             echo "$PUBLIC_RESULT" | grep -q "FAILS"; then

          CLASS="NETWORK_OR_EXTERNAL_DNS_FAILURE"
          REASON="Both configured and public DNS queries fail. Network or external DNS connectivity may be affected."

        fi

        echo "CLASS=${CLASS}"
        echo "REASON=${REASON}"

      args:
        executable: /bin/bash
      register: dns_classification
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 7 - Determine whether safe remediation is allowed"
      ansible.builtin.set_fact:
        dns_safe_remediation_allowed: >-
          {{
            'LOCAL_RESOLVER_OR_CACHE_FAILURE'
            in dns_classification.stdout
          }}
      tags:
        - diagnose

    # ========================================================
    # STAGE 8 - DISPLAY DIAGNOSTIC SUMMARY
    # ========================================================

    - name: "STAGE 8 - Display DNS diagnostic summary"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PiQuickHeal DNS Diagnostic Summary"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Probe hostname: {{ dns_probe_hostname }}"
          - "Secondary hostname: {{ dns_secondary_probe_hostname }}"
          - "Classification: {{ dns_classification.stdout | default('UNKNOWN') }}"
          - "Resolver services: {{ dns_active_services.stdout | default('NONE') }}"
          - "Nameservers: {{ dns_nameservers.stdout | default('NONE') }}"
          - "Default route: {{ dns_default_route.stdout | default('NONE') }}"
          - "Gateway: {{ dns_gateway.stdout | default('NONE') }}"
          - "Gateway test: {{ dns_gateway_test.stdout | default('UNKNOWN') }}"
          - "DNS ICMP test: {{ dns_server_icmp_test.stdout | default('UNKNOWN') }}"
          - "DNS port test: {{ dns_port_test.stdout | default('UNKNOWN') }}"
          - "Direct DNS test: {{ dns_direct_server_test.stdout | default('UNKNOWN') }}"
          - "Local getent test: {{ dns_getent_test.stdout | default('UNKNOWN') }}"
          - "Local dig test: {{ dns_local_dig_test.stdout | default('UNKNOWN') }}"
          - "Public DNS comparison: {{ dns_public_comparison.stdout | default('UNKNOWN') }}"
          - "Safe remediation allowed: {{ dns_safe_remediation_allowed | default(false) }}"
          - "============================================================"
      tags:
        - diagnose

    # ========================================================
    # STAGE 9 - SAFE REMEDIATION
    # ========================================================

    - name: "STAGE 9 - Flush systemd-resolved cache"
      ansible.builtin.command:
        cmd: "resolvectl flush-caches"
      when:
        - dns_safe_remediation_allowed | default(false) | bool
        - "'systemd-resolved' in dns_active_services.stdout"
      register: dns_systemd_resolved_flush
      changed_when: true
      failed_when: false
      tags:
        - remediate

    - name: "STAGE 9 - Restart systemd-resolved"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when:
        - dns_safe_remediation_allowed | default(false) | bool
        - "'systemd-resolved' in dns_active_services.stdout"
      register: dns_systemd_resolved_restart
      changed_when: true
      failed_when: false
      tags:
        - remediate

    - name: "STAGE 9 - Restart nscd"
      ansible.builtin.systemd:
        name: nscd
        state: restarted
      when:
        - dns_safe_remediation_allowed | default(false) | bool
        - "'nscd' in dns_active_services.stdout"
      register: dns_nscd_restart
      changed_when: true
      failed_when: false
      tags:
        - remediate

    - name: "STAGE 9 - Flush nscd hosts cache"
      ansible.builtin.command:
        cmd: "nscd -i hosts"
      when:
        - dns_safe_remediation_allowed | default(false) | bool
        - "'nscd' in dns_active_services.stdout"
      register: dns_nscd_flush
      changed_when: true
      failed_when: false
      tags:
        - remediate

    - name: "STAGE 9 - Restart dnsmasq"
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
      when:
        - dns_safe_remediation_allowed | default(false) | bool
        - "'dnsmasq' in dns_active_services.stdout"
      register: dns_dnsmasq_restart
      changed_when: true
      failed_when: false
      tags:
        - remediate

    # ========================================================
    # STAGE 10 - VALIDATION
    # ========================================================

    - name: "STAGE 10 - Validate DNS resolution after remediation"
      ansible.builtin.shell: |
        ATTEMPT=1

        while [ "$ATTEMPT" -le "{{ dns_validation_attempts }}" ]; do

          if getent ahosts "{{ dns_probe_hostname }}" >/dev/null 2>&1; then
            echo "OK"
            exit 0
          fi

          if [ "$ATTEMPT" -lt "{{ dns_validation_attempts }}" ]; then
            sleep {{ dns_validation_delay }}
          fi

          ATTEMPT=$((ATTEMPT + 1))
        done

        echo "FAILING"
        exit 1
      args:
        executable: /bin/bash
      register: dns_validation
      changed_when: false
      failed_when: false
      when:
        - dns_safe_remediation_allowed | default(false) | bool
      tags:
        - validate

    # ========================================================
    # STAGE 11 - RECORD HEAL RESULT
    # ========================================================

    - name: "STAGE 11 - Record DNS heal result"
      ansible.builtin.shell: |
        mkdir -p "$(dirname "{{ heal_log_path }}")"

        if [ "{{ dns_validation.stdout | default('FAILING') | trim }}" = "OK" ]; then
          STATUS="HEALED"
        else
          STATUS="HEAL_FAILED"
        fi

        CLASSIFICATION=$(echo "{{ dns_classification.stdout | default('UNKNOWN') }}" | grep '^CLASS=' | head -1 | cut -d= -f2-)

        TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S %Z')
        HOSTNAME=$(hostname)

        echo "${TIMESTAMP} [${STATUS} network_dns_resolution] ${HOSTNAME} classification=${CLASSIFICATION} probe={{ dns_probe_hostname }}" >> "{{ heal_log_path }}"
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false
      when:
        - dns_safe_remediation_allowed | default(false) | bool
      tags:
        - validate

    # ========================================================
    # STAGE 12 - MANUAL ACTION REPORT
    # ========================================================

    - name: "STAGE 12 - Generate manual action report"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "DNS Manual Action Required"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Probe: {{ dns_probe_hostname }}"
          - "Classification: {{ dns_classification.stdout | default('UNKNOWN') }}"
          - ""
          - "PiQuickHeal did not modify DNS/network configuration."
          - ""
          - "Possible manual checks:"
          - "1. Verify /etc/resolv.conf nameservers."
          - "2. Verify DNS server availability."
          - "3. Verify UDP/TCP port 53 connectivity."
          - "4. Verify firewall/security-group/network ACL rules."
          - "5. Verify default route and gateway."
          - "6. Verify DNS records at the DNS provider."
          - "7. Check authoritative DNS/delegation if required."
          - "8. Check split-horizon/private DNS configuration."
          - "9. Check DNSSEC configuration if applicable."
          - "10. Check /etc/hosts for incorrect overrides."
          - "11. Check IPv4/IPv6-specific DNS behaviour."
          - "============================================================"
      when:
        - not (dns_safe_remediation_allowed | default(false) | bool)
        - "'RESOLUTION_WORKING' not in dns_classification.stdout"
      tags:
        - diagnose

    # ========================================================
    # STAGE 13 - FINAL RESULT
    # ========================================================

    - name: "STAGE 13 - Final DNS result"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PiQuickHeal DNS Final Result"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Classification: {{ dns_classification.stdout | default('UNKNOWN') }}"
          - "Safe remediation: {{ dns_safe_remediation_allowed | default(false) }}"
          - "Validation: {{ dns_validation.stdout | default('NOT_REQUIRED') | trim }}"
          - "============================================================"
      tags:
        - diagnose
        - remediate
        - validate
