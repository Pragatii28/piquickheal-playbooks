---
# ================================================================
# PiQuickHeal - Production DNS Diagnosis & Safe Remediation
# ================================================================
#
# Purpose:
#   Diagnose DNS resolution failures and perform only safe,
#   evidence-based local resolver remediation.
#
# Supported classifications:
#
#   1.  RESOLUTION_WORKING
#   2.  CONFIGURED_DNS_SERVER_FAILURE
#   3.  NO_DNS_SERVER_CONFIGURED
#   4.  NETWORK_OR_GATEWAY_FAILURE
#   5.  HOSTS_FILE_OVERRIDE_POSSIBLE
#   6.  LOCAL_RESOLVER_OR_CACHE_FAILURE
#   7.  DNS_RECORD_NOT_FOUND
#   8.  PUBLIC_DNS_UNAVAILABLE
#   9.  IPV6_DNS_FAILURE
#   10. DNS_TIMEOUT
#   11. DNS_FAILURE_UNDETERMINED
#
# SAFE REMEDIATION:
#   Only LOCAL_RESOLVER_OR_CACHE_FAILURE is eligible.
#
# NEVER automatically modifies:
#   - /etc/resolv.conf
#   - routing
#   - firewall
#   - network interfaces
#   - DNS records
#
# Optional tools:
#   - dig
#   - nslookup
#   - resolvectl
#
# Required utilities:
#   - getent
#   - ip
#   - awk
#   - grep
#   - systemctl
#   - ping
#
# AWX example:
#   target_hostname: myapp.example.com
#
# ================================================================

- name: PiQuickHeal - Production DNS Diagnosis & Safe Remediation
  hosts: all
  become: true
  gather_facts: true

  vars:

    # ============================================================
    # PROBES
    # ============================================================

    dns_probe_hostname: "example.com"

    dns_secondary_probe_hostname: "cloudflare.com"

    dns_target_hostname: "{{ target_hostname | default(dns_probe_hostname) }}"

    dns_nonexistent_hostname: >-
      piquickheal-this-domain-should-not-exist-987654321.example

    dns_internet_probe_ip: "1.1.1.1"

    dns_public_servers:
      - "1.1.1.1"
      - "8.8.8.8"

    # Validation
    dns_validation_attempts: 3
    dns_validation_delay: 2

    # Log
    dns_log_file: "/var/log/piquickheal/dns_resolution.log"

  tasks:

    # ============================================================
    # 1. EXECUTION MARKER
    # ============================================================

    - name: PiQuickHeal - Confirm DNS playbook execution
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "PiQuickHeal DNS PLAYBOOK EXECUTED"
          - "=================================================="
          - "Host: {{ inventory_hostname }}"
          - "Playbook: Production DNS Diagnosis & Safe Remediation"
          - "=================================================="


    # ============================================================
    # 2. INITIALIZE VARIABLES
    # ============================================================

    - name: Initialize DNS diagnosis variables
      ansible.builtin.set_fact:

        # Tools
        dns_has_dig: false
        dns_has_nslookup: false
        dns_has_resolvectl: false

        # Resolver configuration
        dns_nameservers: []
        dns_effective_test_servers: []
        dns_uses_stub_resolver: false

        # NSS
        nss_hosts_order: "unknown"

        # Network
        dns_gateway: ""
        gateway_icmp_reachable: false
        internet_icmp_reachable: false
        dns_network_status: "UNKNOWN"

        # IPv6
        ipv6_connectivity_present: false
        primary_ipv6_ok: false

        # Hosts
        hosts_override_present: false

        # System DNS
        primary_ipv4_ok: false
        secondary_ipv4_ok: false
        target_ipv4_ok: false

        # Non-existent hostname
        nonexistent_record_failed: false

        # Direct DNS
        dns_direct_test_available: false
        direct_dns_result: ""
        target_direct_dns_result: ""

        # Public DNS
        public_dns_result: ""
        public_dns_available: false

        # Diagnostic flags
        configured_dns_failure_detected: false
        dns_timeout_detected: false
        local_resolver_failure_detected: false
        dns_record_not_found_detected: false
        ipv6_dns_failure_detected: false
        public_dns_unavailable_detected: false

        # Classification
        dns_classification_name: "DNS_FAILURE_UNDETERMINED"
        dns_classification_reason: >-
          DNS condition could not be uniquely determined.

        # Remediation
        safe_dns_remediation_allowed: false
        remediation_performed: false
        dns_validation_result: "NOT_REQUIRED"


    # ============================================================
    # 3. DISPLAY START
    # ============================================================

    - name: Display DNS diagnosis start
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "PiQuickHeal - DNS Diagnosis"
          - "=================================================="
          - "Target: {{ inventory_hostname }}"
          - "Control hostname: {{ dns_probe_hostname }}"
          - "Target hostname: {{ dns_target_hostname }}"
          - "=================================================="


    # ============================================================
    # 4. CHECK OPTIONAL TOOLS
    # ============================================================

    - name: Check for dig
      ansible.builtin.shell: |
        command -v dig || true
      args:
        executable: /bin/bash
      register: dig_path
      changed_when: false
      failed_when: false


    - name: Check for nslookup
      ansible.builtin.shell: |
        command -v nslookup || true
      args:
        executable: /bin/bash
      register: nslookup_path
      changed_when: false
      failed_when: false


    - name: Check for resolvectl
      ansible.builtin.shell: |
        command -v resolvectl || true
      args:
        executable: /bin/bash
      register: resolvectl_path
      changed_when: false
      failed_when: false


    - name: Set DNS tool availability
      ansible.builtin.set_fact:
        dns_has_dig: "{{ dig_path.stdout | trim | length > 0 }}"
        dns_has_nslookup: "{{ nslookup_path.stdout | trim | length > 0 }}"
        dns_has_resolvectl: "{{ resolvectl_path.stdout | trim | length > 0 }}"


    - name: Display DNS tools
      ansible.builtin.debug:
        msg:
          - "dig available: {{ dns_has_dig }}"
          - "nslookup available: {{ dns_has_nslookup }}"
          - "resolvectl available: {{ dns_has_resolvectl }}"


    # ============================================================
    # 5. READ /etc/resolv.conf
    # ============================================================

    - name: Read /etc/resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolv_conf
      failed_when: false


    - name: Extract configured DNS servers
      ansible.builtin.shell: |
        awk '
          /^[[:space:]]*#/ {next}
          $1 == "nameserver" {print $2}
        ' /etc/resolv.conf 2>/dev/null
      args:
        executable: /bin/bash
      register: configured_nameservers
      changed_when: false
      failed_when: false


    - name: Set configured DNS servers
      ansible.builtin.set_fact:
        dns_nameservers: >-
          {{
            configured_nameservers.stdout_lines
            | default([])
            | reject('equalto', '')
            | list
          }}


    - name: Detect systemd-resolved stub
      ansible.builtin.set_fact:
        dns_uses_stub_resolver: >-
          {{
            dns_nameservers
            | select('match', '^(127\.0\.0\.53|127\.0\.0\.54|::1)$')
            | list
            | length > 0
          }}


    # ============================================================
    # 6. SYSTEMD-RESOLVED UPSTREAM DNS
    # ============================================================

    - name: Get systemd-resolved upstream DNS servers
      ansible.builtin.shell: |
        resolvectl dns 2>/dev/null |
        tr ' ' '\n' |
        grep -E \
          '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$|^[0-9a-fA-F:]+:[0-9a-fA-F:]+$' |
        sort -u
      args:
        executable: /bin/bash
      register: resolvectl_upstreams
      changed_when: false
      failed_when: false
      when:
        - dns_uses_stub_resolver
        - dns_has_resolvectl


    - name: Determine effective DNS servers
      ansible.builtin.set_fact:
        dns_effective_test_servers: >-
          {{
            (
              resolvectl_upstreams.stdout_lines
              | default([])
            )
            if (
              dns_uses_stub_resolver
              and dns_has_resolvectl
              and (
                resolvectl_upstreams.stdout_lines
                | default([])
                | length > 0
              )
            )
            else dns_nameservers
          }}


    - name: Display DNS configuration
      ansible.builtin.debug:
        msg:
          - >-
            resolv.conf nameservers:
            {{
              dns_nameservers | join(', ')
              if dns_nameservers | length > 0
              else 'NONE'
            }}
          - "systemd-resolved stub: {{ dns_uses_stub_resolver }}"
          - >-
            Effective DNS servers:
            {{
              dns_effective_test_servers | join(', ')
              if dns_effective_test_servers | length > 0
              else 'NONE'
            }}


    # ============================================================
    # 7. NSS CONFIGURATION
    # ============================================================

    - name: Read NSS hosts configuration
      ansible.builtin.shell: |
        awk '$1 == "hosts:" {$1=""; print $0}' \
          /etc/nsswitch.conf 2>/dev/null |
        xargs
      args:
        executable: /bin/bash
      register: nsswitch_hosts
      changed_when: false
      failed_when: false


    - name: Set NSS hosts order
      ansible.builtin.set_fact:
        nss_hosts_order: >-
          {{
            nsswitch_hosts.stdout | trim
            if nsswitch_hosts.stdout | trim | length > 0
            else 'unknown'
          }}


    # ============================================================
    # 8. LOCAL RESOLVER SERVICES
    # ============================================================

    - name: Detect local DNS resolver services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --all \
          --no-legend \
          2>/dev/null |
        awk '{print $1}' |
        grep -Ei \
          '^(systemd-resolved|nscd|dnsmasq|named|bind9|unbound)' |
        sort -u || true
      args:
        executable: /bin/bash
      register: resolver_services
      changed_when: false
      failed_when: false


    - name: Set local resolver presence
      ansible.builtin.set_fact:
        local_resolver_present: >-
          {{
            resolver_services.stdout_lines
            | default([])
            | length > 0
          }}


    - name: Display local resolver services
      ansible.builtin.debug:
        msg:
          - >-
            Local resolver services:
            {{
              resolver_services.stdout_lines
              if resolver_services.stdout_lines | length > 0
              else ['NONE']
            }}


    # ============================================================
    # 9. NETWORK / DEFAULT GATEWAY
    # ============================================================

    - name: Get IPv4 default route
      ansible.builtin.shell: |
        ip route show default 2>/dev/null |
        head -n 1
      args:
        executable: /bin/bash
      register: default_route
      changed_when: false
      failed_when: false


    - name: Get default gateway
      ansible.builtin.shell: |
        ip route show default 2>/dev/null |
        awk '/default/ {print $3; exit}'
      args:
        executable: /bin/bash
      register: gateway_result
      changed_when: false
      failed_when: false


    - name: Set gateway
      ansible.builtin.set_fact:
        dns_gateway: "{{ gateway_result.stdout | trim }}"


    - name: Test gateway reachability
      ansible.builtin.shell: |
        if [ -z "{{ dns_gateway }}" ]; then
          echo "NO_GATEWAY"
        elif ping -c 2 -W 2 "{{ dns_gateway }}" >/dev/null 2>&1; then
          echo "REACHABLE"
        else
          echo "UNREACHABLE"
        fi
      args:
        executable: /bin/bash
      register: gateway_test
      changed_when: false
      failed_when: false


    - name: Test public IP reachability
      ansible.builtin.shell: |
        if ping -c 2 -W 2 "{{ dns_internet_probe_ip }}" >/dev/null 2>&1; then
          echo "REACHABLE"
        else
          echo "UNREACHABLE"
        fi
      args:
        executable: /bin/bash
      register: internet_test
      changed_when: false
      failed_when: false
      when: dns_gateway | length > 0


    - name: Determine network evidence
      ansible.builtin.set_fact:
        gateway_icmp_reachable: >-
          {{
            gateway_test.stdout | trim == 'REACHABLE'
          }}

        internet_icmp_reachable: >-
          {{
            internet_test.stdout | default('UNREACHABLE') | trim
            == 'REACHABLE'
          }}


    - name: Determine network status
      ansible.builtin.set_fact:
        dns_network_status: >-
          {{
            'NO_GATEWAY'
            if dns_gateway | length == 0
            else 'REACHABLE'
            if gateway_icmp_reachable
            else 'BLOCKS_ICMP'
            if internet_icmp_reachable
            else 'UNREACHABLE'
          }}


    - name: Display network status
      ansible.builtin.debug:
        msg:
          - >-
            Default route:
            {{
              default_route.stdout | trim
              if default_route.stdout | trim | length > 0
              else 'NONE'
            }}
          - "Gateway: {{ dns_gateway | default('NONE') }}"
          - "Gateway ping: {{ gateway_test.stdout | trim }}"
          - >-
            Public IP ping:
            {{
              internet_test.stdout
              | default('N/A')
              | trim
            }}
          - "Network status: {{ dns_network_status }}"


    # ============================================================
    # 10. IPv6 CONNECTIVITY
    # ============================================================

    - name: Check IPv6 default route
      ansible.builtin.shell: |
        ip -6 route show default 2>/dev/null |
        head -n 1
      args:
        executable: /bin/bash
      register: ipv6_default_route
      changed_when: false
      failed_when: false


    - name: Check IPv6 global address
      ansible.builtin.shell: |
        ip -6 addr show scope global 2>/dev/null |
        grep -c 'inet6' || true
      args:
        executable: /bin/bash
      register: ipv6_global_addr
      changed_when: false
      failed_when: false


    - name: Determine IPv6 connectivity
      ansible.builtin.set_fact:
        ipv6_connectivity_present: >-
          {{
            (ipv6_default_route.stdout | trim | length > 0)
            and
            (
              ipv6_global_addr.stdout
              | trim
              | default('0')
              | int
            ) > 0
          }}


    # ============================================================
    # 11. /etc/hosts OVERRIDE
    # ============================================================

    - name: Check /etc/hosts for DNS probe and target
      ansible.builtin.shell: |
        awk \
          -v h1="{{ dns_probe_hostname | lower }}" \
          -v h2="{{ dns_target_hostname | lower }}" '
          /^[[:space:]]*#/ {next}

          {
            for (i=2; i<=NF; i++) {
              if (
                tolower($i) == h1 ||
                tolower($i) == h2
              ) {
                print $0
              }
            }
          }
        ' /etc/hosts 2>/dev/null
      args:
        executable: /bin/bash
      register: hosts_override
      changed_when: false
      failed_when: false


    - name: Set hosts override status
      ansible.builtin.set_fact:
        hosts_override_present: >-
          {{
            hosts_override.stdout | trim | length > 0
          }}


    - name: Display hosts override
      ansible.builtin.debug:
        msg:
          - "Hosts override detected: {{ hosts_override_present }}"
          - >-
            Matching entries:
            {{
              hosts_override.stdout | trim
              if hosts_override.stdout | trim | length > 0
              else 'NONE'
            }}
          - "NSS hosts order: {{ nss_hosts_order }}"


    # ============================================================
    # 12. SYSTEM DNS LOOKUPS
    # ============================================================

    - name: Test control hostname IPv4 resolution
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: primary_ipv4
      changed_when: false
      failed_when: false


    - name: Test secondary hostname IPv4 resolution
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_secondary_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: secondary_ipv4
      changed_when: false
      failed_when: false


    - name: Test target hostname IPv4 resolution
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_target_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: target_ipv4
      changed_when: false
      failed_when: false


    - name: Set IPv4 lookup results
      ansible.builtin.set_fact:
        primary_ipv4_ok: >-
          {{
            primary_ipv4.stdout | trim | length > 0
          }}

        secondary_ipv4_ok: >-
          {{
            secondary_ipv4.stdout | trim | length > 0
          }}

        target_ipv4_ok: >-
          {{
            target_ipv4.stdout | trim | length > 0
          }}


    # ============================================================
    # 13. IPv6 SYSTEM LOOKUP
    # ============================================================

    - name: Test control hostname IPv6 resolution
      ansible.builtin.shell: |
        getent ahostsv6 "{{ dns_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: primary_ipv6
      changed_when: false
      failed_when: false
      when: ipv6_connectivity_present


    - name: Set IPv6 lookup result
      ansible.builtin.set_fact:
        primary_ipv6_ok: >-
          {{
            (
              primary_ipv6.stdout
              | default('')
              | trim
              | length > 0
            )
            if ipv6_connectivity_present
            else false
          }}


    # ============================================================
    # 14. NONEXISTENT HOSTNAME TEST
    # ============================================================

    - name: Test nonexistent hostname
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_nonexistent_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: nonexistent_lookup
      changed_when: false
      failed_when: false


    - name: Set nonexistent hostname result
      ansible.builtin.set_fact:
        nonexistent_record_failed: >-
          {{
            nonexistent_lookup.stdout | trim | length == 0
          }}


    # ============================================================
    # 15. DIRECT DNS TEST USING DIG
    # ============================================================

    - name: Direct test configured DNS servers using dig
      ansible.builtin.shell: |
        result=$(
          dig +time=3 +tries=1 \
          @"{{ item }}" \
          "{{ dns_probe_hostname }}" \
          2>&1
        )

        if echo "$result" | grep -q "status: NOERROR"; then
          echo "{{ item }}=DNS_OK"

        elif echo "$result" | grep -q "status: NXDOMAIN"; then
          echo "{{ item }}=NXDOMAIN"

        elif echo "$result" | grep -q "status: SERVFAIL"; then
          echo "{{ item }}=SERVFAIL"

        elif echo "$result" | grep -qi \
          "connection timed out\|communications error"; then
          echo "{{ item }}=TIMEOUT"

        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_effective_test_servers }}"
      register: direct_dns_dig
      changed_when: false
      failed_when: false
      when:
        - dns_has_dig
        - dns_effective_test_servers | length > 0


    # ============================================================
    # 16. DIRECT DNS TEST USING NSLOOKUP
    # ============================================================

    - name: Direct test configured DNS servers using nslookup
      ansible.builtin.shell: |
        result=$(
          nslookup \
          "{{ dns_probe_hostname }}" \
          "{{ item }}" \
          2>&1
        )

        if echo "$result" | grep -qi \
          "server can't find.*NXDOMAIN\|Non-existent domain"; then
          echo "{{ item }}=NXDOMAIN"

        elif echo "$result" | grep -qi \
          "SERVFAIL\|server failure"; then
          echo "{{ item }}=SERVFAIL"

        elif echo "$result" | grep -qi \
          "timed out\|no servers could be reached"; then
          echo "{{ item }}=TIMEOUT"

        elif echo "$result" | grep -qi "^Address: "; then
          echo "{{ item }}=DNS_OK"

        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_effective_test_servers }}"
      register: direct_dns_nslookup
      changed_when: false
      failed_when: false
      when:
        - not dns_has_dig
        - dns_has_nslookup
        - dns_effective_test_servers | length > 0


    - name: Build direct DNS result
      ansible.builtin.set_fact:
        direct_dns_result: >-
          {{
            (
              (direct_dns_dig.results | default([]))
              +
              (direct_dns_nslookup.results | default([]))
            )
            | map(attribute='stdout')
            | select('defined')
            | map('trim')
            | list
            | join('\n')
          }}

        dns_direct_test_available: >-
          {{
            dns_has_dig or dns_has_nslookup
          }}


    # ============================================================
    # 17. DIRECT TARGET DNS TEST
    # ============================================================

    - name: Direct target DNS test using dig
      ansible.builtin.shell: |
        result=$(
          dig +time=3 +tries=1 \
          @"{{ item }}" \
          "{{ dns_target_hostname }}" \
          2>&1
        )

        if echo "$result" | grep -q "status: NOERROR"; then
          echo "{{ item }}=DNS_OK"

        elif echo "$result" | grep -q "status: NXDOMAIN"; then
          echo "{{ item }}=NXDOMAIN"

        elif echo "$result" | grep -q "status: SERVFAIL"; then
          echo "{{ item }}=SERVFAIL"

        elif echo "$result" | grep -qi \
          "connection timed out\|communications error"; then
          echo "{{ item }}=TIMEOUT"

        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_effective_test_servers }}"
      register: target_dns_dig
      changed_when: false
      failed_when: false
      when:
        - dns_has_dig
        - dns_effective_test_servers | length > 0


    - name: Direct target DNS test using nslookup
      ansible.builtin.shell: |
        result=$(
          nslookup \
          "{{ dns_target_hostname }}" \
          "{{ item }}" \
          2>&1
        )

        if echo "$result" | grep -qi \
          "server can't find.*NXDOMAIN\|Non-existent domain"; then
          echo "{{ item }}=NXDOMAIN"

        elif echo "$result" | grep -qi \
          "SERVFAIL\|server failure"; then
          echo "{{ item }}=SERVFAIL"

        elif echo "$result" | grep -qi \
          "timed out\|no servers could be reached"; then
          echo "{{ item }}=TIMEOUT"

        elif echo "$result" | grep -qi "^Address: "; then
          echo "{{ item }}=DNS_OK"

        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_effective_test_servers }}"
      register: target_dns_nslookup
      changed_when: false
      failed_when: false
      when:
        - not dns_has_dig
        - dns_has_nslookup
        - dns_effective_test_servers | length > 0


    - name: Build target DNS result
      ansible.builtin.set_fact:
        target_direct_dns_result: >-
          {{
            (
              (target_dns_dig.results | default([]))
              +
              (target_dns_nslookup.results | default([]))
            )
            | map(attribute='stdout')
            | select('defined')
            | map('trim')
            | list
            | join('\n')
          }}


    # ============================================================
    # 18. DIRECT PUBLIC DNS TEST
    # ============================================================

    - name: Test public DNS servers using dig
      ansible.builtin.shell: |
        result=$(
          dig +time=3 +tries=1 \
          @"{{ item }}" \
          "{{ dns_probe_hostname }}" \
          2>&1
        )

        if echo "$result" | grep -q "status: NOERROR"; then
          echo "{{ item }}=DNS_OK"

        elif echo "$result" | grep -q "status: NXDOMAIN"; then
          echo "{{ item }}=NXDOMAIN"

        elif echo "$result" | grep -q "status: SERVFAIL"; then
          echo "{{ item }}=SERVFAIL"

        elif echo "$result" | grep -qi \
          "connection timed out\|communications error"; then
          echo "{{ item }}=TIMEOUT"

        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_public_servers }}"
      register: public_dns_dig
      changed_when: false
      failed_when: false
      when: dns_has_dig


    - name: Test public DNS servers using nslookup
      ansible.builtin.shell: |
        result=$(
          nslookup \
          "{{ dns_probe_hostname }}" \
          "{{ item }}" \
          2>&1
        )

        if echo "$result" | grep -qi "^Address: "; then
          echo "{{ item }}=DNS_OK"

        elif echo "$result" | grep -qi \
          "SERVFAIL\|server failure"; then
          echo "{{ item }}=SERVFAIL"

        elif echo "$result" | grep -qi \
          "timed out\|no servers could be reached"; then
          echo "{{ item }}=TIMEOUT"

        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_public_servers }}"
      register: public_dns_nslookup
      changed_when: false
      failed_when: false
      when:
        - not dns_has_dig
        - dns_has_nslookup


    - name: Build public DNS result
      ansible.builtin.set_fact:
        public_dns_result: >-
          {{
            (
              (public_dns_dig.results | default([]))
              +
              (public_dns_nslookup.results | default([]))
            )
            | map(attribute='stdout')
            | select('defined')
            | map('trim')
            | list
            | join('\n')
          }}


    - name: Determine public DNS availability
      ansible.builtin.set_fact:
        public_dns_available: >-
          {{
            public_dns_result is search('=DNS_OK')
          }}


    # ============================================================
    # 19. DIAGNOSTIC FLAGS
    # ============================================================

    - name: Detect DNS timeout
      ansible.builtin.set_fact:
        dns_timeout_detected: >-
          {{
            (
              direct_dns_result is search('=TIMEOUT')
              or
              target_direct_dns_result is search('=TIMEOUT')
            )
          }}


    - name: Detect configured DNS failure
      ansible.builtin.set_fact:
        configured_dns_failure_detected: >-
          {{
            dns_direct_test_available
            and
            dns_effective_test_servers | length > 0
            and
            (
              direct_dns_result is search('=SERVFAIL')
              or
              direct_dns_result is search('=DNS_ERROR')
            )
            and
            not direct_dns_result is search('=DNS_OK')
          }}


    - name: Detect DNS record not found
      ansible.builtin.set_fact:
        dns_record_not_found_detected: >-
          {{
            dns_direct_test_available
            and
            primary_ipv4_ok
            and
            not target_ipv4_ok
            and
            target_direct_dns_result is search('=NXDOMAIN')
            and
            not target_direct_dns_result is search('=DNS_OK')
          }}


    - name: Detect IPv6 DNS failure
      ansible.builtin.set_fact:
        ipv6_dns_failure_detected: >-
          {{
            ipv6_connectivity_present
            and
            primary_ipv4_ok
            and
            not primary_ipv6_ok
            and
            dns_nameservers | length > 0
            and
            dns_direct_test_available
            and
            direct_dns_result is search('=DNS_OK')
          }}


    - name: Detect local resolver/cache failure
      ansible.builtin.set_fact:
        local_resolver_failure_detected: >-
          {{
            dns_direct_test_available
            and
            local_resolver_present
            and
            primary_ipv4_ok == false
            and
            direct_dns_result is search('=DNS_OK')
            and
            not direct_dns_result is search('=SERVFAIL')
            and
            not direct_dns_result is search('=DNS_ERROR')
            and
            not direct_dns_result is search('=TIMEOUT')
          }}


    - name: Detect public DNS unavailable
      ansible.builtin.set_fact:
        public_dns_unavailable_detected: >-
          {{
            dns_direct_test_available
            and
            public_dns_result | length > 0
            and
            not public_dns_available
            and
            not public_dns_result is search('=NXDOMAIN')
          }}


    # ============================================================
    # 20. SINGLE DETERMINISTIC CLASSIFICATION
    # ============================================================

    - name: Determine final DNS classification
      ansible.builtin.set_fact:
        dns_classification_name: >-
          {% if hosts_override_present %}
          HOSTS_FILE_OVERRIDE_POSSIBLE

          {% elif dns_network_status in ['NO_GATEWAY', 'UNREACHABLE'] %}
          NETWORK_OR_GATEWAY_FAILURE

          {% elif dns_nameservers | length == 0
                and dns_network_status in ['REACHABLE', 'BLOCKS_ICMP'] %}
          NO_DNS_SERVER_CONFIGURED

          {% elif dns_timeout_detected
                and dns_direct_test_available
                and not primary_ipv4_ok %}
          DNS_TIMEOUT

          {% elif configured_dns_failure_detected
                and not public_dns_available %}
          CONFIGURED_DNS_SERVER_FAILURE

          {% elif local_resolver_failure_detected %}
          LOCAL_RESOLVER_OR_CACHE_FAILURE

          {% elif dns_record_not_found_detected %}
          DNS_RECORD_NOT_FOUND

          {% elif public_dns_unavailable_detected
                and not primary_ipv4_ok
                and not configured_dns_failure_detected %}
          PUBLIC_DNS_UNAVAILABLE

          {% elif ipv6_dns_failure_detected %}
          IPV6_DNS_FAILURE

          {% elif primary_ipv4_ok
                and target_ipv4_ok
                and dns_nameservers | length > 0
                and not (
                  ipv6_connectivity_present
                  and not primary_ipv6_ok
                ) %}
          RESOLUTION_WORKING

          {% else %}
          DNS_FAILURE_UNDETERMINED
          {% endif %}


    # ============================================================
    # 21. CLASSIFICATION REASON
    # ============================================================

    - name: Set DNS classification reason
      ansible.builtin.set_fact:
        dns_classification_reason: >-
          {% if dns_classification_name
                == 'HOSTS_FILE_OVERRIDE_POSSIBLE' %}
          The investigated hostname is present in /etc/hosts.
          Local hosts-file resolution may bypass DNS.

          {% elif dns_classification_name
                == 'NETWORK_OR_GATEWAY_FAILURE' %}
          No usable default gateway or network path was confirmed.

          {% elif dns_classification_name
                == 'NO_DNS_SERVER_CONFIGURED' %}
          No nameserver is configured in /etc/resolv.conf.

          {% elif dns_classification_name
                == 'DNS_TIMEOUT' %}
          Direct DNS testing detected a timeout while system DNS
          resolution also failed.

          {% elif dns_classification_name
                == 'CONFIGURED_DNS_SERVER_FAILURE' %}
          Configured DNS servers returned DNS errors or SERVFAIL
          during direct DNS testing.

          {% elif dns_classification_name
                == 'LOCAL_RESOLVER_OR_CACHE_FAILURE' %}
          Direct queries to configured upstream DNS succeeded,
          while the local resolver/NSS lookup path failed.

          {% elif dns_classification_name
                == 'DNS_RECORD_NOT_FOUND' %}
          Direct DNS testing returned NXDOMAIN for the target
          hostname while the control hostname resolved.

          {% elif dns_classification_name
                == 'PUBLIC_DNS_UNAVAILABLE' %}
          Public DNS servers were unavailable during direct DNS
          testing.

          {% elif dns_classification_name
                == 'IPV6_DNS_FAILURE' %}
          IPv6 connectivity exists, IPv4 DNS works, upstream DNS
          responds, but IPv6 hostname resolution failed.

          {% elif dns_classification_name
                == 'RESOLUTION_WORKING' %}
          Control and target hostnames resolved successfully.

          {% else %}
          Available evidence does not uniquely identify the DNS
          failure cause. No automatic DNS/network configuration
          change will be performed.
          {% endif %}


    # ============================================================
    # 22. SAFE REMEDIATION DECISION
    # ============================================================

    - name: Determine whether automatic DNS remediation is safe
      ansible.builtin.set_fact:
        safe_dns_remediation_allowed: >-
          {{
            dns_classification_name
            == 'LOCAL_RESOLVER_OR_CACHE_FAILURE'
          }}


    - name: Display remediation decision
      ansible.builtin.debug:
        msg:
          - "DNS classification: {{ dns_classification_name }}"
          - "Automatic remediation allowed: {{ safe_dns_remediation_allowed }}"


    # ============================================================
    # 23. CHECK SYSTEMD-RESOLVED
    # ============================================================

    - name: Check systemd-resolved service
      ansible.builtin.systemd:
        name: systemd-resolved
      register: systemd_resolved_status
      changed_when: false
      failed_when: false


    # ============================================================
    # 24. CHECK NSCD
    # ============================================================

    - name: Check nscd service
      ansible.builtin.systemd:
        name: nscd
      register: nscd_status
      changed_when: false
      failed_when: false


    # ============================================================
    # 25. SAFE REMEDIATION - SYSTEMD-RESOLVED
    # ============================================================

    - name: Flush systemd-resolved cache
      ansible.builtin.command:
        cmd: resolvectl flush-caches
      register: resolved_flush
      changed_when: false
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - dns_has_resolvectl
        - systemd_resolved_status.status is defined
        - systemd_resolved_status.status.LoadState | default('not-found') == 'loaded'


    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      register: resolved_restart
      changed_when: true
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - systemd_resolved_status.status is defined
        - systemd_resolved_status.status.LoadState | default('not-found') == 'loaded'


    # ============================================================
    # 26. SAFE REMEDIATION - NSCD
    # ============================================================

    - name: Restart nscd
      ansible.builtin.systemd:
        name: nscd
        state: restarted
      register: nscd_restart
      changed_when: true
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - nscd_status.status is defined
        - nscd_status.status.LoadState | default('not-found') == 'loaded'


    - name: Determine whether remediation was performed
      ansible.builtin.set_fact:
        remediation_performed: >-
          {{
            (
              resolved_restart is defined
              and
              resolved_restart.changed | default(false)
            )
            or
            (
              nscd_restart is defined
              and
              nscd_restart.changed | default(false)
            )
          }}


    # ============================================================
    # 27. VALIDATE AFTER REMEDIATION
    # ============================================================

    - name: Validate DNS after remediation
      ansible.builtin.shell: |
        attempt=1

        while [ "$attempt" -le "{{ dns_validation_attempts }}" ]; do

          if getent ahostsv4 \
            "{{ dns_probe_hostname }}" \
            >/dev/null 2>&1; then

            echo "RESOLVED"
            exit 0
          fi

          sleep "{{ dns_validation_delay }}"
          attempt=$((attempt + 1))

        done

        echo "FAILED"
        exit 1
      args:
        executable: /bin/bash
      register: dns_validation
      changed_when: false
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - remediation_performed


    - name: Set DNS validation result
      ansible.builtin.set_fact:
        dns_validation_result: >-
          {{
            dns_validation.stdout | trim
            if (
              safe_dns_remediation_allowed
              and remediation_performed
            )
            else 'NOT_REQUIRED'
          }}


    # ============================================================
    # 28. CREATE LOG DIRECTORY
    # ============================================================

    - name: Create PiQuickHeal log directory
      ansible.builtin.file:
        path: "{{ dns_log_file | dirname }}"
        state: directory
        mode: "0755"
      failed_when: false


    # ============================================================
    # 29. WRITE LOG
    # ============================================================

    - name: Write DNS diagnosis log
      ansible.builtin.shell: |
        {
          echo "=================================================="
          echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S')"
          echo "host={{ inventory_hostname }}"
          echo "target={{ dns_target_hostname }}"
          echo "classification={{ dns_classification_name }}"
          echo "reason={{ dns_classification_reason | replace('\n', ' ') }}"
          echo "nameservers={{ dns_nameservers | join(',') }}"
          echo "effective_dns={{ dns_effective_test_servers | join(',') }}"
          echo "network_status={{ dns_network_status }}"
          echo "gateway={{ dns_gateway }}"
          echo "hosts_override={{ hosts_override_present }}"
          echo "ipv4_control={{ primary_ipv4_ok }}"
          echo "ipv4_secondary={{ secondary_ipv4_ok }}"
          echo "ipv4_target={{ target_ipv4_ok }}"
          echo "ipv6_connectivity={{ ipv6_connectivity_present }}"
          echo "ipv6_resolution={{ primary_ipv6_ok }}"
          echo "direct_dns_available={{ dns_direct_test_available }}"
          echo "direct_dns_result={{ direct_dns_result | replace('\n', ';') }}"
          echo "target_direct_dns={{ target_direct_dns_result | replace('\n', ';') }}"
          echo "public_dns={{ public_dns_result | replace('\n', ';') }}"
          echo "safe_remediation={{ safe_dns_remediation_allowed }}"
          echo "remediation_performed={{ remediation_performed }}"
          echo "validation={{ dns_validation_result }}"
          echo "=================================================="
        } >> "{{ dns_log_file }}"
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false


    # ============================================================
    # 30. FINAL RESULT
    # ============================================================

    - name: Display final DNS diagnosis
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "PIQUICKHEAL DNS DIAGNOSIS RESULT"
          - "=================================================="
          - "Classification: {{ dns_classification_name }}"
          - "Reason: {{ dns_classification_reason | trim }}"
          - "Target hostname: {{ dns_target_hostname }}"
          - >-
            Nameservers:
            {{
              dns_nameservers | join(', ')
              if dns_nameservers | length > 0
              else 'NONE'
            }}
          - >-
            Effective DNS servers:
            {{
              dns_effective_test_servers | join(', ')
              if dns_effective_test_servers | length > 0
              else 'NONE'
            }}
          - "Network status: {{ dns_network_status }}"
          - "Gateway: {{ dns_gateway | default('NONE') }}"
          - "Hosts override: {{ hosts_override_present }}"
          - "NSS hosts order: {{ nss_hosts_order }}"
          - "Control IPv4: {{ 'OK' if primary_ipv4_ok else 'FAIL' }}"
          - "Secondary IPv4: {{ 'OK' if secondary_ipv4_ok else 'FAIL' }}"
          - "Target IPv4: {{ 'OK' if target_ipv4_ok else 'FAIL' }}"
          - "IPv6 connectivity: {{ ipv6_connectivity_present }}"
          - >-
            IPv6 resolution:
            {{
              'OK'
              if primary_ipv6_ok
              else 'FAIL'
              if ipv6_connectivity_present
              else 'NOT_APPLICABLE'
            }}
          - "Direct DNS available: {{ dns_direct_test_available }}"
          - >-
            Direct DNS:
            {{
              direct_dns_result
              if direct_dns_result | length > 0
              else 'NOT_AVAILABLE'
            }}
          - >-
            Target direct DNS:
            {{
              target_direct_dns_result
              if target_direct_dns_result | length > 0
              else 'NOT_AVAILABLE'
            }}
          - >-
            Public DNS:
            {{
              public_dns_result
              if public_dns_result | length > 0
              else 'NOT_AVAILABLE'
            }}
          - "Automatic remediation allowed: {{ safe_dns_remediation_allowed }}"
          - "Remediation performed: {{ remediation_performed }}"
          - "Validation: {{ dns_validation_result }}"
          - "Log: {{ dns_log_file }}"
          - "=================================================="
