---
# =============================================================================
# PiQuickHeal - Dynamic DNS Failure Diagnosis and Remediation
#
# ONE PLAYBOOK / TWO AWX JOB TEMPLATES
#
# 1. Diagnose Template
#    Job Tags: diagnose
#    Extra Vars:
#      execution_mode: diagnose
#
# 2. Remediate Template
#    Job Tags: remediate
#    Extra Vars:
#      execution_mode: remediate
#      approved_dns_action: RESTORE_DNS_CONFIG
#      approved_dns_servers_input:
#        - 161.26.0.10
#        - 161.26.0.11
#
# IMPORTANT:
# - Diagnosis is conservative.
# - Remediation requires explicit human approval.
# - Do not blindly replace DNS configuration.
# - Do not modify routes/firewall/interfaces.
# - Do not modify external DNS records.
# =============================================================================

- name: PiQuickHeal - DNS Diagnosis and Remediation
  hosts: all
  become: true
  gather_facts: true

  vars:

    # -------------------------------------------------------------------------
    # Execution mode
    # -------------------------------------------------------------------------
    dns_execution_mode: "{{ execution_mode | default('diagnose') }}"

    # Approved action supplied by human/AWX
    dns_remediation_action: "{{ approved_dns_action | default('NONE') }}"

    # Approved DNS servers supplied by human/AWX
    approved_dns_servers: >-
      {{
        approved_dns_servers_input
        | default([])
      }}

    # -------------------------------------------------------------------------
    # DNS test configuration
    # -------------------------------------------------------------------------
    dns_test_hostname: "example.com"

    # Public DNS is used only as a diagnostic reference.
    # These are NOT automatically used for remediation.
    dns_public_servers:
      - "1.1.1.1"
      - "8.8.8.8"

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    dns_log_file: "/var/log/piquickheal/dns_resolution.log"

    # -------------------------------------------------------------------------
    # Supported local resolver services
    # Only an actually active service will be considered for restart.
    # -------------------------------------------------------------------------
    dns_resolver_services:
      - systemd-resolved
      - dnsmasq
      - named
      - bind9
      - unbound

  # ===========================================================================
  # PRE-CHECK
  # ===========================================================================

  tasks:

    - name: Validate DNS execution mode
      ansible.builtin.assert:
        that:
          - dns_execution_mode in ['diagnose', 'remediate']
        fail_msg: >-
          Invalid execution_mode='{{ dns_execution_mode }}'.
          Allowed values are diagnose or remediate.
      tags:
        - always


    # =========================================================================
    # DIAGNOSIS
    # =========================================================================

    - name: Show DNS diagnosis execution mode
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "PIQUICKHEAL DNS DIAGNOSIS"
          - "Execution mode: {{ dns_execution_mode }}"
          - "Target: {{ inventory_hostname }}"
          - "=============================================="
      when: dns_execution_mode == 'diagnose'
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Required command availability
    # -------------------------------------------------------------------------

    - name: Check dig availability
      ansible.builtin.command:
        cmd: "command -v dig"
      register: dns_dig_check
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Check nslookup availability
      ansible.builtin.command:
        cmd: "command -v nslookup"
      register: dns_nslookup_check
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Check resolvectl availability
      ansible.builtin.command:
        cmd: "command -v resolvectl"
      register: dns_resolvectl_check
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Check getent availability
      ansible.builtin.command:
        cmd: "command -v getent"
      register: dns_getent_check
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Set DNS command availability facts
      ansible.builtin.set_fact:
        dns_has_dig: "{{ dns_dig_check.rc == 0 }}"
        dns_has_nslookup: "{{ dns_nslookup_check.rc == 0 }}"
        dns_has_resolvectl: "{{ dns_resolvectl_check.rc == 0 }}"
        dns_has_getent: "{{ dns_getent_check.rc == 0 }}"
      tags:
        - diagnose


    - name: Show DNS command availability
      ansible.builtin.debug:
        msg:
          - "dig available: {{ dns_has_dig }}"
          - "nslookup available: {{ dns_has_nslookup }}"
          - "resolvectl available: {{ dns_has_resolvectl }}"
          - "getent available: {{ dns_has_getent }}"
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # /etc/resolv.conf
    # -------------------------------------------------------------------------

    - name: Check /etc/resolv.conf
      ansible.builtin.stat:
        path: /etc/resolv.conf
        follow: false
      register: dns_resolv_conf_stat
      tags:
        - diagnose
        - remediate


    - name: Read /etc/resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: dns_resolv_conf
      failed_when: false
      tags:
        - diagnose


    - name: Set resolv.conf content
      ansible.builtin.set_fact:
        dns_resolv_conf_content: >-
          {{
            dns_resolv_conf.content | default('')
            | b64decode
          }}
      tags:
        - diagnose


    # IMPORTANT:
    # Use [ \t] rather than POSIX [[:space:]].
    # This prevents the previous malformed parsing:
    # 192.0.2.1\nameserver
    - name: Extract configured DNS servers
      ansible.builtin.set_fact:
        dns_nameservers: >-
          {{
            dns_resolv_conf_content
            | regex_findall(
                '(?im)^[ \t]*nameserver[ \t]+([^ \t#;]+)'
              )
            | unique
            | list
          }}
      tags:
        - diagnose


    - name: Check whether resolv.conf is a symlink
      ansible.builtin.set_fact:
        dns_resolv_conf_is_symlink: >-
          {{
            dns_resolv_conf_stat.islnk
            | default(false)
          }}
      tags:
        - diagnose


    - name: Show resolv.conf DNS configuration
      ansible.builtin.debug:
        msg:
          - "resolv.conf is symlink: {{ dns_resolv_conf_is_symlink }}"
          - >-
            resolv.conf nameservers:
            {{
              dns_nameservers | join(', ')
              if (dns_nameservers | length > 0)
              else 'NONE'
            }}
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Local resolver detection
    # -------------------------------------------------------------------------

    - name: Check supported local DNS resolver services
      ansible.builtin.command:
        cmd: "systemctl is-active {{ item }}"
      loop: "{{ dns_resolver_services }}"
      register: dns_resolver_service_checks
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Determine active local DNS resolver services
      ansible.builtin.set_fact:
        dns_active_resolver_services: >-
          {{
            dns_resolver_service_checks.results
            | selectattr('stdout', 'equalto', 'active')
            | map(attribute='item')
            | list
          }}
      tags:
        - diagnose


    - name: Show local resolver status
      ansible.builtin.debug:
        msg:
          - >-
            Active local DNS resolver services:
            {{
              dns_active_resolver_services | join(', ')
              if (dns_active_resolver_services | length > 0)
              else 'NONE'
            }}
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # NSS configuration
    # -------------------------------------------------------------------------

    - name: Read NSS hosts configuration
      ansible.builtin.shell:
        cmd: "grep -E '^[[:space:]]*hosts:' /etc/nsswitch.conf || true"
      register: dns_nss_hosts
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Show NSS hosts configuration
      ansible.builtin.debug:
        msg:
          - "NSS hosts configuration:"
          - "{{ dns_nss_hosts.stdout | default('NOT FOUND') }}"
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # /etc/hosts override check
    # -------------------------------------------------------------------------

    - name: Check /etc/hosts for target hostname
      ansible.builtin.shell:
        cmd: >-
          grep -E
          '^[[:space:]]*[^#[:space:]]+[[:space:]]+{{ dns_test_hostname }}([[:space:]]|$)'
          /etc/hosts || true
      register: dns_hosts_override
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Set hosts override fact
      ansible.builtin.set_fact:
        dns_has_hosts_override: >-
          {{
            (dns_hosts_override.stdout | default('') | trim | length) > 0
          }}
      tags:
        - diagnose


    - name: Show hosts override status
      ansible.builtin.debug:
        msg:
          - "Hosts override: {{ dns_has_hosts_override }}"
          - >-
            {{
              dns_hosts_override.stdout
              if dns_has_hosts_override
              else 'No matching /etc/hosts entry'
            }}
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Default route / network reachability
    # -------------------------------------------------------------------------

    - name: Get default IPv4 route
      ansible.builtin.command:
        cmd: "ip -4 route show default"
      register: dns_default_route
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Extract default gateway
      ansible.builtin.set_fact:
        dns_default_gateway: >-
          {{
            dns_default_route.stdout
            | regex_search('default via [0-9a-fA-F:.]+')
            | default('', true)
            | regex_replace('^default via ', '')
          }}
      tags:
        - diagnose


    - name: Check gateway reachability
      ansible.builtin.command:
        cmd: "ping -c 1 -W 2 {{ dns_default_gateway }}"
      register: dns_gateway_ping
      changed_when: false
      failed_when: false
      when: dns_default_gateway | length > 0
      tags:
        - diagnose


    - name: Set network reachability fact
      ansible.builtin.set_fact:
        dns_network_reachable: >-
          {{
            (
              dns_default_gateway | length > 0
              and
              dns_gateway_ping.rc | default(1) == 0
            )
          }}
      tags:
        - diagnose


    - name: Show network status
      ansible.builtin.debug:
        msg:
          - "Default gateway: {{ dns_default_gateway | default('NONE') }}"
          - "Network reachable: {{ dns_network_reachable }}"
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # IPv6 connectivity
    # -------------------------------------------------------------------------

    - name: Check IPv6 connectivity
      ansible.builtin.command:
        cmd: "ping6 -c 1 -W 2 2001:4860:4860::8888"
      register: dns_ipv6_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    - name: Set IPv6 connectivity fact
      ansible.builtin.set_fact:
        dns_ipv6_reachable: "{{ dns_ipv6_test.rc == 0 }}"
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # DNS resolution through system resolver
    # -------------------------------------------------------------------------

    - name: Test hostname using getent
      ansible.builtin.command:
        cmd: "getent ahosts {{ dns_test_hostname }}"
      register: dns_getent_test
      changed_when: false
      failed_when: false
      when: dns_has_getent
      tags:
        - diagnose


    - name: Set system DNS resolution result
      ansible.builtin.set_fact:
        dns_system_resolution_ok: >-
          {{
            dns_has_getent
            and
            (dns_getent_test.rc | default(1) == 0)
            and
            (dns_getent_test.stdout | default('') | trim | length > 0)
            and
            not dns_has_hosts_override
          }}
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Direct DNS testing using dig, when available
    # -------------------------------------------------------------------------

    - name: Test configured DNS servers with dig
      ansible.builtin.command:
        cmd: >-
          dig
          +time=2
          +tries=1
          +short
          @{{ item }}
          {{ dns_test_hostname }}
      loop: "{{ dns_nameservers }}"
      register: dns_direct_tests
      changed_when: false
      failed_when: false
      when:
        - dns_has_dig
        - dns_nameservers | length > 0
      tags:
        - diagnose


    - name: Determine direct DNS server results
      ansible.builtin.set_fact:
        dns_direct_server_results: >-
          {{
            dns_direct_tests.results
            | default([])
            | map(
                attribute='item'
              )
            | list
          }}
      when:
        - dns_has_dig
        - dns_nameservers | length > 0
      tags:
        - diagnose


    - name: Determine whether all configured DNS servers failed
      ansible.builtin.set_fact:
        dns_all_configured_servers_failed: >-
          {{
            (
              dns_direct_tests.results | default([])
              | length > 0
            )
            and
            (
              dns_direct_tests.results
              | selectattr('rc', 'ne', 0)
              | list
              | length
              ==
              dns_direct_tests.results | length
            )
          }}
      when:
        - dns_has_dig
        - dns_nameservers | length > 0
      tags:
        - diagnose


    - name: Determine whether at least one configured DNS server works
      ansible.builtin.set_fact:
        dns_any_configured_server_works: >-
          {{
            dns_direct_tests.results | default([])
            | selectattr('rc', 'equalto', 0)
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'search', '\\S')
            | list
            | length > 0
          }}
      when:
        - dns_has_dig
        - dns_nameservers | length > 0
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Public DNS diagnostic comparison
    # -------------------------------------------------------------------------

    - name: Test public DNS servers with dig
      ansible.builtin.command:
        cmd: >-
          dig
          +time=2
          +tries=1
          +short
          @{{ item }}
          {{ dns_test_hostname }}
      loop: "{{ dns_public_servers }}"
      register: dns_public_tests
      changed_when: false
      failed_when: false
      when: dns_has_dig
      tags:
        - diagnose


    - name: Determine public DNS resolution result
      ansible.builtin.set_fact:
        dns_public_resolution_ok: >-
          {{
            dns_public_tests.results | default([])
            | selectattr('rc', 'equalto', 0)
            | selectattr('stdout', 'search', '\\S')
            | list
            | length > 0
          }}
      when: dns_has_dig
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Optional nslookup fallback
    # -------------------------------------------------------------------------

    - name: Test DNS using nslookup
      ansible.builtin.command:
        cmd: >-
          nslookup
          {{ dns_test_hostname }}
          {{ dns_nameservers[0] }}
      register: dns_nslookup_test
      changed_when: false
      failed_when: false
      when:
        - dns_has_nslookup
        - not dns_has_dig
        - dns_nameservers | length > 0
      tags:
        - diagnose


    - name: Set nslookup result
      ansible.builtin.set_fact:
        dns_nslookup_resolution_ok: >-
          {{
            dns_nslookup_test.rc | default(1) == 0
            and
            (
              dns_nslookup_test.stdout
              | default('')
              | regex_search(
                  'Address:|Name:|canonical name'
                )
              is not none
            )
          }}
      when:
        - dns_has_nslookup
        - not dns_has_dig
        - dns_nameservers | length > 0
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Optional resolvectl fallback
    # -------------------------------------------------------------------------

    - name: Test DNS using resolvectl
      ansible.builtin.command:
        cmd: "resolvectl query {{ dns_test_hostname }}"
      register: dns_resolvectl_test
      changed_when: false
      failed_when: false
      when:
        - dns_has_resolvectl
        - not dns_has_dig
        - not dns_has_nslookup
      tags:
        - diagnose


    - name: Set resolvectl result
      ansible.builtin.set_fact:
        dns_resolvectl_resolution_ok: >-
          {{
            dns_resolvectl_test.rc | default(1) == 0
            and
            (
              dns_resolvectl_test.stdout
              | default('')
              | trim
              | length > 0
            )
          }}
      when:
        - dns_has_resolvectl
        - not dns_has_dig
        - not dns_has_nslookup
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # DNS diagnosis classification
    # -------------------------------------------------------------------------

    - name: Classify DNS condition - no DNS configuration
      ansible.builtin.set_fact:
        dns_classification: "NO_DNS_SERVER_CONFIGURED"
        dns_recommended_action: "RESTORE_DNS_CONFIG"
        dns_risk_level: "HIGH"
      when:
        - dns_nameservers | length == 0
      tags:
        - diagnose


    - name: Classify DNS condition - hosts override
      ansible.builtin.set_fact:
        dns_classification: "HOSTS_FILE_OVERRIDE"
        dns_recommended_action: "REMOVE_HOSTS_OVERRIDE"
        dns_risk_level: "MEDIUM"
      when:
        - dns_nameservers | length > 0
        - dns_has_hosts_override
      tags:
        - diagnose


    - name: Classify DNS condition - direct DNS works
      ansible.builtin.set_fact:
        dns_classification: "DNS_SERVER_REACHABLE"
        dns_recommended_action: "NO_REMEDIATION"
        dns_risk_level: "LOW"
      when:
        - dns_nameservers | length > 0
        - not dns_has_hosts_override
        - dns_any_configured_server_works | default(false)
      tags:
        - diagnose


    - name: Classify DNS condition - all configured DNS servers fail
      ansible.builtin.set_fact:
        dns_classification: "CONFIGURED_DNS_SERVERS_FAILED"
        dns_recommended_action: "RESTORE_DNS_CONFIG"
        dns_risk_level: "HIGH"
      when:
        - dns_nameservers | length > 0
        - not dns_has_hosts_override
        - dns_has_dig
        - dns_all_configured_servers_failed | default(false)
      tags:
        - diagnose


    - name: Classify DNS condition - system resolver fails but direct DNS is unavailable
      ansible.builtin.set_fact:
        dns_classification: "DNS_FAILURE_UNDETERMINED"
        dns_recommended_action: "INVESTIGATE"
        dns_risk_level: "HIGH"
      when:
        - dns_nameservers | length > 0
        - not dns_has_hosts_override
        - not (dns_any_configured_server_works | default(false))
        - not (
            dns_has_dig
            and
            dns_all_configured_servers_failed | default(false)
          )
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Diagnosis summary
    # -------------------------------------------------------------------------

    - name: Show DNS diagnosis summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PIQUICKHEAL DNS DIAGNOSIS SUMMARY"
          - "============================================================"
          - "Target: {{ inventory_hostname }}"
          - "Hostname tested: {{ dns_test_hostname }}"
          - "Execution mode: {{ dns_execution_mode }}"
          - >-
            Configured DNS:
            {{
              dns_nameservers | join(', ')
              if dns_nameservers | length > 0
              else 'NONE'
            }}
          - "resolv.conf symlink: {{ dns_resolv_conf_is_symlink }}"
          - "Local resolver: {{ dns_active_resolver_services | join(', ') if dns_active_resolver_services | length > 0 else 'NONE' }}"
          - "Network reachable: {{ dns_network_reachable }}"
          - "IPv6 reachable: {{ dns_ipv6_reachable }}"
          - "Hosts override: {{ dns_has_hosts_override }}"
          - "System DNS resolution: {{ dns_system_resolution_ok }}"
          - "Direct DNS available: {{ dns_has_dig or dns_has_nslookup or dns_has_resolvectl }}"
          - "Classification: {{ dns_classification | default('UNDETERMINED') }}"
          - "Recommended action: {{ dns_recommended_action | default('INVESTIGATE') }}"
          - "Risk: {{ dns_risk_level | default('UNKNOWN') }}"
          - "============================================================"
      tags:
        - diagnose


    # -------------------------------------------------------------------------
    # Diagnosis log
    #
    # NOTE:
    # This creates/updates a file and therefore is technically a filesystem
    # change. Network/DNS configuration is not changed.
    # -------------------------------------------------------------------------

    - name: Write DNS diagnosis log
      ansible.builtin.copy:
        dest: "{{ dns_log_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          PiQuickHeal DNS Diagnosis
          =========================
          Timestamp: {{ ansible_date_time.iso8601 }}
          Host: {{ inventory_hostname }}

          Execution mode: {{ dns_execution_mode }}

          Configured DNS:
          {{ dns_nameservers | join(', ') if dns_nameservers | length > 0 else 'NONE' }}

          resolv.conf symlink: {{ dns_resolv_conf_is_symlink }}

          Local resolver:
          {{ dns_active_resolver_services | join(', ') if dns_active_resolver_services | length > 0 else 'NONE' }}

          Default gateway: {{ dns_default_gateway | default('NONE') }}

          Network reachable: {{ dns_network_reachable }}

          IPv6 reachable: {{ dns_ipv6_reachable }}

          Hosts override: {{ dns_has_hosts_override }}

          System DNS resolution: {{ dns_system_resolution_ok }}

          dig available: {{ dns_has_dig }}
          nslookup available: {{ dns_has_nslookup }}
          resolvectl available: {{ dns_has_resolvectl }}

          Classification: {{ dns_classification | default('UNDETERMINED') }}

          Recommended action: {{ dns_recommended_action | default('INVESTIGATE') }}

          Risk: {{ dns_risk_level | default('UNKNOWN') }}
      when:
        - dns_execution_mode == 'diagnose'
      tags:
        - diagnose


    # =========================================================================
    # REMEDIATION
    # =========================================================================

    - name: Show DNS remediation execution mode
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PIQUICKHEAL DNS REMEDIATION"
          - "Execution mode: {{ dns_execution_mode }}"
          - "Approved action: {{ dns_remediation_action }}"
          - "============================================================"
      when:
        - dns_execution_mode == 'remediate'
      tags:
        - remediate


    # -------------------------------------------------------------------------
    # Validate remediation action
    # -------------------------------------------------------------------------

    - name: Validate approved DNS remediation action
      ansible.builtin.assert:
        that:
          - dns_remediation_action in ['RESTORE_DNS_CONFIG']
        fail_msg: >-
          No valid DNS remediation action approved.
          Expected approved_dns_action=RESTORE_DNS_CONFIG.
      when:
        - dns_execution_mode == 'remediate'
      tags:
        - remediate


    # -------------------------------------------------------------------------
    # Validate approved DNS servers
    # -------------------------------------------------------------------------

    - name: Validate approved DNS servers are provided
      ansible.builtin.assert:
        that:
          - approved_dns_servers | length >= 1
          - approved_dns_servers | length <= 4
        fail_msg: >-
          approved_dns_servers_input must contain between 1 and 4
          approved DNS server addresses.
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    - name: Validate approved DNS server format
      ansible.builtin.assert:
        that:
          - item is match('^[0-9a-fA-F:.]+$')
        fail_msg: >-
          Invalid DNS server value: {{ item }}.
          Only IPv4/IPv6 address format is accepted.
      loop: "{{ approved_dns_servers }}"
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    # -------------------------------------------------------------------------
    # Human approval confirmation
    # -------------------------------------------------------------------------

    - name: Confirm DNS remediation execution
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "HUMAN-APPROVED DNS REMEDIATION"
          - "============================================================"
          - "Action: {{ dns_remediation_action }}"
          - "Approved DNS servers:"
          - "{{ approved_dns_servers | join(', ') }}"
          - "Target: {{ inventory_hostname }}"
          - "Execution mode: {{ dns_execution_mode }}"
          - "============================================================"
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    # -------------------------------------------------------------------------
    # Protect symlink-managed resolv.conf
    # -------------------------------------------------------------------------

    - name: Refuse direct modification of symlinked resolv.conf
      ansible.builtin.fail:
        msg: >-
          /etc/resolv.conf is a symlink.
          Direct replacement is intentionally blocked.
          Modify the owning DHCP/network/resolver configuration instead.
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
        - dns_resolv_conf_stat.islnk | default(false)
      tags:
        - remediate


    # -------------------------------------------------------------------------
    # Backup existing DNS configuration
    # -------------------------------------------------------------------------

    - name: Create timestamp for DNS backup
      ansible.builtin.set_fact:
        dns_backup_timestamp: "{{ ansible_date_time.epoch }}"
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    - name: Backup current resolv.conf
      ansible.builtin.copy:
        src: /etc/resolv.conf
        dest: "/etc/resolv.conf.piquickheal.{{ dns_backup_timestamp }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    # -------------------------------------------------------------------------
    # Restore approved DNS configuration
    # -------------------------------------------------------------------------

    - name: Restore approved DNS configuration
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by PiQuickHeal
          # Approved DNS configuration
          {% for dns_server in approved_dns_servers %}
          nameserver {{ dns_server }}
          {% endfor %}
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    # -------------------------------------------------------------------------
    # Verify resulting resolv.conf
    # -------------------------------------------------------------------------

    - name: Read updated resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: dns_updated_resolv_conf
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    - name: Extract updated DNS servers
      ansible.builtin.set_fact:
        dns_updated_nameservers: >-
          {{
            (
              dns_updated_resolv_conf.content
              | b64decode
            )
            | regex_findall(
                '(?im)^[ \t]*nameserver[ \t]+([^ \t#;]+)'
              )
            | unique
            | list
          }}
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    - name: Validate updated DNS configuration
      ansible.builtin.assert:
        that:
          - dns_updated_nameservers == approved_dns_servers
        fail_msg: >-
          DNS configuration validation failed.

          Expected:
          {{ approved_dns_servers | join(', ') }}

          Found:
          {{ dns_updated_nameservers | join(', ') }}
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    # =========================================================================
    # OPTIONAL LOCAL RESOLVER RESTART
    # =========================================================================

    - name: Determine active resolver services for remediation
      ansible.builtin.command:
        cmd: "systemctl is-active {{ item }}"
      loop: "{{ dns_resolver_services }}"
      register: dns_remediation_resolver_checks
      changed_when: false
      failed_when: false
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    - name: Set remediation resolver list
      ansible.builtin.set_fact:
        dns_remediation_active_resolvers: >-
          {{
            dns_remediation_resolver_checks.results
            | default([])
            | selectattr('stdout', 'equalto', 'active')
            | map(attribute='item')
            | list
          }}
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    - name: Restart approved active local DNS resolver
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ dns_remediation_active_resolvers }}"
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
        - dns_remediation_active_resolvers | length > 0
      tags:
        - remediate


    # =========================================================================
    # POST-REMEDIATION VALIDATION
    # =========================================================================

    - name: Validate DNS using getent after remediation
      ansible.builtin.command:
        cmd: "getent ahosts {{ dns_test_hostname }}"
      register: dns_post_remediation_getent
      changed_when: false
      failed_when: false
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
        - dns_has_getent
      tags:
        - remediate


    - name: Set post-remediation DNS result
      ansible.builtin.set_fact:
        dns_post_remediation_ok: >-
          {{
            dns_has_getent
            and
            (dns_post_remediation_getent.rc | default(1) == 0)
            and
            (
              dns_post_remediation_getent.stdout
              | default('')
              | trim
              | length > 0
            )
          }}
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate


    - name: Show DNS remediation result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PIQUICKHEAL DNS REMEDIATION RESULT"
          - "============================================================"
          - "Action: {{ dns_remediation_action }}"
          - "Approved DNS servers: {{ approved_dns_servers | join(', ') }}"
          - "Configured DNS servers: {{ dns_updated_nameservers | join(', ') }}"
          - "Post-remediation resolution: {{ dns_post_remediation_ok }}"
          - >-
            Result:
            {{
              'SUCCESS'
              if dns_post_remediation_ok
              else 'CONFIGURATION RESTORED - VALIDATION FAILED/INCONCLUSIVE'
            }}
          - "============================================================"
      when:
        - dns_execution_mode == 'remediate'
        - dns_remediation_action == 'RESTORE_DNS_CONFIG'
      tags:
        - remediate
