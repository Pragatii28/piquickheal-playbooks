---
# ============================================================
# PiQuickHeal - Dynamic DNS Resolution Diagnosis & Remediation
#
# Purpose:
#   Dynamically diagnose DNS resolution failures on Linux hosts.
#
# Supported scenarios:
#   - DNS resolution working
#   - No DNS server configured
#   - Configured DNS server unreachable
#   - Local resolver/cache failure
#   - Network/gateway failure
#   - /etc/hosts override
#   - External/public DNS comparison
#   - DNS record/provider related failure
#   - Unknown DNS failure
#
# Safe automatic remediation:
#   - Flush/restart local resolver services ONLY
#
# Never automatically modifies:
#   - /etc/resolv.conf
#   - NetworkManager DNS settings
#   - Routes
#   - Firewall
#   - DNS records
# ============================================================

- name: "PiQuickHeal - Dynamic DNS Resolution"
  hosts: all
  gather_facts: true
  become: true

  vars:

    # --------------------------------------------------------
    # DNS probes
    # --------------------------------------------------------
    dns_probe_hostname: "example.com"
    dns_secondary_probe_hostname: "cloudflare.com"

    # Public DNS servers used only for diagnosis.
    # They are NOT configured on the target server.
    public_dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"

    # DNS query timeout in seconds.
    dns_timeout: 3

    # Validation attempts after remediation.
    dns_validation_attempts: 3

    # Delay between validation attempts.
    dns_validation_delay: 2

    # PiQuickHeal heal log.
    heal_log_path: "/var/log/piquickheal/dns_resolution.log"

  tasks:

    # ========================================================
    # STAGE 1 - DISCOVERY
    # ========================================================

    - name: "STAGE 1 - Check available DNS diagnostic commands"
      ansible.builtin.shell: |
        echo "getent=$(command -v getent || true)"
        echo "dig=$(command -v dig || true)"
        echo "nslookup=$(command -v nslookup || true)"
        echo "nc=$(command -v nc || true)"
        echo "ping=$(command -v ping || true)"
        echo "ip=$(command -v ip || true)"
      args:
        executable: /bin/bash
      register: dns_available_commands
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Detect active local resolver services"
      ansible.builtin.shell: |
        RESULT=""

        for svc in systemd-resolved nscd dnsmasq named bind9; do
          if systemctl list-unit-files "${svc}.service" >/dev/null 2>&1; then
            if systemctl is-active --quiet "${svc}.service"; then
              RESULT="${RESULT}${svc}=ACTIVE "
            else
              RESULT="${RESULT}${svc}=INACTIVE "
            fi
          fi
        done

        echo "$RESULT" | xargs
      args:
        executable: /bin/bash
      register: dns_active_services
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Read /etc/resolv.conf"
      ansible.builtin.shell: |
        if [ -f /etc/resolv.conf ]; then
          cat /etc/resolv.conf
        else
          echo "RESOLV_CONF_MISSING"
        fi
      args:
        executable: /bin/bash
      register: dns_resolv_conf
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Extract configured nameservers"
      ansible.builtin.shell: |
        if [ -f /etc/resolv.conf ]; then
          awk '
            /^[[:space:]]*nameserver[[:space:]]+/ {
              print $2
            }
          ' /etc/resolv.conf
        fi
      args:
        executable: /bin/bash
      register: dns_nameservers
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Detect default route"
      ansible.builtin.shell: |
        ip route show default 2>/dev/null | head -1
      args:
        executable: /bin/bash
      register: dns_default_route
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Detect default gateway"
      ansible.builtin.shell: |
        ip route show default 2>/dev/null |
        awk '
          /^default/ {
            for (i=1; i<=NF; i++) {
              if ($i == "via") {
                print $(i+1)
                exit
              }
            }
          }
        '
      args:
        executable: /bin/bash
      register: dns_gateway
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Detect default interface"
      ansible.builtin.shell: |
        ip route show default 2>/dev/null |
        awk '
          /^default/ {
            for (i=1; i<=NF; i++) {
              if ($i == "dev") {
                print $(i+1)
                exit
              }
            }
          }
        '
      args:
        executable: /bin/bash
      register: dns_default_interface
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 1 - Check /etc/hosts for probe override"
      ansible.builtin.shell: |
        if [ -f /etc/hosts ]; then
          grep -E '(^|[[:space:]]){{ dns_probe_hostname | regex_escape }}([[:space:]]|$)' \
            /etc/hosts || true
        fi
      args:
        executable: /bin/bash
      register: dns_hosts_override
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 2 - NETWORK DIAGNOSIS
    # ========================================================

    - name: "STAGE 2 - Test default gateway"
      ansible.builtin.shell: |
        GATEWAY="{{ dns_gateway.stdout | trim }}"

        if [ -z "$GATEWAY" ]; then
          echo "NO_GATEWAY"
          exit 0
        fi

        if ping -c 2 -W {{ dns_timeout }} "$GATEWAY" >/dev/null 2>&1; then
          echo "REACHABLE"
        else
          echo "UNREACHABLE"
        fi
      args:
        executable: /bin/bash
      register: dns_gateway_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 2 - Test configured DNS servers with ping"
      ansible.builtin.shell: |
        RESULT=""

        for DNS_SERVER in {{ dns_nameservers.stdout_lines | default([]) | join(' ') }}; do

          if ping -c 1 -W {{ dns_timeout }} "$DNS_SERVER" >/dev/null 2>&1; then
            STATUS="ICMP_OK"
          else
            STATUS="ICMP_FAIL"
          fi

          RESULT="${RESULT}${DNS_SERVER}=${STATUS} "
        done

        if [ -z "$RESULT" ]; then
          echo "NO_DNS_SERVERS"
        else
          echo "$RESULT" | xargs
        fi
      args:
        executable: /bin/bash
      register: dns_server_icmp_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 3 - DIRECT DNS TEST WITHOUT DIG/NC
    #
    # Uses Python standard library.
    # This allows the playbook to work on minimal Linux
    # installations where dig/nc are not installed.
    # ========================================================

    - name: "STAGE 3 - Direct UDP DNS test using Python"
      ansible.builtin.shell: |
        python3 - <<'PY'
        import socket
        import struct
        import random
        import sys

        hostname = "{{ dns_probe_hostname }}"
        nameservers = {{ dns_nameservers.stdout_lines | default([]) | to_json }}
        timeout = {{ dns_timeout }}

        def build_query(name):
            transaction_id = random.randint(0, 65535)

            flags = 0x0100
            questions = 1
            answer_count = 0
            authority_count = 0
            additional_count = 0

            header = struct.pack(
                "!HHHHHH",
                transaction_id,
                flags,
                questions,
                answer_count,
                authority_count,
                additional_count
            )

            qname = b""

            for label in name.rstrip(".").split("."):
                encoded = label.encode()
                qname += bytes([len(encoded)]) + encoded

            qname += b"\x00"

            # QTYPE A = 1
            # QCLASS IN = 1
            question = qname + struct.pack("!HH", 1, 1)

            return transaction_id, header + question

        def test_dns(server):
            try:
                transaction_id, packet = build_query(hostname)

                sock = socket.socket(
                    socket.AF_INET,
                    socket.SOCK_DGRAM
                )

                sock.settimeout(timeout)
                sock.sendto(packet, (server, 53))

                response, _ = sock.recvfrom(4096)
                sock.close()

                if len(response) < 12:
                    return "INVALID_RESPONSE"

                response_id = struct.unpack("!H", response[:2])[0]

                if response_id != transaction_id:
                    return "INVALID_TRANSACTION"

                flags = struct.unpack("!H", response[2:4])[0]
                rcode = flags & 0x000F

                if rcode == 0:
                    return "DNS_OK"

                if rcode == 3:
                    return "NXDOMAIN"

                return "DNS_ERROR_RCODE_%s" % rcode

            except socket.timeout:
                return "TIMEOUT"

            except OSError as exc:
                return "SOCKET_ERROR_%s" % getattr(exc, "errno", "UNKNOWN")

            except Exception as exc:
                return "ERROR_%s" % type(exc).__name__

        if not nameservers:
            print("NO_DNS_SERVERS")
            sys.exit(0)

        for server in nameservers:
            print("%s=%s" % (server, test_dns(server)))
        PY
      args:
        executable: /bin/bash
      register: dns_direct_server_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: "STAGE 3 - Test local DNS with getent"
      ansible.builtin.shell: |
        if ! command -v getent >/dev/null 2>&1; then
          echo "GETENT_NOT_AVAILABLE"
          exit 0
        fi

        if getent ahosts "{{ dns_probe_hostname }}" >/dev/null 2>&1; then
          echo "A_OK"
        else
          echo "A_FAIL"
        fi

        if getent ahosts "{{ dns_secondary_probe_hostname }}" >/dev/null 2>&1; then
          echo "SECONDARY_OK"
        else
          echo "SECONDARY_FAIL"
        fi
      args:
        executable: /bin/bash
      register: dns_getent_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 4 - PUBLIC DNS COMPARISON
    # ========================================================

    - name: "STAGE 4 - Test public DNS servers using Python"
      ansible.builtin.shell: |
        python3 - <<'PY'
        import socket
        import struct
        import random

        hostname = "{{ dns_probe_hostname }}"
        public_servers = {{ public_dns_servers | to_json }}
        timeout = {{ dns_timeout }}

        def build_query(name):
            transaction_id = random.randint(0, 65535)

            header = struct.pack(
                "!HHHHHH",
                transaction_id,
                0x0100,
                1,
                0,
                0,
                0
            )

            qname = b""

            for label in name.rstrip(".").split("."):
                encoded = label.encode()
                qname += bytes([len(encoded)]) + encoded

            qname += b"\x00"

            return transaction_id, header + qname + struct.pack("!HH", 1, 1)

        def test(server):
            try:
                transaction_id, packet = build_query(hostname)

                sock = socket.socket(
                    socket.AF_INET,
                    socket.SOCK_DGRAM
                )

                sock.settimeout(timeout)
                sock.sendto(packet, (server, 53))

                response, _ = sock.recvfrom(4096)
                sock.close()

                if len(response) < 12:
                    return "INVALID_RESPONSE"

                response_id = struct.unpack("!H", response[:2])[0]

                if response_id != transaction_id:
                    return "INVALID_TRANSACTION"

                flags = struct.unpack("!H", response[2:4])[0]
                rcode = flags & 0x000F

                if rcode == 0:
                    return "DNS_OK"

                if rcode == 3:
                    return "NXDOMAIN"

                return "DNS_ERROR_RCODE_%s" % rcode

            except socket.timeout:
                return "TIMEOUT"

            except OSError as exc:
                return "SOCKET_ERROR_%s" % getattr(exc, "errno", "UNKNOWN")

            except Exception as exc:
                return "ERROR_%s" % type(exc).__name__

        for server in public_servers:
            print("%s=%s" % (server, test(server)))
        PY
      args:
        executable: /bin/bash
      register: dns_public_comparison
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 5 - DNS RECORD CHECK
    # ========================================================

    - name: "STAGE 5 - Check DNS record using available tools"
      ansible.builtin.shell: |
        if command -v dig >/dev/null 2>&1; then

          echo "METHOD=dig"

          echo "STATUS:"
          dig +time={{ dns_timeout }} +tries=1 "{{ dns_probe_hostname }}" |
            awk '/status:/{print $0}'

          echo "ANSWER:"
          dig +time={{ dns_timeout }} +tries=1 +short A "{{ dns_probe_hostname }}"

        elif command -v nslookup >/dev/null 2>&1; then

          echo "METHOD=nslookup"
          nslookup "{{ dns_probe_hostname }}"

        else

          echo "METHOD=python"
          python3 - <<'PY'
        import socket

        hostname = "{{ dns_probe_hostname }}"

        try:
            result = socket.getaddrinfo(
                hostname,
                None,
                socket.AF_UNSPEC,
                socket.SOCK_STREAM
            )

            addresses = sorted(
                set(item[4][0] for item in result)
            )

            print("RESOLVED")
            for address in addresses:
                print(address)

        except Exception as exc:
            print("FAILED")
            print(type(exc).__name__)
        PY

        fi
      args:
        executable: /bin/bash
      register: dns_record_test
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 6 - RESOLVER SERVICE HEALTH
    # ========================================================

    - name: "STAGE 6 - Check resolver service health"
      ansible.builtin.shell: |
        RESULT=""

        for svc in systemd-resolved nscd dnsmasq named bind9; do

          if systemctl list-unit-files "${svc}.service" >/dev/null 2>&1; then

            if systemctl is-active --quiet "${svc}.service"; then
              RESULT="${RESULT}${svc}=ACTIVE "
            else
              RESULT="${RESULT}${svc}=INACTIVE "
            fi

          fi

        done

        if [ -z "$RESULT" ]; then
          echo "NO_LOCAL_RESOLVER_SERVICE"
        else
          echo "$RESULT" | xargs
        fi
      args:
        executable: /bin/bash
      register: dns_service_health
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 7 - DYNAMIC CLASSIFICATION
    # ========================================================

    - name: "STAGE 7 - Classify DNS condition"
      ansible.builtin.shell: |
        GETENT_RESULT="{{ dns_getent_test.stdout | default('') }}"
        DIRECT_RESULT="{{ dns_direct_server_test.stdout | default('') }}"
        PUBLIC_RESULT="{{ dns_public_comparison.stdout | default('') }}"
        GATEWAY_RESULT="{{ dns_gateway_test.stdout | default('') | trim }}"
        NAMESERVERS="{{ dns_nameservers.stdout | default('') | trim }}"
        HOST_OVERRIDE="{{ dns_hosts_override.stdout | default('') | trim }}"
        ROUTE="{{ dns_default_route.stdout | default('') | trim }}"

        CLASS="DNS_FAILURE_UNDETERMINED"
        REASON="Unable to determine a unique DNS failure category."

        # ----------------------------------------------------
        # CASE 1 - DNS is working
        # ----------------------------------------------------
        if echo "$GETENT_RESULT" | grep -q "A_OK"; then

          CLASS="RESOLUTION_WORKING"
          REASON="The configured DNS path successfully resolved the probe hostname."

        # ----------------------------------------------------
        # CASE 2 - No route/gateway
        # ----------------------------------------------------
        elif [ -z "$ROUTE" ] || [ "$GATEWAY_RESULT" = "UNREACHABLE" ]; then

          CLASS="NETWORK_OR_GATEWAY_FAILURE"
          REASON="The host has no usable default route or cannot reach its gateway."

        # ----------------------------------------------------
        # CASE 3 - No DNS servers configured
        # ----------------------------------------------------
        elif [ -z "$NAMESERVERS" ]; then

          CLASS="NO_DNS_SERVER_CONFIGURED"
          REASON="No nameserver is configured in /etc/resolv.conf."

        # ----------------------------------------------------
        # CASE 4 - /etc/hosts override
        # ----------------------------------------------------
        elif [ -n "$HOST_OVERRIDE" ]; then

          CLASS="HOSTS_FILE_OVERRIDE_POSSIBLE"
          REASON="The probe hostname has an entry in /etc/hosts."

        # ----------------------------------------------------
        # CASE 5 - Configured DNS server responds directly,
        #          but normal local resolution fails.
        #
        # This indicates a local resolver/cache/NSS problem.
        # ----------------------------------------------------
        elif echo "$DIRECT_RESULT" | grep -Eq '=DNS_OK$|=NXDOMAIN$'; then

          CLASS="LOCAL_RESOLVER_OR_CACHE_FAILURE"
          REASON="Configured DNS server responds directly, but local name resolution fails."

        # ----------------------------------------------------
        # CASE 6 - Configured DNS servers fail, while public
        #          DNS servers work.
        #
        # This is the important case for the current test.
        # ----------------------------------------------------
        elif echo "$DIRECT_RESULT" | grep -Eq '=TIMEOUT$|=SOCKET_ERROR|=ERROR_' &&
             echo "$PUBLIC_RESULT" | grep -Eq '=DNS_OK$|=NXDOMAIN$'; then

          CLASS="CONFIGURED_DNS_SERVER_FAILURE"
          REASON="Configured DNS servers failed to answer while public DNS servers responded."

        # ----------------------------------------------------
        # CASE 7 - Configured DNS server has ICMP failure and
        #          local resolution also fails.
        #
        # This fallback works even when dig/nc are unavailable.
        # ----------------------------------------------------
        elif echo "$DIRECT_RESULT" | grep -Eq '=TIMEOUT$|=SOCKET_ERROR|=ERROR_' &&
             echo "$GETENT_RESULT" | grep -q "A_FAIL"; then

          CLASS="CONFIGURED_DNS_SERVER_FAILURE"
          REASON="Configured DNS servers did not respond to direct DNS queries and local DNS resolution failed."

        # ----------------------------------------------------
        # CASE 8 - Public DNS also unavailable
        # ----------------------------------------------------
        elif echo "$PUBLIC_RESULT" | grep -Eq '=TIMEOUT$|=SOCKET_ERROR|=ERROR_' &&
             echo "$GETENT_RESULT" | grep -q "A_FAIL"; then

          CLASS="NETWORK_OR_EXTERNAL_DNS_FAILURE"
          REASON="Both configured and public DNS paths failed."

        # ----------------------------------------------------
        # CASE 9 - DNS failure remains ambiguous
        # ----------------------------------------------------
        else

          CLASS="DNS_FAILURE_UNDETERMINED"
          REASON="DNS resolution failed but available diagnostics were insufficient to identify a unique cause."

        fi

        echo "CLASS=${CLASS}"
        echo "REASON=${REASON}"

      args:
        executable: /bin/bash
      register: dns_classification
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    # ========================================================
    # STAGE 7B - EXTRACT CLEAN CLASSIFICATION
    # ========================================================

    - name: "STAGE 7B - Extract clean DNS classification"
      ansible.builtin.set_fact:
        dns_classification_name: >-
          {{
            dns_classification.stdout
            | regex_search('(?m)^CLASS=(.*)$', '\1')
            | first
            | default('DNS_FAILURE_UNDETERMINED')
          }}
        dns_classification_reason: >-
          {{
            dns_classification.stdout
            | regex_search('(?m)^REASON=(.*)$', '\1')
            | first
            | default('Unable to determine DNS failure reason.')
          }}
      tags:
        - diagnose

    - name: "STAGE 7C - Determine safe remediation"
      ansible.builtin.set_fact:
        dns_safe_remediation_allowed: >-
          {{
            dns_classification_name == 'LOCAL_RESOLVER_OR_CACHE_FAILURE'
          }}
      tags:
        - diagnose

    # ========================================================
    # STAGE 8 - DIAGNOSTIC SUMMARY
    # ========================================================

    - name: "STAGE 8 - Display DNS diagnostic summary"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PiQuickHeal DNS Diagnostic Summary"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Probe hostname: {{ dns_probe_hostname }}"
          - "Secondary hostname: {{ dns_secondary_probe_hostname }}"
          - "Classification: {{ dns_classification_name }}"
          - "Reason: {{ dns_classification_reason }}"
          - "Resolver services: {{ dns_active_services.stdout | default('NONE') }}"
          - "Nameservers: {{ dns_nameservers.stdout | default('NONE') | trim }}"
          - "Default route: {{ dns_default_route.stdout | default('NONE') | trim }}"
          - "Gateway: {{ dns_gateway.stdout | default('NONE') | trim }}"
          - "Gateway test: {{ dns_gateway_test.stdout | default('UNKNOWN') | trim }}"
          - "DNS ICMP test: {{ dns_server_icmp_test.stdout | default('UNKNOWN') | trim }}"
          - "Direct DNS test: {{ dns_direct_server_test.stdout | default('UNKNOWN') | trim }}"
          - "Local getent test: {{ dns_getent_test.stdout | default('UNKNOWN') | trim }}"
          - "Public DNS comparison: {{ dns_public_comparison.stdout | default('UNKNOWN') | trim }}"
          - "Safe remediation allowed: {{ dns_safe_remediation_allowed }}"
          - "============================================================"
      tags:
        - diagnose

    # ========================================================
    # STAGE 9 - SAFE LOCAL RESOLVER REMEDIATION
    # ========================================================

    - name: "STAGE 9 - Flush systemd-resolved cache"
      ansible.builtin.command:
        cmd: "resolvectl flush-caches"
      when:
        - dns_safe_remediation_allowed | bool
        - "'systemd-resolved=ACTIVE' in dns_active_services.stdout"
      register: dns_resolved_flush
      changed_when: true
      failed_when: false
      tags:
        - remediate

    - name: "STAGE 9 - Restart systemd-resolved"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when:
        - dns_safe_remediation_allowed | bool
        - "'systemd-resolved=ACTIVE' in dns_active_services.stdout"
      register: dns_resolved_restart
      changed_when: true
      failed_when: false
      tags:
        - remediate

    - name: "STAGE 9 - Flush nscd hosts cache"
      ansible.builtin.command:
        cmd: "nscd -i hosts"
      when:
        - dns_safe_remediation_allowed | bool
        - "'nscd=ACTIVE' in dns_active_services.stdout"
      register: dns_nscd_flush
      changed_when: true
      failed_when: false
      tags:
        - remediate

    - name: "STAGE 9 - Restart nscd"
      ansible.builtin.systemd:
        name: nscd
        state: restarted
      when:
        - dns_safe_remediation_allowed | bool
        - "'nscd=ACTIVE' in dns_active_services.stdout"
      register: dns_nscd_restart
      changed_when: true
      failed_when: false
      tags:
        - remediate

    - name: "STAGE 9 - Restart dnsmasq"
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
      when:
        - dns_safe_remediation_allowed | bool
        - "'dnsmasq=ACTIVE' in dns_active_services.stdout"
      register: dns_dnsmasq_restart
      changed_when: true
      failed_when: false
      tags:
        - remediate

    # ========================================================
    # STAGE 10 - VALIDATION
    # ========================================================

    - name: "STAGE 10 - Validate DNS after remediation"
      ansible.builtin.shell: |
        ATTEMPT=1

        while [ "$ATTEMPT" -le "{{ dns_validation_attempts }}" ]; do

          if getent ahosts "{{ dns_probe_hostname }}" >/dev/null 2>&1; then
            echo "OK"
            exit 0
          fi

          if [ "$ATTEMPT" -lt "{{ dns_validation_attempts }}" ]; then
            sleep {{ dns_validation_delay }}
          fi

          ATTEMPT=$((ATTEMPT + 1))
        done

        echo "FAILING"
        exit 1
      args:
        executable: /bin/bash
      register: dns_validation
      changed_when: false
      failed_when: false
      when:
        - dns_safe_remediation_allowed | bool
      tags:
        - validate

    # ========================================================
    # STAGE 11 - RECORD HEAL RESULT
    # ========================================================

    - name: "STAGE 11 - Record DNS heal result"
      ansible.builtin.shell: |
        mkdir -p "$(dirname "{{ heal_log_path }}")"

        if [ "{{ dns_validation.stdout | default('FAILING') | trim }}" = "OK" ]; then
          STATUS="HEALED"
        else
          STATUS="HEAL_FAILED"
        fi

        TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S %Z')
        HOSTNAME=$(hostname)

        echo "${TIMESTAMP} [${STATUS} network_dns_resolution] ${HOSTNAME} classification={{ dns_classification_name }} probe={{ dns_probe_hostname }}" >> "{{ heal_log_path }}"
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false
      when:
        - dns_safe_remediation_allowed | bool
      tags:
        - validate

    # ========================================================
    # STAGE 12 - MANUAL ACTION REPORT
    # ========================================================

    - name: "STAGE 12 - Generate manual action report"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PiQuickHeal DNS Manual Action Required"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Probe: {{ dns_probe_hostname }}"
          - "Classification: {{ dns_classification_name }}"
          - "Reason: {{ dns_classification_reason }}"
          - ""
          - "PiQuickHeal did not modify DNS/network configuration."
          - ""
          - "Recommended checks:"
          - "1. Verify /etc/resolv.conf."
          - "2. Verify configured DNS server availability."
          - "3. Verify UDP/TCP port 53 connectivity."
          - "4. Verify firewall/security-group/network ACL rules."
          - "5. Verify default route and gateway."
          - "6. Verify DNS records at the DNS provider."
          - "7. Verify authoritative DNS/delegation."
          - "8. Check split-horizon/private DNS."
          - "9. Check DNSSEC if applicable."
          - "10. Check /etc/hosts."
          - "11. Check IPv4/IPv6 DNS behaviour."
          - "============================================================"
      when:
        - not (dns_safe_remediation_allowed | bool)
        - dns_classification_name != 'RESOLUTION_WORKING'
      tags:
        - diagnose

    # ========================================================
    # STAGE 13 - FINAL RESULT
    # ========================================================

    - name: "STAGE 13 - Final DNS result"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PiQuickHeal DNS Final Result"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Classification: {{ dns_classification_name }}"
          - "Reason: {{ dns_classification_reason }}"
          - "Safe remediation: {{ dns_safe_remediation_allowed }}"
          - "Validation: {{ dns_validation.stdout | default('NOT_REQUIRED') | trim }}"
          - "============================================================"
      tags:
        - diagnose
        - remediate
        - validate
