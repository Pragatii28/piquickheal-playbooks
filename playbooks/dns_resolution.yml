---
# PiQuickHeal - Unified DNS Resolution Diagnosis
#
# No Python / dig / nc dependency.
#
# Detection:
#   1. RESOLUTION_WORKING
#   2. CONFIGURED_DNS_SERVER_FAILURE
#   3. NO_DNS_SERVER_CONFIGURED
#   4. NETWORK_OR_GATEWAY_FAILURE
#   5. HOSTS_FILE_OVERRIDE_POSSIBLE
#   6. LOCAL_RESOLVER_OR_CACHE_FAILURE
#   7. DNS_RECORD_NOT_FOUND
#   8. PUBLIC_DNS_UNAVAILABLE / DNS_FAILURE_UNDETERMINED
#   9. IPV6_DNS_FAILURE
#  10. DNS_TIMEOUT
#
# Safe remediation:
#   Only local resolver/cache restart/flush.
#
# Never automatically modifies:
#   - /etc/resolv.conf
#   - routes
#   - firewall
#   - interfaces
#   - DNS records

- name: PiQuickHeal - Unified DNS Resolution Diagnosis
  hosts: all
  become: true
  gather_facts: true

  vars:

    # ----------------------------------------------------------
    # TEST HOSTNAMES
    # ----------------------------------------------------------

    dns_probe_hostname: "example.com"
    dns_secondary_probe_hostname: "cloudflare.com"

    # Use a hostname that should not normally exist.
    dns_nonexistent_hostname: "piquickheal-this-domain-should-not-exist-987654321.example"

    dns_validation_attempts: 3
    dns_validation_delay: 2

    dns_log_file: "/var/log/piquickheal/dns_resolution.log"

    # ----------------------------------------------------------
    # OPTIONAL DNS TOOLS
    #
    # The playbook does NOT require them.
    # If available, they improve direct DNS diagnosis.
    # ----------------------------------------------------------

  tasks:

    # ==========================================================
    # 1. BASIC INFORMATION
    # ==========================================================

    - name: Display DNS diagnosis start
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "PiQuickHeal - Unified DNS Diagnosis"
          - "=============================================="
          - "Target: {{ inventory_hostname }}"
          - "Hostname: {{ ansible_hostname | default('unknown') }}"

    # ==========================================================
    # 2. DETECT AVAILABLE DNS UTILITIES
    # ==========================================================

    - name: Check for dig
      ansible.builtin.shell: |
        command -v dig || true
      args:
        executable: /bin/bash
      register: dig_path
      changed_when: false

    - name: Check for nslookup
      ansible.builtin.shell: |
        command -v nslookup || true
      args:
        executable: /bin/bash
      register: nslookup_path
      changed_when: false

    - name: Check for resolvectl
      ansible.builtin.shell: |
        command -v resolvectl || true
      args:
        executable: /bin/bash
      register: resolvectl_path
      changed_when: false

    - name: Set DNS utility facts
      ansible.builtin.set_fact:
        dns_has_dig: "{{ dig_path.stdout | trim | length > 0 }}"
        dns_has_nslookup: "{{ nslookup_path.stdout | trim | length > 0 }}"
        dns_has_resolvectl: "{{ resolvectl_path.stdout | trim | length > 0 }}"

    - name: Display available DNS tools
      ansible.builtin.debug:
        msg:
          - "dig: {{ dns_has_dig }}"
          - "nslookup: {{ dns_has_nslookup }}"
          - "resolvectl: {{ dns_has_resolvectl }}"

    # ==========================================================
    # 3. READ /etc/resolv.conf
    # ==========================================================

    - name: Read resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolv_conf
      failed_when: false

    - name: Decode resolv.conf
      ansible.builtin.set_fact:
        resolv_conf_content: >-
          {{
            (resolv_conf.content | default('') | b64decode)
            if resolv_conf.content is defined
            else ''
          }}

    - name: Extract configured nameservers
      ansible.builtin.shell: |
        awk '
          /^[[:space:]]*#/ {next}
          $1 == "nameserver" {print $2}
        ' /etc/resolv.conf 2>/dev/null
      args:
        executable: /bin/bash
      register: configured_nameservers
      changed_when: false
      failed_when: false

    - name: Set DNS nameserver list
      ansible.builtin.set_fact:
        dns_nameservers: "{{ configured_nameservers.stdout_lines | default([]) }}"

    - name: Display DNS configuration
      ansible.builtin.debug:
        msg:
          - "Nameservers:"
          - >-
            {{
              dns_nameservers | join(', ')
              if dns_nameservers | length > 0
              else 'NONE'
            }}
          - "resolv.conf:"
          - "{{ resolv_conf_content }}"

    # ==========================================================
    # 4. DETECT LOCAL RESOLVER
    # ==========================================================

    - name: Detect local resolver services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --all \
          --no-legend \
          2>/dev/null |
        awk '{print $1}' |
        grep -Ei \
          '^(systemd-resolved|nscd|dnsmasq|named|bind9|unbound)' \
        || true
      args:
        executable: /bin/bash
      register: resolver_services
      changed_when: false
      failed_when: false

    - name: Display resolver services
      ansible.builtin.debug:
        msg:
          - >-
            {{
              resolver_services.stdout_lines
              if resolver_services.stdout_lines | length > 0
              else ['No dedicated local DNS resolver detected']
            }}

    # ==========================================================
    # 5. DEFAULT ROUTE
    # ==========================================================

    - name: Get default route
      ansible.builtin.shell: |
        ip route show default 2>/dev/null | head -n 1
      args:
        executable: /bin/bash
      register: default_route
      changed_when: false
      failed_when: false

    - name: Get default gateway
      ansible.builtin.shell: |
        ip route show default 2>/dev/null |
        awk '/default/ {print $3; exit}'
      args:
        executable: /bin/bash
      register: gateway_result
      changed_when: false
      failed_when: false

    - name: Set gateway fact
      ansible.builtin.set_fact:
        dns_gateway: "{{ gateway_result.stdout | trim }}"

    - name: Test default gateway
      ansible.builtin.shell: |
        if [ -z "{{ dns_gateway }}" ]; then
          echo "NO_GATEWAY"
        elif ping -c 2 -W 2 "{{ dns_gateway }}" >/dev/null 2>&1; then
          echo "REACHABLE"
        else
          echo "UNREACHABLE"
        fi
      args:
        executable: /bin/bash
      register: gateway_test
      changed_when: false
      failed_when: false

    - name: Display network status
      ansible.builtin.debug:
        msg:
          - "Default route: {{ default_route.stdout | trim | default('NONE') }}"
          - "Gateway: {{ dns_gateway | default('NONE') }}"
          - "Gateway test: {{ gateway_test.stdout | trim }}"

    # ==========================================================
    # 6. /etc/hosts OVERRIDE
    #
    # Do NOT use `getent hosts` for this detection.
    # Your target demonstrated that it can return AAAA records.
    # ==========================================================

    - name: Check /etc/hosts for probe hostname
      ansible.builtin.shell: |
        awk '
          /^[[:space:]]*#/ {next}
          {
            for (i=2; i<=NF; i++) {
              if (tolower($i) == tolower("{{ dns_probe_hostname }}")) {
                print $0
              }
            }
          }
        ' /etc/hosts 2>/dev/null
      args:
        executable: /bin/bash
      register: hosts_override
      changed_when: false
      failed_when: false

    - name: Set hosts override fact
      ansible.builtin.set_fact:
        hosts_override_present: >-
          {{ hosts_override.stdout | trim | length > 0 }}

    - name: Display hosts override
      ansible.builtin.debug:
        msg:
          - "Hosts override: {{ hosts_override_present }}"
          - "Matching entries: {{ hosts_override.stdout | default('NONE') }}"

    # ==========================================================
    # 7. LOCAL IPv4 LOOKUP
    # ==========================================================

    - name: Test primary IPv4 resolution
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: primary_ipv4
      changed_when: false
      failed_when: false

    - name: Test secondary IPv4 resolution
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_secondary_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: secondary_ipv4
      changed_when: false
      failed_when: false

    - name: Set IPv4 lookup facts
      ansible.builtin.set_fact:
        primary_ipv4_ok: "{{ primary_ipv4.stdout | trim | length > 0 }}"
        secondary_ipv4_ok: "{{ secondary_ipv4.stdout | trim | length > 0 }}"

    - name: Display IPv4 DNS results
      ansible.builtin.debug:
        msg:
          - "Primary IPv4 lookup: {{ 'A_OK' if primary_ipv4_ok else 'A_FAIL' }}"
          - >-
            Secondary IPv4 lookup:
            {{ 'A_OK' if secondary_ipv4_ok else 'A_FAIL' }}

    # ==========================================================
    # 8. IPv6 / AAAA LOOKUP
    # ==========================================================

    - name: Test IPv6 resolution
      ansible.builtin.shell: |
        getent ahostsv6 "{{ dns_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: primary_ipv6
      changed_when: false
      failed_when: false

    - name: Set IPv6 lookup fact
      ansible.builtin.set_fact:
        primary_ipv6_ok: "{{ primary_ipv6.stdout | trim | length > 0 }}"

    - name: Display IPv6 DNS result
      ansible.builtin.debug:
        msg:
          - "IPv6 lookup: {{ 'AAAA_OK' if primary_ipv6_ok else 'AAAA_FAIL' }}"

    # ==========================================================
    # 9. NONEXISTENT RECORD TEST
    #
    # If a normal hostname works but a definitely nonexistent
    # hostname fails, this strongly indicates NXDOMAIN/record
    # absence rather than DNS service failure.
    # ==========================================================

    - name: Test nonexistent hostname
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_nonexistent_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: nonexistent_lookup
      changed_when: false
      failed_when: false

    - name: Set nonexistent record fact
      ansible.builtin.set_fact:
        nonexistent_record_failed: >-
          {{ nonexistent_lookup.stdout | trim | length == 0 }}

    - name: Display nonexistent record result
      ansible.builtin.debug:
        msg:
          - >-
            Nonexistent hostname lookup:
            {{
              'NOT_FOUND'
              if nonexistent_record_failed
              else 'RESOLVED_UNEXPECTEDLY'
            }}

    # ==========================================================
    # 10. OPTIONAL DIRECT DNS TEST
    #
    # Used only if dig/nslookup/resolvectl already exists.
    # No installation is attempted.
    # ==========================================================

    - name: Direct DNS test with dig
      ansible.builtin.shell: |
        dig +time=3 +tries=1 +short "{{ dns_probe_hostname }}"
      args:
        executable: /bin/bash
      register: dig_result
      changed_when: false
      failed_when: false
      when: dns_has_dig

    - name: Direct DNS test with nslookup
      ansible.builtin.shell: |
        timeout 5 nslookup "{{ dns_probe_hostname }}" 2>&1
      args:
        executable: /bin/bash
      register: nslookup_result
      changed_when: false
      failed_when: false
      when:
        - not dns_has_dig
        - dns_has_nslookup

    # ==========================================================
    # 11. TEST EACH CONFIGURED DNS SERVER IF DIG EXISTS
    # ==========================================================

    - name: Test each configured DNS server with dig
      ansible.builtin.shell: |
        result=$(dig +time=3 +tries=1 @"{{ item }}" "{{ dns_probe_hostname }}" 2>&1)

        if echo "$result" | grep -q "status: NOERROR"; then
          echo "{{ item }}=DNS_OK"
        elif echo "$result" | grep -q "status: NXDOMAIN"; then
          echo "{{ item }}=NXDOMAIN"
        elif echo "$result" | grep -q "status: SERVFAIL"; then
          echo "{{ item }}=SERVFAIL"
        elif echo "$result" | grep -qi "connection timed out\|communications error"; then
          echo "{{ item }}=TIMEOUT"
        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_nameservers }}"
      register: direct_dns_servers
      changed_when: false
      failed_when: false
      when: dns_has_dig

    - name: Build direct DNS server result
      ansible.builtin.set_fact:
        direct_dns_result: >-
          {{
            direct_dns_servers.results
            | default([])
            | map(attribute='stdout')
            | map('trim')
            | list
            | join('\n')
          }}

    # ==========================================================
    # 12. CLASSIFICATION INITIALIZATION
    # ==========================================================

    - name: Initialize classification
      ansible.builtin.set_fact:
        dns_classification_name: "DNS_FAILURE_UNDETERMINED"
        dns_classification_reason: >-
          DNS condition could not be uniquely classified using the
          available operating-system capabilities.

    # ==========================================================
    # 13. HOSTS FILE OVERRIDE
    # ==========================================================

    - name: Classify hosts file override
      ansible.builtin.set_fact:
        dns_classification_name: "HOSTS_FILE_OVERRIDE_POSSIBLE"
        dns_classification_reason: >-
          The probe hostname is explicitly present in /etc/hosts.
          Local name resolution may therefore bypass DNS.
      when: hosts_override_present

    # ==========================================================
    # 14. NETWORK / GATEWAY FAILURE
    # ==========================================================

    - name: Classify gateway failure
      ansible.builtin.set_fact:
        dns_classification_name: "NETWORK_OR_GATEWAY_FAILURE"
        dns_classification_reason: >-
          The target has no usable default gateway or the configured
          gateway is unreachable.
      when:
        - not hosts_override_present
        - gateway_test.stdout | trim != "REACHABLE"

    # ==========================================================
    # 15. NO DNS SERVER
    # ==========================================================

    - name: Classify no DNS server
      ansible.builtin.set_fact:
        dns_classification_name: "NO_DNS_SERVER_CONFIGURED"
        dns_classification_reason: >-
          No nameserver is configured in /etc/resolv.conf.
      when:
        - not hosts_override_present
        - gateway_test.stdout | trim == "REACHABLE"
        - dns_nameservers | length == 0

    # ==========================================================
    # 16. DNS RECORD DOES NOT EXIST
    #
    # This is only declared when the normal probe resolves but the
    # intentionally nonexistent hostname does not.
    # ==========================================================

    - name: Classify nonexistent DNS record
      ansible.builtin.set_fact:
        dns_classification_name: "DNS_RECORD_NOT_FOUND"
        dns_classification_reason: >-
          Normal DNS resolution works, but the intentionally
          nonexistent hostname does not resolve. This indicates
          normal NXDOMAIN/record absence behavior.
      when:
        - not hosts_override_present
        - gateway_test.stdout | trim == "REACHABLE"
        - dns_nameservers | length > 0
        - primary_ipv4_ok
        - nonexistent_record_failed

    # ==========================================================
    # 17. CONFIGURED DNS SERVER FAILURE
    #
    # If direct DNS testing is available.
    # ==========================================================

    - name: Classify configured DNS failure from direct test
      ansible.builtin.set_fact:
        dns_classification_name: "CONFIGURED_DNS_SERVER_FAILURE"
        dns_classification_reason: >-
          One or more configured DNS servers failed to answer
          the direct DNS query.
      when:
        - not hosts_override_present
        - gateway_test.stdout | trim == "REACHABLE"
        - dns_nameservers | length > 0
        - dns_has_dig
        - direct_dns_result is search('=TIMEOUT|=SERVFAIL|=DNS_ERROR')

    # ==========================================================
    # 18. DNS TIMEOUT
    #
    # Explicit timeout classification when dig is available.
    # ==========================================================

    - name: Classify DNS timeout
      ansible.builtin.set_fact:
        dns_classification_name: "DNS_TIMEOUT"
        dns_classification_reason: >-
          The configured DNS server did not respond within the
          configured DNS timeout.
      when:
        - not hosts_override_present
        - gateway_test.stdout | trim == "REACHABLE"
        - dns_nameservers | length > 0
        - dns_has_dig
        - direct_dns_result is search('=TIMEOUT')

    # ==========================================================
    # 19. LOCAL RESOLVER / CACHE FAILURE
    #
    # Direct DNS works, but system lookup fails.
    # ==========================================================

    - name: Classify local resolver/cache failure
      ansible.builtin.set_fact:
        dns_classification_name: "LOCAL_RESOLVER_OR_CACHE_FAILURE"
        dns_classification_reason: >-
          DNS servers are responding, but the local NSS/resolver
          lookup path is failing.
      when:
        - not hosts_override_present
        - gateway_test.stdout | trim == "REACHABLE"
        - dns_nameservers | length > 0
        - not primary_ipv4_ok
        - dns_has_dig
        - direct_dns_result is search('=DNS_OK')

    # ==========================================================
    # 20. IPv6-SPECIFIC DNS FAILURE
    #
    # A works while AAAA fails.
    #
    # This is reported only when an IPv6 lookup is expected to
    # produce an answer and IPv4 works.
    # ==========================================================

    - name: Classify IPv6 DNS failure
      ansible.builtin.set_fact:
        dns_classification_name: "IPV6_DNS_FAILURE"
        dns_classification_reason: >-
          IPv4 DNS resolution works but IPv6/AAAA resolution
          returned no result.
      when:
        - not hosts_override_present
        - gateway_test.stdout | trim == "REACHABLE"
        - primary_ipv4_ok
        - not primary_ipv6_ok
        - dns_nameservers | length > 0

    # ==========================================================
    # 21. NORMAL WORKING DNS
    # ==========================================================

    - name: Classify working DNS
      ansible.builtin.set_fact:
        dns_classification_name: "RESOLUTION_WORKING"
        dns_classification_reason: >-
          Normal IPv4 DNS resolution succeeded and no /etc/hosts
          override was detected.
      when:
        - not hosts_override_present
        - gateway_test.stdout | trim == "REACHABLE"
        - dns_nameservers | length > 0
        - primary_ipv4_ok
        - not (
            primary_ipv4_ok and
            not primary_ipv6_ok and
            dns_nameservers | length > 0
          )

    # ==========================================================
    # 22. SAFE REMEDIATION DECISION
    # ==========================================================

    - name: Determine safe remediation
      ansible.builtin.set_fact:
        safe_dns_remediation_allowed: >-
          {{
            dns_classification_name ==
            'LOCAL_RESOLVER_OR_CACHE_FAILURE'
          }}

    # ==========================================================
    # 23. LOCAL RESOLVER REMEDIATION
    # ==========================================================

    - name: Check systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
      register: systemd_resolved_status
      changed_when: false
      failed_when: false

    - name: Check nscd
      ansible.builtin.systemd:
        name: nscd
      register: nscd_status
      changed_when: false
      failed_when: false

    - name: Flush systemd-resolved cache
      ansible.builtin.command:
        cmd: resolvectl flush-caches
      register: resolved_flush
      changed_when: false
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - dns_has_resolvectl
        - systemd_resolved_status.status is defined
        - systemd_resolved_status.status.LoadState | default('not-found') == 'loaded'

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      register: resolved_restart
      changed_when: true
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - systemd_resolved_status.status is defined
        - systemd_resolved_status.status.LoadState | default('not-found') == 'loaded'

    - name: Restart nscd
      ansible.builtin.systemd:
        name: nscd
        state: restarted
      register: nscd_restart
      changed_when: true
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - nscd_status.status is defined
        - nscd_status.status.LoadState | default('not-found') == 'loaded'

    # ==========================================================
    # 24. VALIDATION
    # ==========================================================

    - name: Validate DNS after remediation
      ansible.builtin.shell: |
        attempt=1

        while [ "$attempt" -le "{{ dns_validation_attempts }}" ]; do

          if getent ahostsv4 "{{ dns_probe_hostname }}" >/dev/null 2>&1; then
            echo "RESOLVED"
            exit 0
          fi

          sleep "{{ dns_validation_delay }}"
          attempt=$((attempt + 1))

        done

        echo "FAILED"
        exit 1
      args:
        executable: /bin/bash
      register: dns_validation
      changed_when: false
      failed_when: false
      when: safe_dns_remediation_allowed

    - name: Set validation result
      ansible.builtin.set_fact:
        dns_validation_result: >-
          {{
            dns_validation.stdout | trim
            if safe_dns_remediation_allowed
            else 'NOT_REQUIRED'
          }}

    # ==========================================================
    # 25. LOG
    # ==========================================================

    - name: Create PiQuickHeal log directory
      ansible.builtin.file:
        path: "{{ dns_log_file | dirname }}"
        state: directory
        mode: "0755"
      failed_when: false

    - name: Write DNS diagnosis log
      ansible.builtin.shell: >
        echo "$(date '+%Y-%m-%d %H:%M:%S')
        host={{ inventory_hostname }}
        classification={{ dns_classification_name }}
        remediation={{ safe_dns_remediation_allowed }}
        validation={{ dns_validation_result }}"
        >> "{{ dns_log_file }}"
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    # ==========================================================
    # 26. FINAL RESULT
    # ==========================================================

    - name: Display final DNS result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "PiQuickHeal DNS Diagnosis Result"
          - "=============================================="
          - "Classification: {{ dns_classification_name }}"
          - "Reason: {{ dns_classification_reason }}"
          - "Nameservers: {{ dns_nameservers | join(', ') if dns_nameservers | length > 0 else 'NONE' }}"
          - "Default route: {{ default_route.stdout | trim | default('NONE') }}"
          - "Gateway: {{ dns_gateway | default('NONE') }}"
          - "Gateway test: {{ gateway_test.stdout | trim }}"
          - "Hosts override: {{ hosts_override_present }}"
          - "IPv4 resolution: {{ 'A_OK' if primary_ipv4_ok else 'A_FAIL' }}"
          - "IPv6 resolution: {{ 'AAAA_OK' if primary_ipv6_ok else 'AAAA_FAIL' }}"
          - "Secondary resolution: {{ 'A_OK' if secondary_ipv4_ok else 'A_FAIL' }}"
          - "DNS utility available: {{ 'YES' if (dns_has_dig or dns_has_nslookup or dns_has_resolvectl) else 'NO' }}"
          - "Direct DNS result: {{ direct_dns_result | default('NOT_AVAILABLE') }}"
          - "Safe remediation: {{ safe_dns_remediation_allowed }}"
          - "Validation: {{ dns_validation_result }}"
          - "=============================================="
