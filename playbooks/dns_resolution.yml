---
# PiQuickHeal - Production DNS Diagnosis & Safe Remediation
#
# PURPOSE
# -------
# Diagnose common DNS failures without modifying network configuration.
#
# SUPPORTED CLASSIFICATIONS
# -------------------------
# 1. RESOLUTION_WORKING
# 2. CONFIGURED_DNS_SERVER_FAILURE
# 3. NO_DNS_SERVER_CONFIGURED
# 4. NETWORK_OR_GATEWAY_FAILURE
# 5. HOSTS_FILE_OVERRIDE_POSSIBLE
# 6. LOCAL_RESOLVER_OR_CACHE_FAILURE
# 7. DNS_RECORD_NOT_FOUND
# 8. PUBLIC_DNS_UNAVAILABLE
# 9. IPV6_DNS_FAILURE
# 10. DNS_TIMEOUT
# 11. DNS_FAILURE_UNDETERMINED
#
# SAFETY
# ------
# Automatically changes ONLY local DNS resolver/cache state when
# direct DNS testing proves that the upstream DNS server works but
# the local resolver/NSS path does not.
#
# NEVER automatically changes:
#   - /etc/resolv.conf
#   - /etc/hosts
#   - routes
#   - interfaces
#   - firewall
#   - DNS servers
#   - DNS records
#
# OPTIONAL TOOLS
# --------------
# dig        -> preferred direct DNS testing
# nslookup   -> fallback direct DNS testing
# resolvectl -> systemd-resolved upstream discovery
#
# REQUIRED STANDARD UTILITIES
# ---------------------------
# getent, ip, awk, grep, sed, systemctl, ping
#
# AWX TAGS
# --------
# diagnose
# remediate
# validate
#
# TARGET HOSTNAME
# ---------------
# awx:
#   -e target_hostname=app.example.com
#
# If target_hostname is not supplied, the control hostname is used.
#

- name: PiQuickHeal - Production DNS Diagnosis
  hosts: all
  become: true
  gather_facts: true

  vars:

    # ==========================================================
    # CONFIGURATION
    # ==========================================================

    # Known-good DNS control hostname.
    dns_probe_hostname: "example.com"

    # Second known-good DNS control hostname.
    dns_secondary_probe_hostname: "cloudflare.com"

    # Actual hostname being investigated.
    #
    # AWX example:
    # -e target_hostname=myapp.example.com
    #
    dns_target_hostname: "{{ target_hostname | default(dns_probe_hostname) }}"

    # Hostname that should not normally exist.
    dns_nonexistent_hostname: "piquickheal-this-domain-should-not-exist-987654321.example"

    # Public IP used only as a network reachability signal.
    dns_internet_probe_ip: "1.1.1.1"

    # Public DNS servers used only when direct DNS testing is available.
    dns_public_servers:
      - "1.1.1.1"
      - "8.8.8.8"

    # Direct DNS timeout.
    dns_query_timeout: 3

    # Validation after safe remediation.
    dns_validation_attempts: 3
    dns_validation_delay: 2

    # PiQuickHeal log.
    dns_log_file: "/var/log/piquickheal/dns_resolution.log"


  tasks:

    # ==========================================================
    # 1. BASIC INFORMATION
    # ==========================================================

    - name: Display DNS diagnosis start
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "PiQuickHeal - Production DNS Diagnosis"
          - "=============================================="
          - "Target: {{ inventory_hostname }}"
          - "Hostname: {{ ansible_hostname | default('unknown') }}"
          - "Control probe: {{ dns_probe_hostname }}"
          - "Target hostname: {{ dns_target_hostname }}"

      tags:
        - diagnose


    # ==========================================================
    # 2. DETECT OPTIONAL DNS UTILITIES
    # ==========================================================

    - name: Detect dig
      ansible.builtin.shell: |
        command -v dig || true
      args:
        executable: /bin/bash
      register: dns_dig_check
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Detect nslookup
      ansible.builtin.shell: |
        command -v nslookup || true
      args:
        executable: /bin/bash
      register: dns_nslookup_check
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Detect resolvectl
      ansible.builtin.shell: |
        command -v resolvectl || true
      args:
        executable: /bin/bash
      register: dns_resolvectl_check
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Detect timeout utility
      ansible.builtin.shell: |
        command -v timeout || true
      args:
        executable: /bin/bash
      register: dns_timeout_check
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set DNS capability facts
      ansible.builtin.set_fact:
        dns_has_dig: "{{ dns_dig_check.stdout | trim | length > 0 }}"
        dns_has_nslookup: "{{ dns_nslookup_check.stdout | trim | length > 0 }}"
        dns_has_resolvectl: "{{ dns_resolvectl_check.stdout | trim | length > 0 }}"
        dns_has_timeout: "{{ dns_timeout_check.stdout | trim | length > 0 }}"

    - name: Display DNS capabilities
      ansible.builtin.debug:
        msg:
          - "dig: {{ dns_has_dig }}"
          - "nslookup: {{ dns_has_nslookup }}"
          - "resolvectl: {{ dns_has_resolvectl }}"
          - "timeout: {{ dns_has_timeout }}"
      tags:
        - diagnose


    # ==========================================================
    # 3. READ /etc/resolv.conf
    # ==========================================================

    - name: Read resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolv_conf
      failed_when: false
      tags:
        - diagnose

    - name: Decode resolv.conf
      ansible.builtin.set_fact:
        resolv_conf_content: >-
          {{
            (resolv_conf.content | default('') | b64decode)
            if resolv_conf.content is defined
            else ''
          }}
      tags:
        - diagnose

    - name: Extract configured DNS servers
      ansible.builtin.shell: |
        awk '
          /^[[:space:]]*#/ {next}
          $1 == "nameserver" {print $2}
        ' /etc/resolv.conf 2>/dev/null
      args:
        executable: /bin/bash
      register: configured_nameservers
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set configured DNS servers
      ansible.builtin.set_fact:
        dns_nameservers: "{{ configured_nameservers.stdout_lines | default([]) }}"
      tags:
        - diagnose

    - name: Detect systemd-resolved stub
      ansible.builtin.set_fact:
        dns_uses_stub_resolver: >-
          {{
            dns_nameservers
            | select('match', '^(127\.0\.0\.53|127\.0\.0\.54|::1)$')
            | list
            | length > 0
          }}
      tags:
        - diagnose


    # ==========================================================
    # 4. DISCOVER SYSTEMD-RESOLVED UPSTREAM SERVERS
    # ==========================================================

    - name: Get systemd-resolved upstream DNS servers
      ansible.builtin.shell: |
        resolvectl dns 2>/dev/null |
        grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9A-Fa-f]{0,4}:){2,7}[0-9A-Fa-f]{0,4}' |
        sort -u
      args:
        executable: /bin/bash
      register: resolved_upstreams
      changed_when: false
      failed_when: false
      when:
        - dns_uses_stub_resolver
        - dns_has_resolvectl
      tags:
        - diagnose

    - name: Build effective DNS server list
      ansible.builtin.set_fact:
        dns_effective_servers: >-
          {{
            (
              resolved_upstreams.stdout_lines | default([])
              if (
                dns_uses_stub_resolver
                and dns_has_resolvectl
                and (resolved_upstreams.stdout_lines | default([]) | length > 0)
              )
              else dns_nameservers
            )
          }}
      tags:
        - diagnose

    - name: Display DNS configuration
      ansible.builtin.debug:
        msg:
          - "resolv.conf nameservers: {{ dns_nameservers | join(', ') if dns_nameservers | length > 0 else 'NONE' }}"
          - "systemd-resolved stub: {{ dns_uses_stub_resolver }}"
          - "effective DNS servers: {{ dns_effective_servers | join(', ') if dns_effective_servers | length > 0 else 'NONE' }}"
      tags:
        - diagnose


    # ==========================================================
    # 5. NSS CONFIGURATION
    # ==========================================================

    - name: Read NSS hosts configuration
      ansible.builtin.shell: |
        awk '$1 == "hosts:" {$1=""; print $0}' /etc/nsswitch.conf 2>/dev/null |
        xargs
      args:
        executable: /bin/bash
      register: nss_hosts
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set NSS configuration
      ansible.builtin.set_fact:
        dns_nss_hosts: "{{ nss_hosts.stdout | trim | default('unknown') }}"
      tags:
        - diagnose


    # ==========================================================
    # 6. DETECT LOCAL RESOLVER SERVICES
    # ==========================================================

    - name: Detect local DNS resolver services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --all \
          --no-legend \
          2>/dev/null |
        awk '{print $1}' |
        grep -Ei '^(systemd-resolved|nscd|dnsmasq|named|bind9|unbound)' ||
        true
      args:
        executable: /bin/bash
      register: resolver_services
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set local resolver facts
      ansible.builtin.set_fact:
        dns_local_resolver_services: "{{ resolver_services.stdout_lines | default([]) }}"
        dns_has_local_resolver: "{{ resolver_services.stdout | trim | length > 0 }}"
      tags:
        - diagnose


    # ==========================================================
    # 7. IPv4 NETWORK STATUS
    # ==========================================================

    - name: Get IPv4 default route
      ansible.builtin.shell: |
        ip route show default 2>/dev/null | head -n 1
      args:
        executable: /bin/bash
      register: ipv4_default_route
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Get IPv4 gateway
      ansible.builtin.shell: |
        ip route show default 2>/dev/null |
        awk '/default/ {print $3; exit}'
      args:
        executable: /bin/bash
      register: ipv4_gateway
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set IPv4 gateway
      ansible.builtin.set_fact:
        dns_gateway: "{{ ipv4_gateway.stdout | trim }}"
      tags:
        - diagnose

    - name: Test IPv4 gateway
      ansible.builtin.shell: |
        if [ -z "{{ dns_gateway }}" ]; then
          echo "NO_GATEWAY"
        elif ping -c 2 -W 2 "{{ dns_gateway }}" >/dev/null 2>&1; then
          echo "REACHABLE"
        else
          echo "UNREACHABLE"
        fi
      args:
        executable: /bin/bash
      register: gateway_test
      changed_when: false
      failed_when: false
      when: dns_gateway | trim | length > 0
      tags:
        - diagnose

    - name: Test public IP reachability
      ansible.builtin.shell: |
        if ping -c 2 -W 2 "{{ dns_internet_probe_ip }}" >/dev/null 2>&1; then
          echo "REACHABLE"
        else
          echo "UNREACHABLE"
        fi
      args:
        executable: /bin/bash
      register: public_ip_test
      changed_when: false
      failed_when: false
      when: dns_gateway | trim | length > 0
      tags:
        - diagnose

    - name: Set network status
      ansible.builtin.set_fact:
        dns_gateway_status: >-
          {{
            'NO_GATEWAY'
            if (dns_gateway | trim | length == 0)
            else 'REACHABLE'
            if ((gateway_test.stdout | default('')) | trim == 'REACHABLE')
            else 'ICMP_BLOCKED_OR_FILTERED'
            if ((public_ip_test.stdout | default('')) | trim == 'REACHABLE')
            else 'UNREACHABLE'
          }}
      tags:
        - diagnose


    # ==========================================================
    # 8. IPv6 CONNECTIVITY
    # ==========================================================

    - name: Check IPv6 default route
      ansible.builtin.shell: |
        ip -6 route show default 2>/dev/null | head -n 1
      args:
        executable: /bin/bash
      register: ipv6_default_route
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Check global IPv6 address
      ansible.builtin.shell: |
        ip -6 addr show scope global 2>/dev/null |
        grep -c 'inet6' ||
        true
      args:
        executable: /bin/bash
      register: ipv6_global_address
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set IPv6 connectivity
      ansible.builtin.set_fact:
        dns_ipv6_available: >-
          {{
            (ipv6_default_route.stdout | trim | length > 0)
            and
            ((ipv6_global_address.stdout | trim | int) > 0)
          }}
      tags:
        - diagnose


    # ==========================================================
    # 9. /etc/hosts OVERRIDE
    # ==========================================================

    - name: Check /etc/hosts
      ansible.builtin.shell: |
        awk \
          -v h1="{{ dns_probe_hostname | lower }}" \
          -v h2="{{ dns_target_hostname | lower }}" '
          /^[[:space:]]*#/ {next}
          {
            for (i=2; i<=NF; i++) {
              if (tolower($i) == h1 || tolower($i) == h2) {
                print $0
              }
            }
          }
        ' /etc/hosts 2>/dev/null
      args:
        executable: /bin/bash
      register: hosts_override
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set hosts override
      ansible.builtin.set_fact:
        dns_hosts_override: "{{ hosts_override.stdout | trim | length > 0 }}"
      tags:
        - diagnose


    # ==========================================================
    # 10. LOCAL DNS LOOKUPS
    # ==========================================================

    - name: Test control hostname IPv4
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: control_ipv4
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Test secondary hostname IPv4
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_secondary_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: secondary_ipv4
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Test target hostname IPv4
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_target_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: target_ipv4
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set IPv4 lookup facts
      ansible.builtin.set_fact:
        dns_control_ipv4_ok: "{{ control_ipv4.stdout | trim | length > 0 }}"
        dns_secondary_ipv4_ok: "{{ secondary_ipv4.stdout | trim | length > 0 }}"
        dns_target_ipv4_ok: "{{ target_ipv4.stdout | trim | length > 0 }}"
      tags:
        - diagnose


    # ==========================================================
    # 11. IPv6 DNS LOOKUP
    # ==========================================================

    - name: Test control hostname IPv6
      ansible.builtin.shell: |
        getent ahostsv6 "{{ dns_probe_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: control_ipv6
      changed_when: false
      failed_when: false
      when: dns_ipv6_available
      tags:
        - diagnose

    - name: Set IPv6 lookup result
      ansible.builtin.set_fact:
        dns_control_ipv6_ok: >-
          {{
            (control_ipv6.stdout | default('') | trim | length > 0)
            if dns_ipv6_available
            else false
          }}
      tags:
        - diagnose


    # ==========================================================
    # 12. NONEXISTENT DOMAIN SANITY CHECK
    # ==========================================================

    - name: Test nonexistent hostname
      ansible.builtin.shell: |
        getent ahostsv4 "{{ dns_nonexistent_hostname }}" 2>/dev/null
      args:
        executable: /bin/bash
      register: nonexistent_dns
      changed_when: false
      failed_when: false
      tags:
        - diagnose

    - name: Set nonexistent-domain result
      ansible.builtin.set_fact:
        dns_nonexistent_failed: "{{ nonexistent_dns.stdout | trim | length == 0 }}"
      tags:
        - diagnose


    # ==========================================================
    # 13. DIRECT DNS SERVER TEST
    #
    # IMPORTANT:
    # This is the only section allowed to claim that a particular
    # DNS server timed out / failed / responded.
    #
    # No dig/nslookup:
    #   We do NOT invent direct DNS results.
    # ==========================================================

    - name: Direct DNS test with dig
      ansible.builtin.shell: |
        result="$(dig +time={{ dns_query_timeout }} +tries=1 @{{ item }} {{ dns_probe_hostname }} 2>&1)"

        if echo "$result" | grep -q "status: NOERROR"; then
          echo "{{ item }}=DNS_OK"
        elif echo "$result" | grep -q "status: NXDOMAIN"; then
          echo "{{ item }}=NXDOMAIN"
        elif echo "$result" | grep -q "status: SERVFAIL"; then
          echo "{{ item }}=SERVFAIL"
        elif echo "$result" | grep -qi "connection timed out\|communications error"; then
          echo "{{ item }}=TIMEOUT"
        elif echo "$result" | grep -qi "connection refused"; then
          echo "{{ item }}=REFUSED"
        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_effective_servers }}"
      register: direct_dns_dig
      changed_when: false
      failed_when: false
      when: dns_has_dig
      tags:
        - diagnose


    # ==========================================================
    # 14. DIRECT DNS SERVER TEST USING NSLOOKUP
    # ==========================================================

    - name: Direct DNS test with nslookup
      ansible.builtin.shell: |
        if [ "{{ dns_has_timeout }}" = "true" ]; then
          result="$(timeout {{ dns_query_timeout + 2 }} nslookup {{ dns_probe_hostname }} {{ item }} 2>&1)"
        else
          result="$(nslookup {{ dns_probe_hostname }} {{ item }} 2>&1)"
        fi

        if echo "$result" | grep -qi "Non-existent domain\|NXDOMAIN"; then
          echo "{{ item }}=NXDOMAIN"
        elif echo "$result" | grep -qi "SERVFAIL\|server failure"; then
          echo "{{ item }}=SERVFAIL"
        elif echo "$result" | grep -qi "timed out\|no servers could be reached"; then
          echo "{{ item }}=TIMEOUT"
        elif echo "$result" | grep -qi "connection refused"; then
          echo "{{ item }}=REFUSED"
        elif echo "$result" | grep -qE "^Address:|^Name:"; then
          echo "{{ item }}=DNS_OK"
        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_effective_servers }}"
      register: direct_dns_nslookup
      changed_when: false
      failed_when: false
      when:
        - not dns_has_dig
        - dns_has_nslookup
      tags:
        - diagnose


    # ==========================================================
    # 15. COMBINE DIRECT DNS RESULTS
    # ==========================================================

    - name: Build direct DNS result
      ansible.builtin.set_fact:
        dns_direct_results: >-
          {{
            (
              (direct_dns_dig.results | default([]))
              +
              (direct_dns_nslookup.results | default([]))
            )
            |
            map(attribute='stdout')
            |
            select('defined')
            |
            map('trim')
            |
            select('ne', '')
            |
            list
          }}

        dns_direct_test_available: "{{ dns_has_dig or dns_has_nslookup }}"
      tags:
        - diagnose


    - name: Calculate direct DNS status
      ansible.builtin.set_fact:
        dns_all_servers_ok: >-
          {{
            dns_direct_test_available
            and
            dns_effective_servers | length > 0
            and
            (
              dns_direct_results
              | select('search', '=DNS_OK$')
              | list
              | length
              ==
              dns_effective_servers | length
            )
          }}

        dns_any_server_ok: >-
          {{
            dns_direct_results
            | select('search', '=DNS_OK$')
            | list
            | length > 0
          }}

        dns_any_timeout: >-
          {{
            dns_direct_results
            | select('search', '=TIMEOUT$')
            | list
            | length > 0
          }}

        dns_any_failure: >-
          {{
            dns_direct_results
            | select('search', '=(TIMEOUT|SERVFAIL|REFUSED|DNS_ERROR)$')
            | list
            | length > 0
          }}

        dns_all_servers_failed: >-
          {{
            dns_direct_test_available
            and
            dns_effective_servers | length > 0
            and
            (
              dns_direct_results
              | select('search', '=(TIMEOUT|SERVFAIL|REFUSED|DNS_ERROR)$')
              | list
              | length
              ==
              dns_effective_servers | length
            )
          }}
      tags:
        - diagnose


    # ==========================================================
    # 16. PUBLIC DNS DIRECT TEST
    #
    # Used only when direct DNS capability exists.
    # ==========================================================

    - name: Test public DNS servers
      ansible.builtin.shell: |
        result="$(dig +time={{ dns_query_timeout }} +tries=1 @{{ item }} {{ dns_probe_hostname }} 2>&1)"

        if echo "$result" | grep -q "status: NOERROR"; then
          echo "{{ item }}=DNS_OK"
        elif echo "$result" | grep -qi "connection timed out\|communications error"; then
          echo "{{ item }}=TIMEOUT"
        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_public_servers }}"
      register: public_dns_dig
      changed_when: false
      failed_when: false
      when: dns_has_dig
      tags:
        - diagnose


    - name: Test public DNS servers using nslookup
      ansible.builtin.shell: |
        if [ "{{ dns_has_timeout }}" = "true" ]; then
          result="$(timeout {{ dns_query_timeout + 2 }} nslookup {{ dns_probe_hostname }} {{ item }} 2>&1)"
        else
          result="$(nslookup {{ dns_probe_hostname }} {{ item }} 2>&1)"
        fi

        if echo "$result" | grep -qi "timed out\|no servers could be reached"; then
          echo "{{ item }}=TIMEOUT"
        elif echo "$result" | grep -qE "^Address:|^Name:"; then
          echo "{{ item }}=DNS_OK"
        else
          echo "{{ item }}=DNS_ERROR"
        fi
      args:
        executable: /bin/bash
      loop: "{{ dns_public_servers }}"
      register: public_dns_nslookup
      changed_when: false
      failed_when: false
      when:
        - not dns_has_dig
        - dns_has_nslookup
      tags:
        - diagnose


    - name: Build public DNS result
      ansible.builtin.set_fact:
        dns_public_results: >-
          {{
            (
              (public_dns_dig.results | default([]))
              +
              (public_dns_nslookup.results | default([]))
            )
            |
            map(attribute='stdout')
            |
            select('defined')
            |
            map('trim')
            |
            select('ne', '')
            |
            list
          }}
      tags:
        - diagnose


    # ==========================================================
    # 17. SINGLE DETERMINISTIC CLASSIFICATION
    #
    # IMPORTANT:
    # There are NO subsequent classification tasks.
    # Therefore one classification cannot accidentally overwrite
    # another classification.
    # ==========================================================

    - name: Determine final DNS classification
      ansible.builtin.set_fact:
        dns_classification_name: >-
          {{
            'HOSTS_FILE_OVERRIDE_POSSIBLE'
            if dns_hosts_override

            else 'NETWORK_OR_GATEWAY_FAILURE'
            if dns_gateway_status in ['NO_GATEWAY', 'UNREACHABLE']

            else 'NO_DNS_SERVER_CONFIGURED'
            if dns_effective_servers | length == 0

            else 'DNS_TIMEOUT'
            if (
              dns_direct_test_available
              and dns_all_servers_failed
              and dns_any_timeout
            )

            else 'CONFIGURED_DNS_SERVER_FAILURE'
            if (
              dns_direct_test_available
              and dns_all_servers_failed
            )

            else 'LOCAL_RESOLVER_OR_CACHE_FAILURE'
            if (
              dns_direct_test_available
              and dns_all_servers_ok
              and not dns_control_ipv4_ok
            )

            else 'DNS_RECORD_NOT_FOUND'
            if (
              dns_control_ipv4_ok
              and not dns_target_ipv4_ok
              and dns_nonexistent_failed
              and dns_direct_test_available
              and dns_all_servers_ok
            )

            else 'IPV6_DNS_FAILURE'
            if (
              dns_ipv6_available
              and dns_control_ipv4_ok
              and not dns_control_ipv6_ok
              and dns_direct_test_available
              and dns_all_servers_ok
            )

            else 'RESOLUTION_WORKING'
            if (
              dns_control_ipv4_ok
              and dns_secondary_ipv4_ok
              and dns_target_ipv4_ok
              and (
                not dns_ipv6_available
                or dns_control_ipv6_ok
              )
            )

            else 'PUBLIC_DNS_UNAVAILABLE'
            if (
              dns_direct_test_available
              and dns_all_servers_failed
              and (
                dns_public_results
                | select('search', '=DNS_OK$')
                | list
                | length == 0
              )
            )

            else 'DNS_FAILURE_UNDETERMINED'
          }}

        dns_classification_reason: >-
          {{
            'The investigated hostname is present in /etc/hosts. DNS may be bypassed by NSS.'
            if dns_hosts_override

            else 'No usable default gateway or general network path could be confirmed.'
            if dns_gateway_status in ['NO_GATEWAY', 'UNREACHABLE']

            else 'No usable DNS nameserver is configured.'
            if dns_effective_servers | length == 0

            else 'All configured DNS servers timed out during direct DNS testing.'
            if (
              dns_direct_test_available
              and dns_all_servers_failed
              and dns_any_timeout
            )

            else 'All configured DNS servers failed during direct DNS testing.'
            if (
              dns_direct_test_available
              and dns_all_servers_failed
            )

            else 'Configured DNS servers responded successfully, but the local NSS/getent resolution path failed.'
            if (
              dns_direct_test_available
              and dns_all_servers_ok
              and not dns_control_ipv4_ok
            )

            else 'The control hostname resolves, but the investigated hostname does not. Direct DNS testing confirms the configured DNS servers are healthy.'
            if (
              dns_control_ipv4_ok
              and not dns_target_ipv4_ok
              and dns_nonexistent_failed
              and dns_direct_test_available
              and dns_all_servers_ok
            )

            else 'IPv4 DNS works but AAAA resolution failed on a host with usable IPv6 connectivity.'
            if (
              dns_ipv6_available
              and dns_control_ipv4_ok
              and not dns_control_ipv6_ok
              and dns_direct_test_available
              and dns_all_servers_ok
            )

            else 'Control, secondary, and target hostname resolution succeeded.'
            if (
              dns_control_ipv4_ok
              and dns_secondary_ipv4_ok
              and dns_target_ipv4_ok
              and (
                not dns_ipv6_available
                or dns_control_ipv6_ok
              )
            )

            else 'DNS failure could not be uniquely classified using the capabilities available on the target host.'
          }}
      tags:
        - diagnose


    # ==========================================================
    # 18. SAFE REMEDIATION DECISION
    # ==========================================================

    - name: Determine whether automatic DNS remediation is safe
      ansible.builtin.set_fact:
        safe_dns_remediation_allowed: >-
          {{
            dns_classification_name ==
            'LOCAL_RESOLVER_OR_CACHE_FAILURE'
          }}
      tags:
        - diagnose
        - remediate


    # ==========================================================
    # 19. LOCAL RESOLVER STATUS
    # ==========================================================

    - name: Check systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
      register: systemd_resolved_status
      changed_when: false
      failed_when: false
      when: safe_dns_remediation_allowed
      tags:
        - remediate

    - name: Check nscd
      ansible.builtin.systemd:
        name: nscd
      register: nscd_status
      changed_when: false
      failed_when: false
      when: safe_dns_remediation_allowed
      tags:
        - remediate


    # ==========================================================
    # 20. SAFE CACHE FLUSH
    # ==========================================================

    - name: Flush systemd-resolved cache
      ansible.builtin.command:
        cmd: resolvectl flush-caches
      register: resolved_flush
      changed_when: false
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - dns_has_resolvectl
        - systemd_resolved_status.status is defined
        - systemd_resolved_status.status.LoadState | default('not-found') == 'loaded'
      tags:
        - remediate


    # ==========================================================
    # 21. SAFE LOCAL RESOLVER RESTART
    # ==========================================================

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      register: resolved_restart
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - systemd_resolved_status.status is defined
        - systemd_resolved_status.status.LoadState | default('not-found') == 'loaded'
      tags:
        - remediate

    - name: Restart nscd
      ansible.builtin.systemd:
        name: nscd
        state: restarted
      register: nscd_restart
      failed_when: false
      when:
        - safe_dns_remediation_allowed
        - nscd_status.status is defined
        - nscd_status.status.LoadState | default('not-found') == 'loaded'
      tags:
        - remediate


    # ==========================================================
    # 22. VALIDATE REMEDIATION
    # ==========================================================

    - name: Validate DNS after remediation
      ansible.builtin.shell: |
        attempt=1

        while [ "$attempt" -le "{{ dns_validation_attempts }}" ]; do

          if getent ahostsv4 "{{ dns_probe_hostname }}" >/dev/null 2>&1; then
            echo "RESOLVED"
            exit 0
          fi

          sleep "{{ dns_validation_delay }}"
          attempt=$((attempt + 1))

        done

        echo "FAILED"
        exit 1
      args:
        executable: /bin/bash
      register: dns_validation
      changed_when: false
      failed_when: false
      when: safe_dns_remediation_allowed
      tags:
        - validate


    - name: Set validation result
      ansible.builtin.set_fact:
        dns_validation_result: >-
          {{
            dns_validation.stdout | trim
            if safe_dns_remediation_allowed
            else 'NOT_REQUIRED'
          }}
      tags:
        - validate


    # ==========================================================
    # 23. CREATE LOG DIRECTORY
    # ==========================================================

    - name: Create PiQuickHeal log directory
      ansible.builtin.file:
        path: "{{ dns_log_file | dirname }}"
        state: directory
        mode: "0755"
      failed_when: false
      tags:
        - diagnose


    # ==========================================================
    # 24. WRITE LOG
    # ==========================================================

    - name: Write DNS diagnosis log
      ansible.builtin.shell: >
        printf '%s host=%s target=%s classification=%s remediation=%s validation=%s
        nameservers="%s" gateway_status=%s control_ipv4=%s target_ipv4=%s
        ipv6_available=%s ipv6_ok=%s\n'
        "$(date '+%Y-%m-%d %H:%M:%S')"
        "{{ inventory_hostname }}"
        "{{ dns_target_hostname }}"
        "{{ dns_classification_name }}"
        "{{ safe_dns_remediation_allowed }}"
        "{{ dns_validation_result }}"
        "{{ dns_effective_servers | join(',') }}"
        "{{ dns_gateway_status }}"
        "{{ dns_control_ipv4_ok }}"
        "{{ dns_target_ipv4_ok }}"
        "{{ dns_ipv6_available }}"
        "{{ dns_control_ipv6_ok }}"
        >> "{{ dns_log_file }}"
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      tags:
        - diagnose


    # ==========================================================
    # 25. AWX / PIQUICKHEAL OUTPUT
    # ==========================================================

    - name: Publish PiQuickHeal DNS result
      ansible.builtin.set_stats:
        data:
          piquickheal_dns_classification: "{{ dns_classification_name }}"
          piquickheal_dns_reason: "{{ dns_classification_reason }}"
          piquickheal_dns_target: "{{ dns_target_hostname }}"
          piquickheal_dns_nameservers: "{{ dns_effective_servers | join(',') }}"
          piquickheal_dns_gateway_status: "{{ dns_gateway_status }}"
          piquickheal_dns_hosts_override: "{{ dns_hosts_override }}"
          piquickheal_dns_control_ipv4: "{{ dns_control_ipv4_ok }}"
          piquickheal_dns_target_ipv4: "{{ dns_target_ipv4_ok }}"
          piquickheal_dns_ipv6_available: "{{ dns_ipv6_available }}"
          piquickheal_dns_ipv6_ok: "{{ dns_control_ipv6_ok }}"
          piquickheal_dns_direct_test_available: "{{ dns_direct_test_available }}"
          piquickheal_dns_direct_results: "{{ dns_direct_results | join(', ') }}"
          piquickheal_dns_safe_remediation: "{{ safe_dns_remediation_allowed }}"
          piquickheal_dns_validation: "{{ dns_validation_result }}"
      tags:
        - diagnose
        - remediate
        - validate


    # ==========================================================
    # 26. FINAL RESULT
    # ==========================================================

    - name: Display final DNS result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "PiQuickHeal DNS Diagnosis Result"
          - "=============================================="
          - "Classification: {{ dns_classification_name }}"
          - "Reason: {{ dns_classification_reason }}"
          - "Target: {{ dns_target_hostname }}"
          - "DNS servers: {{ dns_effective_servers | join(', ') if dns_effective_servers | length > 0 else 'NONE' }}"
          - "Gateway status: {{ dns_gateway_status }}"
          - "Hosts override: {{ dns_hosts_override }}"
          - "Control IPv4: {{ 'OK' if dns_control_ipv4_ok else 'FAIL' }}"
          - "Secondary IPv4: {{ 'OK' if dns_secondary_ipv4_ok else 'FAIL' }}"
          - "Target IPv4: {{ 'OK' if dns_target_ipv4_ok else 'FAIL' }}"
          - "IPv6 available: {{ dns_ipv6_available }}"
          - "IPv6 resolution: {{ 'OK' if dns_control_ipv6_ok else 'FAIL/SKIPPED' }}"
          - "Direct DNS testing: {{ 'AVAILABLE' if dns_direct_test_available else 'UNAVAILABLE' }}"
          - "Direct DNS results: {{ dns_direct_results | join(', ') if dns_direct_results | length > 0 else 'NOT_AVAILABLE' }}"
          - "NSS hosts order: {{ dns_nss_hosts }}"
          - "Safe remediation: {{ safe_dns_remediation_allowed }}"
          - "Validation: {{ dns_validation_result }}"
          - "=============================================="
      tags:
        - diagnose
        - remediate
        - validate
