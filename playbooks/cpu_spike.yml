---
# PiQuickHeal - CPU Spike Diagnosis and Remediation
#
# AWX Job Templates:
#
# 1. piquickheal-cpu_spike-diagnose
#    Tags: diagnose
#
# 2. piquickheal-cpu_spike-remediate
#    Tags: remediate,validate
#
# Workflow:
#
# Diagnose → Approval → Remediate → Validate
#
# Run against a single host:
# ansible-playbook cpu_spike.yml -l hostname
#
# AWX:
# Use the Limit field to select a specific host.

- name: PiQuickHeal - CPU Spike
  hosts: all
  become: true
  gather_facts: true

  vars:

    # CPU recovery threshold
    cpu_recover_threshold: 15

    # Processes that must never be automatically killed
    protected_processes:
      - systemd
      - init
      - sshd
      - ssh
      - NetworkManager
      - dbus-daemon
      - dockerd
      - containerd
      - mysqld
      - postgres
      - postgresql
      - nginx
      - httpd

    # Heal log file
    heal_log_path: /var/log/piquickheal/heal.log


  tasks:

    # ============================================================
    # STAGE 1: DIAGNOSE
    # ============================================================

    - name: "STAGE 1 - Diagnose top CPU consumer"
      ansible.builtin.shell: |
        set -o pipefail

        echo "============================================================"
        echo "        PIQUICKHEAL - CPU SPIKE DIAGNOSIS"
        echo "============================================================"

        echo ""
        echo "[1] SYSTEM UPTIME AND LOAD"
        echo "------------------------------------------------------------"

        uptime

        echo ""
        echo "[2] TOP 10 CPU-CONSUMING PROCESSES"
        echo "------------------------------------------------------------"

        # Run top twice with a 1-second interval.
        # The second sample gives a more realistic CPU usage value.
        TOP_BLOCK=$(top -bn2 -d 1)

        echo "$TOP_BLOCK" | awk '
          /^ *PID/ {
              c++
              if (c == 2) {
                  print
                  n=0
              }
              next
          }

          c == 2 && n < 10 {
              print
              n++
          }
        '

        echo ""
        echo "[3] TOP CPU CONSUMER DETAILS"
        echo "------------------------------------------------------------"

        HEADER_LINE=$(echo "$TOP_BLOCK" | awk '
          /^ *PID/ {
              c++
          }

          c == 2 {
              print
              exit
          }
        ')

        DATA_LINE=$(echo "$TOP_BLOCK" | awk '
          /^ *PID/ {
              c++
              next
          }

          c == 2 && NF > 0 {
              print
              exit
          }
        ')

        if [ -z "$DATA_LINE" ]; then
            echo "ERROR: Unable to identify top CPU-consuming process"
            exit 1
        fi

        PID_COL=$(echo "$HEADER_LINE" | awk '
          {
              for (i=1; i<=NF; i++) {
                  if ($i == "PID") {
                      print i
                  }
              }
          }
        ')

        CPU_COL=$(echo "$HEADER_LINE" | awk '
          {
              for (i=1; i<=NF; i++) {
                  if ($i == "%CPU") {
                      print i
                  }
              }
          }
        ')

        MEM_COL=$(echo "$HEADER_LINE" | awk '
          {
              for (i=1; i<=NF; i++) {
                  if ($i == "%MEM") {
                      print i
                  }
              }
          }
        ')

        CMD_COL=$(echo "$HEADER_LINE" | awk '
          {
              for (i=1; i<=NF; i++) {
                  if ($i == "COMMAND") {
                      print i
                  }
              }
          }
        ')

        TOP_PID=$(echo "$DATA_LINE" | awk -v c="$PID_COL" '{print $c}')
        TOP_CPU=$(echo "$DATA_LINE" | awk -v c="$CPU_COL" '{print $c}')
        TOP_MEM=$(echo "$DATA_LINE" | awk -v c="$MEM_COL" '{print $c}')
        TOP_NAME=$(echo "$DATA_LINE" | awk -v c="$CMD_COL" '{print $c}')

        echo "Process Name : $TOP_NAME"
        echo "PID          : $TOP_PID"
        echo "CPU Usage    : ${TOP_CPU}%"
        echo "Memory Usage : ${TOP_MEM}%"
        echo "Command      : $TOP_NAME"

        echo ""
        echo "[4] PROTECTED PROCESS CHECK"
        echo "------------------------------------------------------------"

        PROTECTED='{{ protected_processes | join(" ") }}'

        echo "Protected Process List:"
        echo "$PROTECTED"

        IS_PROT=false
        PROTECTED_MATCH=""

        for P in $PROTECTED; do

            if echo "$TOP_NAME" | grep -qi "^${P}$"; then
                IS_PROT=true
                PROTECTED_MATCH="$P"
                break
            fi

        done

        if [ "$IS_PROT" = true ]; then

            TOTAL=$(pgrep -xc "$TOP_NAME" 2>/dev/null || echo 0)

            echo ""
            echo "============================================================"
            echo "RESULT: PROTECTED PROCESS"
            echo "============================================================"

            echo "Protected Name : $PROTECTED_MATCH"
            echo "PID            : $TOP_PID"
            echo "CPU Usage      : ${TOP_CPU}%"
            echo "Memory Usage   : ${TOP_MEM}%"
            echo "Total Instances: $TOTAL"
            echo "ACTION         : NO AUTOMATIC REMEDIATION"

            echo ""
            echo "Protected Process Instances:"
            echo "------------------------------------------------------------"

            for IPID in $(pgrep -x "$TOP_NAME" 2>/dev/null); do

                ISTATS=$(ps -p "$IPID" -o pcpu=,pmem= 2>/dev/null)

                if [ -n "$ISTATS" ]; then

                    ICPU=$(echo "$ISTATS" | awk '{print $1}')
                    IMEM=$(echo "$ISTATS" | awk '{print $2}')

                    echo "PID: $IPID | CPU: ${ICPU}% | MEM: ${IMEM}%"

                fi

            done

            echo ""
            echo "PROTECTED_PROCESS_FOUND:${TOP_NAME} PID:${TOP_PID} METRIC:${TOP_CPU}%"

            echo "Top_process_is_protected_no_remediation_will_be_proposed"

        else

            echo ""
            echo "============================================================"
            echo "RESULT: NON-PROTECTED PROCESS"
            echo "============================================================"

            echo "Process Name : $TOP_NAME"
            echo "PID          : $TOP_PID"
            echo "CPU Usage    : ${TOP_CPU}%"
            echo "Memory Usage : ${TOP_MEM}%"
            echo "Command      : $TOP_NAME"
            echo "ACTION       : REMEDIATION MAY BE PROPOSED"

            echo ""
            echo "Top_process_not_protected:${TOP_NAME} PID:${TOP_PID} METRIC:${TOP_CPU}%"

        fi

        echo ""
        echo "============================================================"
        echo "        END OF CPU SPIKE DIAGNOSIS"
        echo "============================================================"

      register: diagnose_result
      changed_when: false
      tags:
        - diagnose


    # ============================================================
    # DISPLAY DIAGNOSIS OUTPUT
    # ============================================================

    - name: "STAGE 1 - Show complete diagnosis output"
      ansible.builtin.debug:
        var: diagnose_result.stdout_lines
      tags:
        - diagnose


    # ============================================================
    # IDENTIFY PROTECTED PROCESS
    # ============================================================

    - name: "STAGE 1 - Flag whether the top process is protected"
      ansible.builtin.set_fact:
        top_process_protected: >-
          {{ 'PROTECTED_PROCESS_FOUND' in diagnose_result.stdout }}
      tags:
        - diagnose


    # ============================================================
    # PUBLISH DIAGNOSIS RESULT
    # ============================================================

    - name: "STAGE 1 - Publish diagnosis result"
      ansible.builtin.set_stats:
        data:
          top_process_protected: "{{ top_process_protected }}"
          diagnostic_output: "{{ diagnose_result.stdout }}"
      tags:
        - diagnose


    # ============================================================
    # STAGE 2: REMEDIATION
    # ============================================================

    - name: "STAGE 2 - Identify current top CPU consumer"
      ansible.builtin.shell: |
        set -o pipefail

        echo "============================================================"
        echo "        PIQUICKHEAL - CPU SPIKE REMEDIATION"
        echo "============================================================"

        echo ""
        echo "[1] IDENTIFYING CURRENT TOP CPU PROCESS"
        echo "------------------------------------------------------------"

        TOP_BLOCK=$(top -bn2 -d 1)

        HEADER_LINE=$(echo "$TOP_BLOCK" | awk '
          /^ *PID/ {
              c++
          }

          c == 2 {
              print
              exit
          }
        ')

        DATA_LINE=$(echo "$TOP_BLOCK" | awk '
          /^ *PID/ {
              c++
              next
          }

          c == 2 && NF > 0 {
              print
              exit
          }
        ')

        if [ -z "$DATA_LINE" ]; then
            echo "ERROR: Unable to identify top CPU-consuming process"
            exit 1
        fi

        PID_COL=$(echo "$HEADER_LINE" | awk '
          {
              for (i=1; i<=NF; i++) {
                  if ($i == "PID") {
                      print i
                  }
              }
          }
        ')

        CPU_COL=$(echo "$HEADER_LINE" | awk '
          {
              for (i=1; i<=NF; i++) {
                  if ($i == "%CPU") {
                      print i
                  }
              }
          }
        ')

        CMD_COL=$(echo "$HEADER_LINE" | awk '
          {
              for (i=1; i<=NF; i++) {
                  if ($i == "COMMAND") {
                      print i
                  }
              }
          }
        ')

        TOP_PID=$(echo "$DATA_LINE" | awk -v c="$PID_COL" '{print $c}')
        TOP_CPU=$(echo "$DATA_LINE" | awk -v c="$CPU_COL" '{print $c}')
        TOP_NAME=$(echo "$DATA_LINE" | awk -v c="$CMD_COL" '{print $c}')

        echo "Target Process : $TOP_NAME"
        echo "Target PID     : $TOP_PID"
        echo "CPU Usage      : ${TOP_CPU}%"

        echo ""
        echo "[2] PROTECTED PROCESS VALIDATION"
        echo "------------------------------------------------------------"

        PROTECTED='{{ protected_processes | join(" ") }}'

        IS_PROTECTED=false

        for P in $PROTECTED; do

            if echo "$TOP_NAME" | grep -qi "^${P}$"; then
                IS_PROTECTED=true
                break
            fi

        done

        if [ "$IS_PROTECTED" = true ]; then

            echo "============================================================"
            echo "PROTECTED PROCESS DETECTED"
            echo "============================================================"

            echo "Process: $TOP_NAME"
            echo "PID    : $TOP_PID"
            echo "ACTION : NO REMEDIATION"

            echo "PROTECTED_PROCESS_FOUND:${TOP_NAME} PID:${TOP_PID}"

            exit 10

        fi

        echo ""
        echo "[3] PROCESS VALIDATION"
        echo "------------------------------------------------------------"

        if ! kill -0 "$TOP_PID" 2>/dev/null; then

            echo "Process PID $TOP_PID no longer exists."
            echo "ACTION: NO REMEDIATION REQUIRED"

            exit 0

        fi

        echo "Process PID $TOP_PID is active."

        echo ""
        echo "[4] REMEDIATION ACTION"
        echo "------------------------------------------------------------"

        echo "Sending SIGTERM to PID $TOP_PID..."

        kill -15 "$TOP_PID" 2>/dev/null || true

        sleep 3

        if kill -0 "$TOP_PID" 2>/dev/null; then

            echo "Process still running."
            echo "Sending SIGKILL to PID $TOP_PID..."

            kill -9 "$TOP_PID" 2>/dev/null || true

        else

            echo "Process stopped gracefully."

        fi

        sleep 1

        echo ""
        echo "[5] POST-REMEDIATION CHECK"
        echo "------------------------------------------------------------"

        if kill -0 "$TOP_PID" 2>/dev/null; then

            echo "PID $TOP_PID is still running."
            echo "REMEDIATION_STATUS: FAILED"

        else

            echo "PID $TOP_PID is no longer running."
            echo "REMEDIATION_STATUS: SUCCESS"

        fi

        echo ""
        echo "============================================================"
        echo "        END OF CPU SPIKE REMEDIATION"
        echo "============================================================"

      register: kill_result
      changed_when: true
      when:
        - not (top_process_protected | default(false) | bool)
      tags:
        - remediate


    # ============================================================
    # DISPLAY REMEDIATION OUTPUT
    # ============================================================

    - name: "STAGE 2 - Show remediation output"
      ansible.builtin.debug:
        var: kill_result.stdout_lines
      when:
        - not (top_process_protected | default(false) | bool)
      tags:
        - remediate


    # ============================================================
    # PUBLISH REMEDIATION OUTPUT
    # ============================================================

    - name: "STAGE 2 - Publish remediation output"
      ansible.builtin.set_stats:
        data:
          remediation_output: "{{ kill_result.stdout }}"
      when:
        - not (top_process_protected | default(false) | bool)
      tags:
        - remediate


    # ============================================================
    # STAGE 3: VALIDATE
    # ============================================================

    - name: "STAGE 3 - Poll CPU until recovery"
      ansible.builtin.shell: |
        CPU_USAGE=$(top -bn1 | awk -F',' '/Cpu\(s\)/ {

          for (i = 1; i <= NF; i++) {

            if ($i ~ /id/) {

              gsub(/[^0-9.]/, "", $i)

              print 100 - $i

              exit

            }

          }

        }')

        echo "${CPU_USAGE:-100}"

      register: cpu_check
      changed_when: false
      failed_when: false

      until:
        - (cpu_check.stdout | default('100') | float) < cpu_recover_threshold

      retries: 6
      delay: 5

      when:
        - not (top_process_protected | default(false) | bool)

      tags:
        - validate


    # ============================================================
    # RECORD HEAL RESULT
    # ============================================================

    - name: "STAGE 3 - Record heal result"
      ansible.builtin.shell: |
        mkdir -p "$(dirname "{{ heal_log_path }}")"

        if [ "{{ (cpu_check.stdout | default('100') | float) < cpu_recover_threshold }}" = "True" ]; then

            STATUS="HEALED"

        else

            STATUS="HEAL_FAILED"

        fi

        echo "$(date '+%Y-%m-%d %H:%M:%S %Z') [$STATUS cpu_spike] $(hostname)" >> "{{ heal_log_path }}"

      when:
        - not (top_process_protected | default(false) | bool)

      tags:
        - validate


    # ============================================================
    # REPORT FINAL RESULT
    # ============================================================

    - name: "STAGE 3 - Report final outcome"
      ansible.builtin.debug:
        msg: >-
          {{
            'HEAL_CONFIRMED_CPU_BELOW_THRESHOLD'
            if (cpu_check.stdout | default('100') | float) < cpu_recover_threshold
            else
            'HEAL_FAILED_CPU_STILL_ELEVATED'
          }}

      when:
        - not (top_process_protected | default(false) | bool)

      tags:
        - validate
