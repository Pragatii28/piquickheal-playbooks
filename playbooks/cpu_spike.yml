---
# Equivalent of PLAYBOOKS["cpu_spike"] from playbooks.py.
#
# AWX wiring:
#   Job Template A: "piquickheal-cpu_spike-diagnose"  -> tags: diagnose
#   Job Template B: "piquickheal-cpu_spike-remediate" -> tags: remediate,validate
#   Workflow Template: A -> [Approval] -> B
#
# Run against a single host by passing -l <hostname>
# AWX: "limit" field

- name: PiQuickHeal - cpu_spike
  hosts: all

  vars:

    # CPU recovery threshold
    cpu_recover_threshold: 15

    # Processes that must never be automatically killed
    protected_processes:
      - systemd
      - init
      - sshd
      - ssh
      - NetworkManager
      - dbus-daemon
      - dockerd
      - containerd
      - mysqld
      - postgres
      - postgresql
      - nginx
      - httpd

    # Heal log file
    heal_log_path: /var/log/piquickheal/heal.log

  tasks:

    # ─────────────────────────────────────────────────────────────────────
    # STAGE 1: DIAGNOSE
    # Tags: diagnose
    # ─────────────────────────────────────────────────────────────────────

    - name: "STAGE 1 - Diagnose top CPU consumer"
      tags:
        - diagnose

      changed_when: false

      shell: |
        echo "============================================================"
        echo "        PIQUICKHEAL - CPU SPIKE DIAGNOSIS"
        echo "============================================================"

        echo ""
        echo "[1] SYSTEM UPTIME AND LOAD"
        echo "------------------------------------------------------------"

        uptime

        echo ""
        echo "[2] TOP CPU-CONSUMING PROCESSES"
        echo "------------------------------------------------------------"

        ps aux --sort=-%cpu | head -11 || true

        echo ""
        echo "[3] TOP CPU CONSUMER DETAILS"
        echo "------------------------------------------------------------"

        TOP_LINE=$(ps aux --sort=-%cpu --no-headers | head -1 || true)

        if [ -z "$TOP_LINE" ]; then

          echo "ERROR: Unable to identify top CPU-consuming process"

          exit 1

        fi

        TOP_PID=$(echo "$TOP_LINE" | awk '{print $2}')
        TOP_CPU=$(echo "$TOP_LINE" | awk '{print $3}')
        TOP_MEM=$(echo "$TOP_LINE" | awk '{print $4}')

        TOP_CMD=$(echo "$TOP_LINE" | awk '{for(i=11;i<=NF;i++) printf "%s ", $i}')

        TOP_NAME=$(echo "$TOP_LINE" | awk '{print $11}' | xargs -r basename)

        echo "Process Name : $TOP_NAME"
        echo "PID          : $TOP_PID"
        echo "CPU Usage    : ${TOP_CPU}%"
        echo "Memory Usage : ${TOP_MEM}%"
        echo "Command      : $TOP_CMD"

        echo ""
        echo "[4] PROTECTED PROCESS CHECK"
        echo "------------------------------------------------------------"

        PROTECTED='{{ protected_processes | join(" ") }}'

        echo "Protected Process List:"
        echo "$PROTECTED"

        IS_PROT=false
        PROTECTED_MATCH=""

        for P in $PROTECTED; do

          if echo "$TOP_NAME" | grep -qi "^${P}$"; then

            IS_PROT=true
            PROTECTED_MATCH="$P"

            break

          fi

        done

        if [ "$IS_PROT" = true ]; then

          TOTAL=$(pgrep -xc "$TOP_NAME" 2>/dev/null || echo 0)

          echo ""
          echo "============================================================"
          echo "RESULT: PROTECTED PROCESS"
          echo "============================================================"

          echo "Protected Name : $PROTECTED_MATCH"
          echo "PID            : $TOP_PID"
          echo "CPU Usage      : ${TOP_CPU}%"
          echo "Memory Usage   : ${TOP_MEM}%"
          echo "Total Instances: $TOTAL"
          echo "ACTION         : NO AUTOMATIC REMEDIATION"

          echo ""
          echo "Protected Process Instances:"
          echo "------------------------------------------------------------"

          for IPID in $(pgrep -x "$TOP_NAME" 2>/dev/null); do

            ISTATS=$(ps -p "$IPID" -o pcpu=,pmem= 2>/dev/null)

            if [ -n "$ISTATS" ]; then

              ICPU=$(echo "$ISTATS" | awk '{print $1}')
              IMEM=$(echo "$ISTATS" | awk '{print $2}')

              echo "PID: $IPID | CPU: ${ICPU}% | MEM: ${IMEM}%"

            fi

          done

          echo ""
          echo "PROTECTED_PROCESS_FOUND:${TOP_NAME} PID:${TOP_PID} METRIC:${TOP_CPU}%"

          echo "Top_process_is_protected_no_remediation_will_be_proposed"

        else

          echo ""
          echo "============================================================"
          echo "RESULT: NON-PROTECTED PROCESS"
          echo "============================================================"

          echo "Process Name : $TOP_NAME"
          echo "PID          : $TOP_PID"
          echo "CPU Usage    : ${TOP_CPU}%"
          echo "Memory Usage : ${TOP_MEM}%"
          echo "Command      : $TOP_CMD"
          echo "ACTION       : REMEDIATION MAY BE PROPOSED"

          echo ""
          echo "Top_process_not_protected:${TOP_NAME} PID:${TOP_PID} METRIC:${TOP_CPU}%"

        fi

        echo ""
        echo "============================================================"
        echo "        END OF CPU SPIKE DIAGNOSIS"
        echo "============================================================"

      register: diagnose_result


    - name: "STAGE 1 - Show complete diagnosis output"
      tags:
        - diagnose

      debug:
        var: diagnose_result.stdout_lines


    - name: "STAGE 1 - Flag whether the top process is protected"
      tags:
        - diagnose

      set_fact:
        top_process_protected: >-
          {{ 'PROTECTED_PROCESS_FOUND' in diagnose_result.stdout }}


    - name: "STAGE 1 - Publish result for the workflow/orchestrator"
      tags:
        - diagnose

      set_stats:
        data:
          top_process_protected: "{{ top_process_protected }}"


    # ─────────────────────────────────────────────────────────────────────
    # STAGE 2: KILL
    # Tags: remediate
    #
    # Only runs when:
    # top_process_protected == false
    #
    # In AWX, this stage should be executed after approval.
    # ─────────────────────────────────────────────────────────────────────

    - name: "STAGE 2 - Kill top CPU consumer"
      tags:
        - remediate

      when:
        - not (top_process_protected | default(false) | bool)

      shell: |
        echo "============================================================"
        echo "        PIQUICKHEAL - CPU SPIKE REMEDIATION"
        echo "============================================================"

        echo ""
        echo "[1] IDENTIFYING CURRENT TOP CPU PROCESS"
        echo "------------------------------------------------------------"

        TOP_LINE=$(ps aux --sort=-%cpu --no-headers | head -1 || true)

        if [ -z "$TOP_LINE" ]; then

          echo "ERROR: Unable to identify top CPU-consuming process"

          exit 1

        fi

        TOP_PID=$(echo "$TOP_LINE" | awk '{print $2}')
        TOP_CPU=$(echo "$TOP_LINE" | awk '{print $3}')

        TOP_CMD=$(echo "$TOP_LINE" | awk '{for(i=11;i<=NF;i++) printf "%s ", $i}')

        TOP_NAME=$(echo "$TOP_LINE" | awk '{print $11}' | xargs -r basename)

        echo "Target Process : $TOP_NAME"
        echo "Target PID     : $TOP_PID"
        echo "CPU Usage      : ${TOP_CPU}%"
        echo "Command        : $TOP_CMD"

        echo ""
        echo "[2] REMEDIATION ACTION"
        echo "------------------------------------------------------------"

        echo "Sending SIGKILL to all $TOP_NAME processes..."

        pkill -9 -x "$TOP_NAME" 2>/dev/null \
          && echo "pkill -9 $TOP_NAME: SUCCESS" \
          || echo "pkill: no match (process may already be gone)"

        kill -9 "$TOP_PID" 2>/dev/null \
          && echo "kill -9 PID $TOP_PID: SUCCESS" \
          || echo "PID $TOP_PID already gone"

        PGID=$(ps -p "$TOP_PID" -o pgid= 2>/dev/null | tr -d ' ')

        if [ -n "$PGID" ] && [ "$PGID" -gt 1 ]; then

          kill -9 "-$PGID" 2>/dev/null \
            && echo "kill -9 PGID $PGID: SUCCESS" \
            || true

        fi

        sleep 1

        echo ""
        echo "[3] POST-REMEDIATION PROCESS CHECK"
        echo "------------------------------------------------------------"

        REMAINING=$(pgrep -xc "$TOP_NAME" 2>/dev/null || echo 0)

        echo "Remaining $TOP_NAME processes: $REMAINING"

        echo ""
        echo "============================================================"
        echo "        END OF CPU SPIKE REMEDIATION"
        echo "============================================================"

      register: kill_result


    - name: "STAGE 2 - Show remediation output"
      tags:
        - remediate

      debug:
        var: kill_result.stdout_lines

      when:
        - not (top_process_protected | default(false) | bool)


    # ─────────────────────────────────────────────────────────────────────
    # STAGE 3: VALIDATE
    # Tags: validate
    # ─────────────────────────────────────────────────────────────────────

    - name: "STAGE 3 - Poll CPU until it recovers"
      tags:
        - validate

      when:
        - not (top_process_protected | default(false) | bool)

      shell: |
        CPU_USAGE=$(top -bn1 | awk -F',' '/Cpu\(s\)/ {
          for (i = 1; i <= NF; i++) {
            if ($i ~ /id/) {
              gsub(/[^0-9.]/, "", $i)
              print 100 - $i
              exit
            }
          }
        }')

        echo "${CPU_USAGE:-100}"

      register: cpu_check

      until:
        - (cpu_check.stdout | default('100') | float) < cpu_recover_threshold

      retries: 6
      delay: 5

      changed_when: false
      failed_when: false


    - name: "STAGE 3 - Record heal result to the same log file the Python version used"
      tags:
        - validate

      when:
        - not (top_process_protected | default(false) | bool)

      shell: |
        mkdir -p "$(dirname "{{ heal_log_path }}")"

        echo "$(date '+%Y-%m-%d %H:%M:%S IST') [{{ 'HEALED' if (cpu_check.stdout | default('100') | float) < cpu_recover_threshold else 'HEAL_FAILED' }} cpu_spike] $(hostname)" >> "{{ heal_log_path }}"


    - name: "STAGE 3 - Report outcome"
      tags:
        - validate

      when:
        - not (top_process_protected | default(false) | bool)

      debug:
        msg: >-
          {{
            'HEAL_CONFIRMED_CPU_below_threshold'
            if (cpu_check.stdout | default('100') | float) < cpu_recover_threshold
            else
            'HEAL_FAILED_CPU_still_elevated'
          }}
