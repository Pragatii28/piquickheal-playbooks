---
# ============================================================
# PiQuickHeal - Dynamic TLS / SSL Certificate Health
#
# Supported execution:
#
#   Diagnose:
#     ansible-playbook tls_certificate_health.yml \
#       -i inventory \
#       --tags diagnose
#
#   Remediate:
#     ansible-playbook tls_certificate_health.yml \
#       -i inventory \
#       --tags remediate
#
#   Validate:
#     ansible-playbook tls_certificate_health.yml \
#       -i inventory \
#       --tags validate
#
#   Complete:
#     ansible-playbook tls_certificate_health.yml \
#       -i inventory
#
# Design:
#   1. Discover certificates dynamically
#   2. Parse certificate metadata
#   3. Classify leaf/intermediate/root
#   4. Detect certificate provider
#   5. Detect renewal mechanism
#   6. Discover TLS listeners
#   7. Diagnose certificate health
#   8. Remediate only supported/safe mechanisms
#   9. Reload relevant service
#  10. Validate result
#
# IMPORTANT:
#   External/unknown certificate providers are detected but
#   are NOT executed blindly.
#
# CHANGELOG (fixes applied after AWX job 84)
#   - FIXED: STAGE 5 crashed with
#       AttributeError: 'NoneType' object has no attribute 'group'
#     Cause: regex_search() was passed the backreference '\\1' from inside a
#     YAML folded block scalar. Block scalars do not process escapes, so the
#     filter received a two-character backslash sequence, took the
#     "starts with a backslash" branch and then failed its own internal
#     re.match(). The record parsing is now done in one pass with from_json,
#     so no backreferences are used at all.
#   - FIXED: STAGE 5 only ever captured the FIRST certificate per file.
#     regex_search returns a single match, so a 146-certificate CA bundle
#     produced exactly one record and 145 certificates were silently dropped.
#   - FIXED: STAGE 12 always produced an empty port list (same backreference
#     bug, plus select('string') applied to a list), which meant STAGE 14
#     never probed any endpoint.
#   - FIXED: false CRITICAL on OpenSSL trusted-certificate files. `date -d ""`
#     returns today at midnight, so an unparseable notAfter became
#     days_remaining=0 -> CRITICAL. Unparseable certificates are now reported
#     as UNPARSEABLE and excluded from the health verdict.
#   - CHANGED: certificate inspection moved from a nested shell/openssl loop
#     (about 8 openssl processes per certificate) to a single Python pass with
#     one openssl invocation per certificate.
#   - CHANGED: discovery no longer walks the system CA trust store, vendored
#     Python certifi/botocore bundles, or the fwupd firmware-signing CAs by
#     default. Set tls_include_trust_stores=true to restore the old behaviour.
#   - FIXED: STAGE 25 reported PASSED on every run, because it compared the
#     exit status of a shell loop that could not fail. It now re-inspects and
#     reports NOT_RUN / NOT_REQUIRED / PASSED / FAILED.
#   - FIXED: STAGE 21 started .timer units, which only arms the schedule and
#     never runs the renewal. The matching .service units are now triggered.
#   - ADDED: STAGE 21B regenerates self-signed leaf certificates, which no
#     external mechanism can renew. Reuses the existing private key, backs up
#     the original, and refuses anything it cannot handle confidently. Gated
#     behind tls_allow_selfsigned_regeneration in addition to
#     tls_allow_remediation, with a dry-run mode.
# ============================================================

- name: PiQuickHeal - Dynamic TLS SSL Certificate Health
  hosts: all
  become: true
  gather_facts: true

  vars:

    # --------------------------------------------------------
    # General settings
    # --------------------------------------------------------

    tls_log_file: "/var/log/piquickheal/tls_certificate_rotation.log"

    tls_expiry_critical_days: 7
    tls_expiry_warning_days: 30

    tls_probe_timeout: 5

    # --------------------------------------------------------
    # Inspection limits
    #
    # tls_include_trust_stores:
    #   false  -> skip the system CA trust store and vendored
    #             Python certifi/botocore bundles (recommended)
    #   true   -> inspect everything that was discovered
    #
    # tls_max_certs_per_file:
    #   Hard cap on certificates inspected per file. Files with
    #   more certificates are reported as TRUNCATED rather than
    #   inspected in full.
    # --------------------------------------------------------

    tls_include_trust_stores: false

    tls_max_certs_per_file: 50

    tls_inspector_path: /tmp/piquickheal_tls_inspect.py
    tls_regen_path: /tmp/piquickheal_tls_regen.py

    # --------------------------------------------------------
    # Self-signed regeneration
    #
    # A CA-issued certificate cannot be regenerated locally:
    # there is no issuer available to sign a replacement, and
    # substituting a self-signed one would swap a trusted
    # certificate for an untrusted one. So this path is limited
    # to certificates that are already self-signed, and it sits
    # behind its own flag in addition to tls_allow_remediation.
    #
    # Enable with:
    #   -e tls_allow_remediation=true
    #   -e tls_allow_selfsigned_regeneration=true
    #
    # tls_selfsigned_dry_run reports what would change without
    # writing anything. Run that first.
    # --------------------------------------------------------

    tls_allow_selfsigned_regeneration: true

    tls_selfsigned_dry_run: false

    tls_selfsigned_validity_days: 397

    # When no private key matching the certificate can be
    # found, generate a new keypair rather than refusing.
    #
    # ##################################################
    # #  WARNING - NEW KEY GENERATION IS ENABLED       #
    # ##################################################
    #
    # A new key means every service and client pinned to the
    # old key stops working. The playbook cannot distinguish an
    # orphaned test fixture from a production certificate whose
    # key simply lives somewhere the search did not look, so on
    # a host that terminates TLS this can break handshakes.
    #
    # Enabled here on request. Set to false to restore the
    # refuse-by-default behaviour.
    tls_selfsigned_allow_new_key: true

    # --------------------------------------------------------
    # Inspector source, deployed to the target in STAGE 4 and
    # again in STAGE 24.
    #
    # !unsafe keeps Jinja away from the script body.
    # --------------------------------------------------------

    tls_inspector_source: !unsafe |
      #!/usr/bin/env python3
      """
      PiQuickHeal TLS certificate inspector.

      Reads a newline-delimited list of candidate certificate file paths on stdin,
      inspects every certificate found in each file, and writes a single JSON
      document to stdout.

      One `openssl x509` invocation per certificate (not per attribute), so a
      150-certificate CA bundle costs 150 subprocesses instead of ~1200.
      """

      import calendar
      import json
      import os
      import re
      import subprocess
      import sys
      import time

      PEM_BLOCK = re.compile(
          rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----",
          re.DOTALL,
      )

      OPENSSL_ARGS = [
          "-noout",
          "-nameopt", "rfc2253",
          "-subject",
          "-issuer",
          "-serial",
          "-fingerprint", "-sha256",
          "-startdate",
          "-enddate",
          "-ext", "basicConstraints,subjectAltName",
      ]

      MONTHS = {
          "Jan": 1, "Feb": 2, "Mar": 3, "Apr": 4, "May": 5, "Jun": 6,
          "Jul": 7, "Aug": 8, "Sep": 9, "Oct": 10, "Nov": 11, "Dec": 12,
      }

      PROVIDER_PATTERNS = [
          ("LETS_ENCRYPT", ("let's encrypt", "lets encrypt")),
          ("DIGICERT", ("digicert",)),
          ("GODADDY", ("godaddy",)),
          ("SECTIGO_COMODO", ("sectigo", "comodo")),
          ("GLOBALSIGN", ("globalsign",)),
          ("ENTRUST", ("entrust",)),
          ("AMAZON_ACM", ("amazon", "aws")),
          ("GOOGLE_TRUST", ("google trust",)),
          ("ZEROSSL", ("zerossl",)),
      ]


      def run_openssl(payload, inform):
          """Return openssl -text-ish attribute output for one certificate."""
          cmd = ["openssl", "x509", "-inform", inform] + OPENSSL_ARGS
          try:
              proc = subprocess.run(
                  cmd,
                  input=payload,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  timeout=15,
              )
          except (OSError, subprocess.TimeoutExpired):
              return None
          if proc.returncode != 0:
              return None
          return proc.stdout.decode("utf-8", "replace")


      def parse_openssl_date(value):
          """Parse 'Feb  1 00:00:00 2020 GMT' without shelling out to date(1)."""
          if not value:
              return None
          parts = value.replace("GMT", "").split()
          if len(parts) < 4:
              return None
          try:
              month = MONTHS[parts[0][:3]]
              day = int(parts[1])
              clock = parts[2].split(":")
              year = int(parts[3])
              hour, minute, second = (int(clock[0]), int(clock[1]), int(clock[2]))
          except (KeyError, ValueError, IndexError):
              return None
          # X.509 notBefore/notAfter are UTC. timegm() converts a UTC struct
          # directly, so the result does not depend on the host time zone.
          try:
              return int(
                  calendar.timegm((year, month, day, hour, minute, second, 0, 1, -1))
              )
          except (OverflowError, ValueError):
              return None


      def parse_attributes(text):
          """Turn openssl attribute output into a flat dict."""
          out = {
              "subject": "",
              "issuer": "",
              "serial": "",
              "fingerprint": "",
              "not_before": "",
              "not_after": "",
              "san": "",
              "is_ca": False,
          }
          lines = text.splitlines()
          for index, line in enumerate(lines):
              stripped = line.strip()
              if line.startswith("subject="):
                  out["subject"] = line.split("=", 1)[1].strip()
              elif line.startswith("issuer="):
                  out["issuer"] = line.split("=", 1)[1].strip()
              elif line.startswith("serial="):
                  out["serial"] = line.split("=", 1)[1].strip()
              elif "Fingerprint=" in line:
                  out["fingerprint"] = line.split("=", 1)[1].strip()
              elif line.startswith("notBefore="):
                  out["not_before"] = line.split("=", 1)[1].strip()
              elif line.startswith("notAfter="):
                  out["not_after"] = line.split("=", 1)[1].strip()
              elif "Basic Constraints" in line:
                  window = " ".join(lines[index:index + 3]).upper()
                  if "CA:TRUE" in window:
                      out["is_ca"] = True
              elif stripped.startswith(("DNS:", "IP Address:", "email:", "URI:")):
                  existing = out["san"]
                  out["san"] = (existing + " " + stripped).strip() if existing else stripped
          return out


      def detect_provider(issuer, self_signed):
          lowered = issuer.lower()
          for name, needles in PROVIDER_PATTERNS:
              for needle in needles:
                  if needle in lowered:
                      return name
          if self_signed:
              return "SELF_SIGNED"
          return "UNKNOWN"


      def classify(days_remaining, critical_days, warning_days):
          if days_remaining is None:
              return "UNPARSEABLE"
          if days_remaining < 0:
              return "EXPIRED"
          if days_remaining <= critical_days:
              return "CRITICAL"
          if days_remaining <= warning_days:
              return "EXPIRING_SOON"
          return "HEALTHY"


      def read_blocks(path, max_certs):
          """Return (blocks, total_found) for one file, honouring max_certs."""
          try:
              with open(path, "rb") as handle:
                  raw = handle.read()
          except OSError:
              return [], 0

          blocks = PEM_BLOCK.findall(raw)
          if blocks:
              payloads = [(block + b"\n", "PEM") for block in blocks[:max_certs]]
              return payloads, len(blocks)
          if raw[:1] == b"\x30":
              return [(raw, "DER")], 1
          return [], 0


      def main():
          critical_days = int(os.environ.get("TLS_CRITICAL_DAYS", "7"))
          warning_days = int(os.environ.get("TLS_WARNING_DAYS", "30"))
          max_certs = int(os.environ.get("TLS_MAX_CERTS_PER_FILE", "50"))

          now = int(time.time())
          records = []
          skipped = []

          paths = [line.strip() for line in sys.stdin if line.strip()]

          for path in paths:
              if not os.path.isfile(path) or not os.access(path, os.R_OK):
                  skipped.append({"path": path, "reason": "UNREADABLE"})
                  continue

              blocks, total = read_blocks(path, max_certs)
              if not blocks:
                  skipped.append({"path": path, "reason": "NOT_A_CERTIFICATE"})
                  continue

              if total > len(blocks):
                  skipped.append(
                      {
                          "path": path,
                          "reason": "TRUNCATED",
                          "found": total,
                          "inspected": len(blocks),
                      }
                  )
              for index, (payload, inform) in enumerate(blocks, start=1):
                  text = run_openssl(payload, inform)
                  if text is None:
                      skipped.append(
                          {
                              "path": path,
                              "reason": "UNPARSEABLE",
                              "chain_index": index,
                          }
                      )
                      continue

                  attrs = parse_attributes(text)
                  end_epoch = parse_openssl_date(attrs["not_after"])

                  if end_epoch is None:
                      days_remaining = None
                  else:
                      days_remaining = (end_epoch - now) // 86400

                  self_signed = bool(
                      attrs["subject"] and attrs["subject"] == attrs["issuer"]
                  )

                  records.append(
                      {
                          "path": path,
                          "format": inform,
                          "chain_index": index,
                          "chain_total": total,
                          "subject": attrs["subject"],
                          "issuer": attrs["issuer"],
                          "serial": attrs["serial"],
                          "fingerprint": attrs["fingerprint"],
                          "not_before": attrs["not_before"],
                          "not_after": attrs["not_after"],
                          "days_remaining": days_remaining,
                          "status": classify(days_remaining, critical_days, warning_days),
                          "is_ca": attrs["is_ca"],
                          "self_signed": self_signed,
                          "provider": detect_provider(attrs["issuer"], self_signed),
                          "san": attrs["san"],
                          "is_bundle": total > 1,
                      }
                  )

          json.dump(
              {
                  "generated_at": now,
                  "candidate_count": len(paths),
                  "record_count": len(records),
                  "records": records,
                  "skipped": skipped,
              },
              sys.stdout,
          )
          sys.stdout.write("\n")


      if __name__ == "__main__":
          main()

    # --------------------------------------------------------
    # Self-signed regeneration helper, deployed in STAGE 21B.
    # --------------------------------------------------------

    tls_regen_source: !unsafe |
      #!/usr/bin/env python3
      """
      PiQuickHeal self-signed certificate regeneration.

      Reads a JSON document on stdin:

          {
            "days": 397,
            "dry_run": false,
            "allow_new_key": false,
            "targets": [{"path": "/etc/ssl/x.pem", "subject": "...", "san": "..."}]
          }

      and writes a JSON report to stdout.

      Scope is deliberately narrow. This regenerates SELF-SIGNED certificates only.
      It cannot and must not be used on CA-issued certificates: there is no issuer to
      sign a replacement, so producing one would silently swap a trusted certificate
      for an untrusted one.

      Safety properties:
        - The existing private key is reused, so anything referencing the key file
          keeps working. A new key is generated only when allow_new_key is set.
        - The key is confirmed to match the certificate before anything is written.
        - The original file is copied to <path>.piquickheal-<timestamp>.bak with
          mode, owner and group preserved.
        - The replacement is written to a temporary file in the same directory and
          moved into place, so a reading process never sees a partial file.
        - Refusal is the default: any target that cannot be handled confidently is
          reported as SKIPPED with a reason and left untouched.
      """

      import json
      import os
      import re
      import shutil
      import subprocess
      import sys
      import tempfile
      import time

      CERT_BLOCK = re.compile(
          r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----",
          re.DOTALL,
      )

      KEY_BLOCK = re.compile(
          r"-----BEGIN (?:RSA |EC |ENCRYPTED )?PRIVATE KEY-----"
          r".*?"
          r"-----END (?:RSA |EC |ENCRYPTED )?PRIVATE KEY-----",
          re.DOTALL,
      )

      SAN_ENTRY = re.compile(r"(DNS|IP Address|email|URI):([^,]+)")


      def openssl(args, stdin_data=None):
          """Run openssl and return (rc, stdout_text)."""
          try:
              proc = subprocess.run(
                  ["openssl"] + args,
                  input=stdin_data,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=60,
              )
          except (OSError, subprocess.TimeoutExpired) as exc:
              return 1, str(exc)
          return proc.returncode, proc.stdout.decode("utf-8", "replace")


      def read_text(path):
          try:
              with open(path, "r", errors="replace") as handle:
                  return handle.read()
          except OSError:
              return ""


      def cert_public_key(cert_pem):
          rc, out = openssl(["x509", "-noout", "-pubkey"], cert_pem.encode())
          return out.strip() if rc == 0 else None


      def key_public_key(key_path):
          rc, out = openssl(["pkey", "-in", key_path, "-pubout"])
          return out.strip() if rc == 0 else None


      def key_public_key_inline(key_pem):
          rc, out = openssl(["pkey", "-pubout"], key_pem.encode())
          return out.strip() if rc == 0 else None


      def candidate_key_paths(cert_path):
          """Conventional locations for the key belonging to a certificate."""
          directory = os.path.dirname(cert_path)
          base = os.path.basename(cert_path)
          stem = os.path.splitext(base)[0]

          names = [
              stem + ".key",
              stem + "-key.pem",
              stem + ".key.pem",
              stem + "_key.pem",
              stem + ".pem",
              base + ".key",
          ]

          paths = []
          for directory_option in (directory, "/etc/ssl/private", "/etc/pki/tls/private"):
              for name in names:
                  candidate = os.path.join(directory_option, name)
                  if candidate != cert_path and candidate not in paths:
                      paths.append(candidate)
          return paths


      def locate_key(cert_path, cert_pem):
          """
          Return (kind, value) where kind is one of:
            "inline" -> value is the key PEM found inside the certificate file
            "file"   -> value is a path to a matching key file
            None     -> nothing usable found
          """
          wanted = cert_public_key(cert_pem)
          if not wanted:
              return None, None

          raw = read_text(cert_path)
          inline = KEY_BLOCK.search(raw)
          if inline:
              key_pem = inline.group(0)
              if "ENCRYPTED" in key_pem:
                  return None, None
              if key_public_key_inline(key_pem) == wanted:
                  return "inline", key_pem

          for candidate in candidate_key_paths(cert_path):
              if not os.path.isfile(candidate):
                  continue
              if key_public_key(candidate) == wanted:
                  return "file", candidate

          return None, None


      def subject_compat(cert_pem):
          """Subject in /CN=x/O=y form, which is what `openssl req -subj` expects."""
          rc, out = openssl(
              ["x509", "-noout", "-nameopt", "compat", "-subject"], cert_pem.encode()
          )
          if rc != 0:
              return None
          line = out.strip()
          if line.startswith("subject="):
              line = line.split("=", 1)[1].strip()
          if not line.startswith("/"):
              return None
          return line


      def san_list(cert_pem):
          rc, out = openssl(
              ["x509", "-noout", "-ext", "subjectAltName"], cert_pem.encode()
          )
          if rc != 0:
              return []
          entries = []
          for kind, value in SAN_ENTRY.findall(out):
              value = value.strip()
              if not value:
                  continue
              prefix = "IP" if kind == "IP Address" else kind
              entry = prefix + ":" + value
              if entry not in entries:
                  entries.append(entry)
          return entries


      def backup(path, stamp):
          target = "%s.piquickheal-%s.bak" % (path, stamp)
          shutil.copy2(path, target)
          try:
              info = os.stat(path)
              os.chown(target, info.st_uid, info.st_gid)
          except (OSError, AttributeError):
              pass
          return target


      def write_preserving(path, content):
          """Atomic replace that keeps the original mode, owner and group."""
          directory = os.path.dirname(path) or "."
          try:
              info = os.stat(path)
              mode, uid, gid = info.st_mode & 0o7777, info.st_uid, info.st_gid
          except OSError:
              mode, uid, gid = 0o644, -1, -1

          handle, temp_path = tempfile.mkstemp(dir=directory, prefix=".piquickheal-")
          try:
              with os.fdopen(handle, "w") as stream:
                  stream.write(content)
              os.chmod(temp_path, mode)
              if uid != -1:
                  try:
                      os.chown(temp_path, uid, gid)
                  except OSError:
                      pass
              os.replace(temp_path, path)
          except Exception:
              try:
                  os.unlink(temp_path)
              except OSError:
                  pass
              raise


      def regenerate(cert_path, days, allow_new_key, dry_run, stamp):
          raw = read_text(cert_path)
          cert_match = CERT_BLOCK.search(raw)
          if not cert_match:
              return {"path": cert_path, "action": "SKIPPED", "reason": "NO_CERTIFICATE"}

          if len(CERT_BLOCK.findall(raw)) > 1:
              return {"path": cert_path, "action": "SKIPPED", "reason": "MULTI_CERT_FILE"}

          cert_pem = cert_match.group(0)

          rc, _ = openssl(["x509", "-noout", "-checkend", "0"], cert_pem.encode())
          already_valid = rc == 0

          subject = subject_compat(cert_pem)
          if not subject:
              return {"path": cert_path, "action": "SKIPPED", "reason": "NO_SUBJECT"}

          kind, key = locate_key(cert_path, cert_pem)

          generated_key = False
          if kind is None:
              if not allow_new_key:
                  return {
                      "path": cert_path,
                      "action": "SKIPPED",
                      "reason": "NO_MATCHING_PRIVATE_KEY",
                      "searched": candidate_key_paths(cert_path)[:6],
                  }
              generated_key = True

          sans = san_list(cert_pem)

          result = {
              "path": cert_path,
              "subject": subject,
              "san": sans,
              "key_source": "generated" if generated_key else kind,
              "key_path": key if kind == "file" else None,
              "already_valid": already_valid,
          }

          if dry_run:
              result["action"] = "WOULD_REGENERATE"
              return result

          workdir = tempfile.mkdtemp(prefix="piquickheal-regen-")
          try:
              key_path = os.path.join(workdir, "key.pem")
              if generated_key:
                  rc, _ = openssl(
                      ["genpkey", "-algorithm", "RSA", "-pkeyopt",
                       "rsa_keygen_bits:2048", "-out", key_path]
                  )
                  if rc != 0:
                      result["action"] = "FAILED"
                      result["reason"] = "KEY_GENERATION_FAILED"
                      return result
              elif kind == "inline":
                  with open(key_path, "w") as stream:
                      stream.write(key + "\n")
              else:
                  shutil.copyfile(key, key_path)

              new_cert = os.path.join(workdir, "cert.pem")
              args = [
                  "req", "-x509", "-new",
                  "-key", key_path,
                  "-out", new_cert,
                  "-days", str(days),
                  "-sha256",
                  "-subj", subject,
                  "-addext", "basicConstraints=critical,CA:FALSE",
              ]
              if sans:
                  args += ["-addext", "subjectAltName=" + ",".join(sans)]

              rc, out = openssl(args)
              if rc != 0 or not os.path.exists(new_cert):
                  result["action"] = "FAILED"
                  result["reason"] = "OPENSSL_REQ_FAILED"
                  result["detail"] = out[-400:]
                  return result

              replacement = read_text(new_cert).strip() + "\n"

              # Confirm the replacement is loadable and matches the key we used.
              if cert_public_key(replacement) != key_public_key(key_path):
                  result["action"] = "FAILED"
                  result["reason"] = "KEY_MISMATCH_AFTER_GENERATION"
                  return result

              result["backup"] = backup(cert_path, stamp)

              if kind == "inline":
                  body = raw.replace(cert_pem, replacement.strip())
              else:
                  body = replacement

              write_preserving(cert_path, body)

              if generated_key:
                  new_key_path = os.path.splitext(cert_path)[0] + ".piquickheal.key"
                  shutil.copyfile(key_path, new_key_path)
                  os.chmod(new_key_path, 0o600)
                  result["new_key_path"] = new_key_path

              rc, out = openssl(
                  ["x509", "-in", cert_path, "-noout", "-enddate"]
              )
              result["new_not_after"] = out.strip().split("=", 1)[-1] if rc == 0 else ""
              result["action"] = "REGENERATED"
              return result
          finally:
              shutil.rmtree(workdir, ignore_errors=True)


      def main():
          try:
              request = json.load(sys.stdin)
          except ValueError as exc:
              json.dump({"error": "BAD_INPUT", "detail": str(exc), "results": []}, sys.stdout)
              sys.stdout.write("\n")
              return

          days = int(request.get("days", 397))
          dry_run = bool(request.get("dry_run", False))
          allow_new_key = bool(request.get("allow_new_key", False))
          targets = request.get("targets") or []

          stamp = time.strftime("%Y%m%d%H%M%S", time.gmtime())
          results = []

          for target in targets:
              path = target.get("path") if isinstance(target, dict) else target
              if not path:
                  continue
              if not os.path.isfile(path):
                  results.append({"path": path, "action": "SKIPPED", "reason": "MISSING"})
                  continue
              try:
                  results.append(
                      regenerate(path, days, allow_new_key, dry_run, stamp)
                  )
              except Exception as exc:
                  results.append(
                      {
                          "path": path,
                          "action": "FAILED",
                          "reason": "EXCEPTION",
                          "detail": str(exc),
                      }
                  )

          json.dump(
              {
                  "stamp": stamp,
                  "dry_run": dry_run,
                  "target_count": len(targets),
                  "regenerated": len(
                      [r for r in results if r.get("action") == "REGENERATED"]
                  ),
                  "results": results,
              },
              sys.stdout,
          )
          sys.stdout.write("\n")


      if __name__ == "__main__":
          main()

    # --------------------------------------------------------
    # Certificate discovery paths
    #
    # These are roots, not individual certificate files.
    # --------------------------------------------------------

    tls_certificate_roots:

      - /etc/ssl
      - /etc/pki
      - /etc/letsencrypt
      - /etc/nginx
      - /etc/apache2
      - /etc/httpd
      - /etc/haproxy
      - /etc/traefik
      - /etc/envoy
      - /etc/postfix
      - /etc/dovecot
      - /etc/ssl/private
      - /opt
      - /usr/local/etc

    # --------------------------------------------------------
    # Files/directories which should not be scanned
    # --------------------------------------------------------

    tls_excluded_paths:

      - /proc
      - /sys
      - /dev
      - /run
      - /var/lib/docker
      - /var/lib/containers
      - /var/cache
      - /usr/share/doc

    # --------------------------------------------------------
    # Path fragments which are certificate trust stores rather
    # than serving certificates.
    #
    # These are large multi-certificate bundles. They are not
    # what a TLS listener presents to a client, and inspecting
    # them buries the real leaf certificates in noise.
    #
    # Applied only when tls_include_trust_stores is false.
    # --------------------------------------------------------

    tls_trust_store_patterns:

      - "/ca-trust/"
      - "/ca-certificates"
      - "ca-bundle"
      - "ca-certificates.crt"
      - "cacert.pem"
      - "/certifi/"
      - "/botocore/"
      - "/site-packages/"
      - "/dist-packages/"
      - "tls-ca-bundle.pem"
      - "email-ca-bundle.pem"
      - "objsign-ca-bundle.pem"

      # fwupd firmware-signing CAs. These verify firmware
      # metadata signatures, not TLS. They are long-lived
      # (2047 and 2060), they are present on every RHEL host,
      # and they inflate the CA count on every scan.
      - "/fwupd/"
      - "/fwupd-metadata/"

    # --------------------------------------------------------
    # Certificate extensions
    # --------------------------------------------------------

    tls_certificate_extensions:

      - "*.pem"
      - "*.crt"
      - "*.cer"
      - "*.der"

    # --------------------------------------------------------
    # Services which can safely be reloaded automatically
    # --------------------------------------------------------

    tls_reload_services:

      - nginx
      - apache2
      - httpd
      - haproxy
      - envoy
      - postfix
      - dovecot

    # --------------------------------------------------------
    # Whether remediation is allowed
    #
    # ##################################################
    # #  WARNING - REMEDIATION IS ENABLED BY DEFAULT   #
    # ##################################################
    #
    # This was flipped from false to true on request, so ANY
    # launch of this playbook may modify certificate files on
    # the target. There is no longer a safety default holding
    # it back, including for scheduled jobs.
    #
    # To make a single run read-only:
    #
    #   -e tls_allow_remediation=false
    #
    # or set it to false in the AWX job template variables.
    # --------------------------------------------------------

    tls_allow_remediation: true

    # --------------------------------------------------------
    # Kubernetes namespace used for cert-manager detection
    # --------------------------------------------------------

    tls_cert_manager_namespace: default


  # ==========================================================
  # STAGE 1 - INITIALIZATION
  # ==========================================================

  tasks:

    - name: STAGE 1 - Initialize diagnosis
      ansible.builtin.set_fact:
        tls_run_status: "STARTED"
        tls_diagnosis_status: "UNKNOWN"
        tls_remediation_status: "NOT_RUN"
        tls_validation_status: "NOT_RUN"

        tls_certificate_records: []
        tls_leaf_certificates: []
        tls_ca_certificates: []

        tls_renewal_mechanisms: []
        tls_detected_services: []
        tls_tls_endpoints: []

        tls_findings: []
        tls_recommendations: []

        tls_skipped_certificates: []
        tls_unparseable_certificates: []
        tls_candidate_ports: []

        tls_selfsigned_targets: []
        tls_selfsigned_results: []
        tls_regenerated_count: 0
        tls_changes_made: false

      tags:
        - always
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 2 - REQUIRED BINARIES
    # ========================================================

    # --------------------------------------------------------
    # `command -v` is a shell builtin, so it has to run under a
    # shell. ansible.builtin.command executes without a shell
    # and its behaviour here depends on whether the platform
    # happens to ship a /usr/bin/command, which is not portable.
    # --------------------------------------------------------

    - name: STAGE 2 - Check required binaries
      ansible.builtin.shell: |
        command -v "{{ item }}" >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: tls_binary_check
      changed_when: false
      failed_when: false
      loop:
        - openssl
        - find
        - ss
        - awk
        - sed
        - grep
        - date
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 2 - Build available binary list
      ansible.builtin.set_fact:
        tls_available_binaries: >-
          {{
            tls_binary_check.results
            | selectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 2 - Validate required binaries
      ansible.builtin.assert:
        that:
          - "'openssl' in tls_available_binaries"
          - "'find' in tls_available_binaries"
          - "'ss' in tls_available_binaries"
        fail_msg: >
          PiQuickHeal TLS diagnosis requires openssl, find and ss.
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 3 - CERTIFICATE FILE DISCOVERY
    # ========================================================

    - name: STAGE 3 - Discover certificate files
      ansible.builtin.shell: |
        set -o pipefail

        find \
        {% for root in tls_certificate_roots %}
          "{{ root }}" \
        {% endfor %}
          -type f \
          \( \
            -iname "*.pem" \
            -o -iname "*.crt" \
            -o -iname "*.cer" \
            -o -iname "*.der" \
          \) \
          2>/dev/null
      args:
        executable: /bin/bash
      register: tls_discovered_files
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 3 - Build raw certificate candidate list
      ansible.builtin.set_fact:
        tls_certificate_candidates_raw: >-
          {{
            tls_discovered_files.stdout_lines
            | default([])
            | unique
            | reject('search', '^/proc/')
            | reject('search', '^/sys/')
            | reject('search', '^/dev/')
            | reject('search', '^/run/')
            | reject('search', '/var/lib/docker/')
            | reject('search', '/var/lib/containers/')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # --------------------------------------------------------
    # Drop trust stores unless explicitly requested.
    #
    # Job 84 inspected 146-, 127- and 298-certificate bundles
    # from /etc/pki/ca-trust and from Datadog's vendored certifi
    # copies. None of those are serving certificates.
    # --------------------------------------------------------

    - name: STAGE 3 - Build certificate candidate list
      ansible.builtin.set_fact:
        tls_certificate_candidates: >-
          {{
            tls_certificate_candidates_raw
            if (tls_include_trust_stores | bool)
            else (
              tls_certificate_candidates_raw
              | reject('search', tls_trust_store_patterns | join('|'))
              | list
            )
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 3 - Report discovery scope
      ansible.builtin.debug:
        msg: >-
          Discovered {{ tls_certificate_candidates_raw | length }} candidate
          files, inspecting {{ tls_certificate_candidates | length }}
          (trust stores
          {{ 'included' if tls_include_trust_stores | bool else 'excluded' }}).
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 4 - CERTIFICATE INSPECTION
    #
    # The previous implementation ran a shell loop that spawned
    # roughly eight openssl processes per certificate, then
    # printed KEY=VALUE records that had to be re-parsed with
    # regular expressions on the controller.
    #
    # It now deploys one Python helper that emits JSON directly.
    # One openssl invocation per certificate, one parse, no
    # regular expressions on the controller side.
    # ========================================================

    - name: STAGE 4 - Deploy certificate inspector
      ansible.builtin.copy:
        dest: "{{ tls_inspector_path }}"
        mode: "0700"
        owner: root
        group: root
        content: "{{ tls_inspector_source }}"
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 4 - Inspect certificates
      ansible.builtin.command:
        # Executed via its own shebang rather than
        # "{{ ansible_python_interpreter }} <script>", because that
        # variable is frequently the literal string "auto" or
        # "auto_silent" in inventory and would not be a usable path.
        cmd: "{{ tls_inspector_path }}"
        stdin: "{{ tls_certificate_candidates | join('\n') }}"
      environment:
        TLS_CRITICAL_DAYS: "{{ tls_expiry_critical_days }}"
        TLS_WARNING_DAYS: "{{ tls_expiry_warning_days }}"
        TLS_MAX_CERTS_PER_FILE: "{{ tls_max_certs_per_file }}"
      register: tls_certificate_inspection
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 4 - Remove certificate inspector
      ansible.builtin.file:
        path: "{{ tls_inspector_path }}"
        state: absent
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 5 - BUILD CERTIFICATE RECORDS
    #
    # This replaces the looped set_fact that failed in job 84.
    #
    # Two separate defects were fixed here:
    #
    #   1. regex_search(..., '\\1') inside a YAML folded block
    #      scalar reaches the filter as a two-character
    #      backslash sequence. The filter takes its
    #      "starts with a backslash" branch and then its own
    #      internal re.match() returns None, which is the
    #      AttributeError seen on every one of the 180 items.
    #
    #   2. regex_search returns only the FIRST match, so one
    #      record was built per FILE rather than per
    #      CERTIFICATE. Every bundle lost all but its first
    #      certificate.
    #
    # A single from_json parse avoids both, and avoids
    # re-templating a growing list once per loop iteration.
    # ========================================================

    - name: STAGE 5 - Parse inspector output
      ansible.builtin.set_fact:
        tls_inspection_result: >-
          {{
            tls_certificate_inspection.stdout
            | default('')
            | trim
            | from_json
            if (
              (tls_certificate_inspection.rc | default(1)) == 0
              and (tls_certificate_inspection.stdout | default('') | trim | length) > 0
            )
            else {
              'generated_at': 0,
              'candidate_count': 0,
              'record_count': 0,
              'records': [],
              'skipped': []
            }
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 5 - Build certificate records
      ansible.builtin.set_fact:
        tls_certificate_records: "{{ tls_inspection_result.records | default([]) }}"
        tls_skipped_certificates: "{{ tls_inspection_result.skipped | default([]) }}"
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 5 - Assert inspection produced records
      ansible.builtin.assert:
        that:
          - tls_certificate_records | length > 0
        fail_msg: >-
          Certificate inspection returned no records.
          Candidates: {{ tls_certificate_candidates | length }}.
          Inspector rc: {{ tls_certificate_inspection.rc | default('unset') }}.
          Inspector stderr: {{ tls_certificate_inspection.stderr | default('') }}
        success_msg: >-
          Parsed {{ tls_certificate_records | length }} certificate records
          from {{ tls_certificate_candidates | length }} files
          ({{ tls_skipped_certificates | length }} skipped).
      when: tls_certificate_candidates | length > 0
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 6 - CLASSIFY CERTIFICATES
    # ========================================================

    - name: STAGE 6 - Identify leaf certificates
      ansible.builtin.set_fact:
        tls_leaf_certificates: >-
          {{
            tls_certificate_records
            | rejectattr('is_ca')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 6 - Identify CA certificates
      ansible.builtin.set_fact:
        tls_ca_certificates: >-
          {{
            tls_certificate_records
            | selectattr('is_ca')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 7 - DETECT CERTBOT
    # ========================================================

    - name: STAGE 7 - Detect Certbot
      ansible.builtin.shell: |
        if command -v certbot >/dev/null 2>&1; then
          certbot --version 2>&1
          exit 0
        fi

        exit 1
      args:
        executable: /bin/bash
      register: tls_certbot_detection
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 7 - Get Certbot certificates
      ansible.builtin.command:
        cmd: certbot certificates
      register: tls_certbot_inventory
      changed_when: false
      failed_when: false
      when: tls_certbot_detection.rc == 0
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 8 - DETECT CERT-MANAGER
    # ========================================================

    - name: STAGE 8 - Detect cert-manager binary
      ansible.builtin.command:
        cmd: kubectl get crd certificates.cert-manager.io
      register: tls_cert_manager_detection
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 8 - Detect cert-manager certificates
      ansible.builtin.command:
        cmd: >
          kubectl get certificates
          --all-namespaces
          -o wide
      register: tls_cert_manager_inventory
      changed_when: false
      failed_when: false
      when: tls_cert_manager_detection.rc == 0
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 9 - DETECT SYSTEMD RENEWAL
    # ========================================================

    - name: STAGE 9 - Discover systemd renewal units
      ansible.builtin.shell: |
        systemctl list-unit-files --type=timer --no-legend 2>/dev/null |
        awk '{print $1}' |
        grep -Ei 'cert|ssl|acme|renew' || true
      args:
        executable: /bin/bash
      register: tls_systemd_timers
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 9 - Discover systemd renewal services
      ansible.builtin.shell: |
        systemctl list-unit-files --type=service --no-legend 2>/dev/null |
        awk '{print $1}' |
        grep -Ei 'cert|ssl|acme|renew' || true
      args:
        executable: /bin/bash
      register: tls_systemd_services
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 10 - DETECT EXTERNAL RENEWAL SCRIPTS
    # ========================================================

    - name: STAGE 10 - Search for certificate renewal scripts
      ansible.builtin.shell: |
        set -o pipefail

        find \
          /etc \
          /opt \
          /usr/local/bin \
          /usr/local/sbin \
          -type f \
          \( \
            -iname "*cert*renew*" \
            -o -iname "*ssl*renew*" \
            -o -iname "*acme*" \
          \) \
          2>/dev/null |
        head -100
      args:
        executable: /bin/bash
      register: tls_renewal_scripts
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 11 - DETERMINE RENEWAL MECHANISM
    # ========================================================

    - name: STAGE 11 - Determine renewal mechanisms
      ansible.builtin.set_fact:
        tls_renewal_mechanisms: >-
          {{
            []
            +
            (
              ['CERTBOT']
              if tls_certbot_detection.rc == 0
              else []
            )
            +
            (
              ['CERT_MANAGER']
              if tls_cert_manager_detection.rc == 0
              else []
            )
            +
            (
              ['SYSTEMD']
              if
              (
                (tls_systemd_timers.stdout_lines | default([]) | length > 0)
                or
                (tls_systemd_services.stdout_lines | default([]) | length > 0)
              )
              else []
            )
            +
            (
              ['EXTERNAL_OR_CUSTOM']
              if (tls_renewal_scripts.stdout_lines | default([]) | length > 0)
              else []
            )
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 11 - Set primary renewal mechanism
      ansible.builtin.set_fact:
        tls_primary_renewal_mechanism: >-
          {{
            (
              tls_renewal_mechanisms | first
            )
            | default('MANUAL_OR_UNKNOWN')
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 12 - DISCOVER TLS LISTENERS
    # ========================================================

    # --------------------------------------------------------
    # The port is extracted in the shell, not with a Jinja
    # regex.
    #
    # `ss -lntH` prints
    #   State Recv-Q Send-Q Local:Port Peer:Port [Process]
    #
    # so the port is inside field 4, never at the end of the
    # line. The previous end-of-line regex could never match,
    # which is the second reason tls_candidate_ports was always
    # empty and STAGE 14 never probed anything.
    # --------------------------------------------------------

    - name: STAGE 12 - Discover listening TCP ports
      ansible.builtin.shell: |
        set -o pipefail

        ss -lntH 2>/dev/null |
        awk '{print $4}' |
        sed 's/.*://' |
        grep -E '^[0-9]+$' |
        sort -un || true
      args:
        executable: /bin/bash
      register: tls_listeners
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 12 - Build candidate TLS ports
      ansible.builtin.set_fact:
        tls_candidate_ports: >-
          {{
            tls_listeners.stdout_lines
            | default([])
            | map('trim')
            | reject('equalto', '')
            | map('int')
            | select('in',
              [
                443, 8443, 9443, 10443,
                4443, 6443, 7443,
                25, 465, 587,
                110, 995,
                143, 993,
                389, 636,
                5222
              ])
            | list
            | unique
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 13 - DISCOVER WEB SERVER NAMES
    # ========================================================

    - name: STAGE 13 - Discover nginx server names
      ansible.builtin.shell: |
        if command -v nginx >/dev/null 2>&1; then
          nginx -T 2>/dev/null |
          awk '
            $1 == "server_name" {
              for (i=2; i<=NF; i++) {
                gsub(";", "", $i)
                if ($i != "_" && $i !~ /^#/ && $i !~ /:/) {
                  print $i
                }
              }
            }
          '
        fi
      args:
        executable: /bin/bash
      register: tls_nginx_names
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 13 - Discover Apache ServerName
      ansible.builtin.shell: |
        if command -v apachectl >/dev/null 2>&1; then
          apachectl -S 2>/dev/null |
          grep -E "namevhost|alias" |
          awk '{print $4}' |
          sed 's/:.*//' |
          grep -E '^[A-Za-z0-9._-]+\.[A-Za-z]{2,}$' || true

        elif command -v httpd >/dev/null 2>&1; then
          httpd -S 2>/dev/null |
          grep -E "namevhost|alias" |
          awk '{print $4}' |
          sed 's/:.*//' |
          grep -E '^[A-Za-z0-9._-]+\.[A-Za-z]{2,}$' || true
        fi
      args:
        executable: /bin/bash
      register: tls_apache_names
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 13 - Build safe hostname list
      ansible.builtin.set_fact:
        tls_hostnames: >-
          {{
            (
              ['localhost']
              +
              (tls_nginx_names.stdout_lines | default([]))
              +
              (tls_apache_names.stdout_lines | default([]))
            )
            | map('trim')
            | reject('equalto', '')
            | reject('search', ':')
            | reject('search', '/')
            | unique
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 14 - TLS ENDPOINT PROBING
    #
    # We only probe well-known TLS ports.
    # We do NOT assume every listening TCP socket is TLS.
    # ========================================================

    - name: STAGE 14 - Probe TLS endpoints
      ansible.builtin.shell: |
        set -o pipefail

        HOST="{{ item.0 }}"
        PORT="{{ item.1 }}"

        timeout "{{ tls_probe_timeout }}" \
          openssl s_client \
          -connect "${HOST}:${PORT}" \
          -servername "${HOST}" \
          </dev/null 2>/dev/null |
        openssl x509 \
          -noout \
          -subject \
          -issuer \
          -serial \
          -fingerprint \
          -startdate \
          -enddate \
          2>/dev/null
      args:
        executable: /bin/bash

      register: tls_endpoint_probes

      changed_when: false
      failed_when: false

      loop: >-
        {{
          tls_hostnames
          | product(tls_candidate_ports)
          | list
        }}

      loop_control:
        label: "{{ item.0 }}:{{ item.1 }}"

      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 15 - BUILD DIAGNOSIS
    # ========================================================

    - name: STAGE 15 - Find expired certificates
      ansible.builtin.set_fact:
        tls_expired_certificates: >-
          {{
            tls_leaf_certificates
            | selectattr('status', 'equalto', 'EXPIRED')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 15 - Find critical certificates
      ansible.builtin.set_fact:
        tls_critical_certificates: >-
          {{
            tls_leaf_certificates
            | selectattr('status', 'equalto', 'CRITICAL')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 15 - Find certificates expiring soon
      ansible.builtin.set_fact:
        tls_expiring_certificates: >-
          {{
            tls_leaf_certificates
            | selectattr('status', 'equalto', 'EXPIRING_SOON')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # --------------------------------------------------------
    # Certificates whose notAfter could not be read.
    #
    # In job 84 these were silently reported as CRITICAL,
    # because `date -d ""` resolves to today at midnight and
    # integer division then produced days_remaining=0. They are
    # now reported separately and excluded from the verdict.
    # --------------------------------------------------------

    - name: STAGE 15 - Find unparseable certificates
      ansible.builtin.set_fact:
        tls_unparseable_certificates: >-
          {{
            tls_certificate_records
            | selectattr('status', 'equalto', 'UNPARSEABLE')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 16 - GENERATE FINDINGS
    # ========================================================

    - name: STAGE 16 - Generate certificate findings
      ansible.builtin.set_fact:
        tls_findings:
          - >-
            Discovered {{
              tls_certificate_records | length
            }} certificate records across {{
              tls_certificate_candidates | length
            }} candidate files.

          - >-
            Leaf certificates:
            {{ tls_leaf_certificates | length }}

          - >-
            CA/intermediate certificates:
            {{ tls_ca_certificates | length }}

          - >-
            Expired leaf certificates:
            {{ tls_expired_certificates | length }}

          - >-
            Critical certificates:
            {{ tls_critical_certificates | length }}

          - >-
            Certificates expiring within
            {{ tls_expiry_warning_days }} days:
            {{ tls_expiring_certificates | length }}

          - >-
            Unparseable certificates:
            {{ tls_unparseable_certificates | length }}

          - >-
            Files skipped during inspection:
            {{ tls_skipped_certificates | default([]) | length }}

          - >-
            Detected TLS ports:
            {{ tls_candidate_ports | default([]) | join(', ') | default('none', true) }}

          - >-
            Detected renewal mechanism:
            {{ tls_primary_renewal_mechanism }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 17 - GENERATE RECOMMENDATIONS
    # ========================================================

    - name: STAGE 17 - Generate recommendations
      ansible.builtin.set_fact:
        tls_recommendations:
          - >-
            Do not renew root/intermediate CA certificates using
            leaf certificate renewal workflows.

          - >-
            Use the detected renewal mechanism for leaf certificates.

          - >-
            Certificates managed by external/custom PKI should be
            renewed through the organization's approved PKI workflow.

          - >-
            Unknown renewal mechanisms require manual investigation
            before automated remediation.
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 18 - REMEDIATION DECISION
    # ========================================================

    - name: STAGE 18 - Determine whether remediation is required
      ansible.builtin.set_fact:
        tls_remediation_required: >-
          {{
            (
              tls_expired_certificates | length > 0
            )
            or
            (
              tls_critical_certificates | length > 0
            )
          }}
      tags:
        - remediate


    # ========================================================
    # STAGE 19 - CERTBOT REMEDIATION
    # ========================================================

    - name: STAGE 19 - Renew certificates using Certbot
      ansible.builtin.command:
        cmd: certbot renew --non-interactive
      register: tls_certbot_renewal
      changed_when: >-
        'No renewals were attempted' not in
        tls_certbot_renewal.stdout
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "CERTBOT"
      tags:
        - remediate


    # ========================================================
    # STAGE 20 - CERT-MANAGER REMEDIATION
    # ========================================================

    - name: STAGE 20 - Trigger cert-manager reconciliation
      ansible.builtin.shell: |
        set -o pipefail

        kubectl get certificates \
          --all-namespaces \
          -o json 2>/dev/null |
        python3 -c '
        import json
        import sys

        try:
            data = json.load(sys.stdin)
        except Exception:
            sys.exit(1)

        for item in data.get("items", []):
            metadata = item.get("metadata", {})
            namespace = metadata.get("namespace")
            name = metadata.get("name")

            if namespace and name:
                print(f"{namespace} {name}")
        '
      args:
        executable: /bin/bash
      register: tls_cert_manager_certificates
      changed_when: false
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "CERT_MANAGER"
      tags:
        - remediate


    - name: STAGE 20 - Request cert-manager renewal
      ansible.builtin.shell: |
        set -o pipefail

        while read -r NAMESPACE NAME; do

          [ -z "$NAMESPACE" ] && continue
          [ -z "$NAME" ] && continue

          kubectl annotate certificate \
            "$NAME" \
            -n "$NAMESPACE" \
            piquickheal.io/renew-request="$(date +%s)" \
            --overwrite

        done <<< "{{ tls_cert_manager_certificates.stdout | default('') }}"
      args:
        executable: /bin/bash
      register: tls_cert_manager_renewal
      changed_when: true
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "CERT_MANAGER"
      tags:
        - remediate


    # ========================================================
    # STAGE 21 - SYSTEMD REMEDIATION
    # ========================================================

    # --------------------------------------------------------
    # Starting a .timer only arms the schedule, it does not run
    # the job, so the previous task could never trigger a
    # renewal. The matching .service is what performs the work.
    # --------------------------------------------------------

    - name: STAGE 21 - Ensure renewal timers are enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: "{{ tls_systemd_timers.stdout_lines | default([]) }}"
      register: tls_systemd_timer_start
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "SYSTEMD"
      tags:
        - remediate


    - name: STAGE 21 - Trigger detected renewal services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ tls_systemd_services.stdout_lines | default([]) }}"
      register: tls_systemd_service_run
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "SYSTEMD"
      tags:
        - remediate


    # ========================================================
    # STAGE 21B - SELF-SIGNED REGENERATION
    #
    # For certificates no external mechanism can renew.
    #
    # Targets must satisfy ALL of:
    #   - leaf (not a CA certificate)
    #   - self-signed
    #   - provider detected as SELF_SIGNED
    #   - status EXPIRED or CRITICAL
    #
    # The existing private key is reused and the original file
    # is backed up. Anything that cannot be handled with
    # confidence is skipped with a reason rather than guessed at.
    # ========================================================

    - name: STAGE 21B - Select self-signed regeneration targets
      ansible.builtin.set_fact:
        tls_selfsigned_targets: >-
          {{
            tls_certificate_records
            | rejectattr('is_ca')
            | selectattr('self_signed')
            | selectattr('provider', 'equalto', 'SELF_SIGNED')
            | selectattr('status', 'in', ['EXPIRED', 'CRITICAL'])
            | map(attribute='path')
            | unique
            | list
          }}
      tags:
        - remediate


    - name: STAGE 21B - Report regeneration scope
      ansible.builtin.debug:
        msg: >-
          {{ tls_selfsigned_targets | length }} self-signed certificate(s)
          eligible for regeneration
          {{
            '(regeneration disabled)'
            if not (tls_allow_selfsigned_regeneration | bool)
            else '(dry run)'
            if (tls_selfsigned_dry_run | bool)
            else '(will be rewritten)'
          }}.
      tags:
        - remediate


    - name: STAGE 21B - Deploy regeneration helper
      ansible.builtin.copy:
        dest: "{{ tls_regen_path }}"
        mode: "0700"
        owner: root
        group: root
        content: "{{ tls_regen_source }}"
      when:
        - tls_allow_remediation | bool
        - tls_allow_selfsigned_regeneration | bool
        - tls_selfsigned_targets | length > 0
      tags:
        - remediate


    - name: STAGE 21B - Regenerate self-signed certificates
      ansible.builtin.command:
        cmd: "{{ tls_regen_path }}"
        stdin: >-
          {{
            {
              'days': tls_selfsigned_validity_days | int,
              'dry_run': tls_selfsigned_dry_run | bool,
              'allow_new_key': tls_selfsigned_allow_new_key | bool,
              'targets': tls_selfsigned_targets
            }
            | to_json
          }}
      register: tls_selfsigned_run
      changed_when: false
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_allow_selfsigned_regeneration | bool
        - tls_selfsigned_targets | length > 0
      tags:
        - remediate


    - name: STAGE 21B - Remove regeneration helper
      ansible.builtin.file:
        path: "{{ tls_regen_path }}"
        state: absent
      failed_when: false
      tags:
        - remediate


    - name: STAGE 21B - Parse regeneration results
      ansible.builtin.set_fact:
        tls_selfsigned_results: >-
          {{
            (
              tls_selfsigned_run.stdout | default('') | trim | from_json
            ).results
            | default([])
            if (
              (tls_selfsigned_run.rc | default(1)) == 0
              and (tls_selfsigned_run.stdout | default('') | trim | length) > 0
            )
            else []
          }}
      tags:
        - remediate


    - name: STAGE 21B - Count regenerated certificates
      ansible.builtin.set_fact:
        tls_regenerated_count: >-
          {{
            tls_selfsigned_results
            | selectattr('action', 'equalto', 'REGENERATED')
            | list
            | length
          }}
        tls_changes_made: >-
          {{
            (
              tls_selfsigned_results
              | selectattr('action', 'equalto', 'REGENERATED')
              | list
              | length
            ) > 0
          }}
      tags:
        - remediate


    - name: STAGE 21B - Report regeneration outcome
      ansible.builtin.debug:
        msg: "{{ tls_selfsigned_results }}"
      when: tls_selfsigned_results | length > 0
      tags:
        - remediate


    # ========================================================
    # STAGE 22 - EXTERNAL / UNKNOWN PROVIDER
    #
    # IMPORTANT:
    # Do NOT execute arbitrary scripts automatically.
    # ========================================================

    - name: STAGE 22 - Report external/custom renewal
      ansible.builtin.debug:
        msg:
          - "Automatic renewal was not executed."
          - "Detected mechanism: {{ tls_primary_renewal_mechanism }}"
          - "Detected scripts:"
          - "{{ tls_renewal_scripts.stdout_lines | default([]) }}"
          - "External PKI/provider requires an approved renewal handler."
      when:
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism in
          [
            "EXTERNAL_OR_CUSTOM",
            "MANUAL_OR_UNKNOWN"
          ]
      tags:
        - remediate


    # ========================================================
    # STAGE 23 - SERVICE RELOAD
    #
    # Only reload services which actually exist.
    # ========================================================

    - name: STAGE 23 - Check known TLS services
      ansible.builtin.command:
        cmd: "systemctl is-active {{ item }}"
      register: tls_service_status
      changed_when: false
      failed_when: false
      loop: "{{ tls_reload_services }}"
      tags:
        - remediate


    - name: STAGE 23 - Reload active TLS services
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        state: reloaded
      loop: "{{ tls_service_status.results }}"
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - item.rc == 0
        - item.stdout == "active"
        - item.item in tls_reload_services
      failed_when: false
      tags:
        - remediate


    # ========================================================
    # STAGE 24 - RE-INSPECT CERTIFICATES
    #
    # Re-runs the same inspector used in STAGE 4 so that the
    # before/after comparison uses identical parsing.
    #
    # The previous shell implementation had two of the defects
    # that were fixed in STAGE 4: it read only the first
    # certificate in each file, and it fed a possibly empty
    # notAfter to `date -d`, which resolves to today at
    # midnight rather than failing.
    # ========================================================

    - name: STAGE 24 - Redeploy certificate inspector
      ansible.builtin.copy:
        dest: "{{ tls_inspector_path }}"
        mode: "0700"
        owner: root
        group: root
        content: "{{ tls_inspector_source }}"
      when: tls_allow_remediation | bool
      tags:
        - validate
        - remediate


    - name: STAGE 24 - Re-inspect certificates
      ansible.builtin.command:
        cmd: "{{ tls_inspector_path }}"
        stdin: "{{ tls_certificate_candidates | join('\n') }}"
      environment:
        TLS_CRITICAL_DAYS: "{{ tls_expiry_critical_days }}"
        TLS_WARNING_DAYS: "{{ tls_expiry_warning_days }}"
        TLS_MAX_CERTS_PER_FILE: "{{ tls_max_certs_per_file }}"
      register: tls_post_remediation_check
      changed_when: false
      failed_when: false
      when: tls_allow_remediation | bool
      tags:
        - validate
        - remediate


    - name: STAGE 24 - Remove certificate inspector
      ansible.builtin.file:
        path: "{{ tls_inspector_path }}"
        state: absent
      failed_when: false
      tags:
        - validate
        - remediate


    - name: STAGE 24 - Parse post-remediation state
      ansible.builtin.set_fact:
        tls_post_remediation_records: >-
          {{
            (
              tls_post_remediation_check.stdout
              | default('')
              | trim
              | from_json
            ).records
            | default([])
            if (
              (tls_post_remediation_check.rc | default(1)) == 0
              and (
                tls_post_remediation_check.stdout
                | default('') | trim | length
              ) > 0
            )
            else []
          }}
      tags:
        - validate
        - remediate


    # ========================================================
    # STAGE 25 - VALIDATION
    #
    # Validation now answers "are there still unhealthy leaf
    # certificates?" rather than "did the recheck command
    # exit 0?".
    #
    # The old check compared the exit status of a shell loop
    # that could not fail, so it reported PASSED on every run
    # including runs where remediation never executed and the
    # expired certificate was untouched.
    # ========================================================

    - name: STAGE 25 - Find remaining unhealthy certificates
      ansible.builtin.set_fact:
        tls_remaining_unhealthy: >-
          {{
            tls_post_remediation_records
            | rejectattr('is_ca')
            | selectattr('status', 'in', ['EXPIRED', 'CRITICAL'])
            | list
          }}
      tags:
        - validate
        - remediate


    - name: STAGE 25 - Determine validation status
      ansible.builtin.set_fact:
        tls_validation_status: >-
          {{
            'NOT_RUN'
            if not (tls_allow_remediation | bool)
            else
            'NOT_REQUIRED'
            if not (tls_remediation_required | default(false) | bool)
            else
            'PASSED'
            if (tls_remaining_unhealthy | length) == 0
            else
            'FAILED'
          }}
      tags:
        - validate
        - remediate


    # ========================================================
    # STAGE 26 - DETERMINE FINAL STATUS
    # ========================================================

    - name: STAGE 26 - Determine final diagnosis status
      ansible.builtin.set_fact:
        tls_diagnosis_status: >-
          {{
            'CRITICAL'
            if tls_expired_certificates | length > 0
            else
            'WARNING'
            if tls_critical_certificates | length > 0
            else
            'HEALTHY'
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 26 - Determine remediation status
      ansible.builtin.set_fact:
        tls_remediation_status: >-
          {{
            'REMEDIATION_DISABLED'
            if not (tls_allow_remediation | bool)
            else
            'REMEDIATION_ATTEMPTED'
            if tls_remediation_required | bool
            else
            'NO_REMEDIATION_REQUIRED'
          }}
      tags:
        - remediate


    # ========================================================
    # STAGE 27 - WRITE LOG
    # ========================================================

    - name: STAGE 27 - Create PiQuickHeal log directory
      ansible.builtin.file:
        path: "{{ tls_log_file | dirname }}"
        state: directory
        mode: "0755"
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 27 - Write diagnosis log
      ansible.builtin.copy:
        dest: "{{ tls_log_file }}"
        mode: "0644"
        content: |
          ============================================================
          PiQuickHeal TLS Certificate Health
          ============================================================

          Host:
          {{ inventory_hostname }}

          Date:
          {{ ansible_date_time.iso8601 }}

          Diagnosis:
          {{ tls_diagnosis_status }}

          Remediation:
          {{ tls_remediation_status }}

          Validation:
          {{ tls_validation_status }}

          Renewal Mechanism:
          {{ tls_primary_renewal_mechanism }}

          Certificate Files:
          {{ tls_certificate_candidates | to_nice_json }}

          Certificate Records:
          {{ tls_certificate_records | to_nice_json }}

          Skipped:
          {{ tls_skipped_certificates | default([]) | to_nice_json }}

          Self-Signed Regeneration:
          {{ tls_selfsigned_results | default([]) | to_nice_json }}

          Findings:
          {{ tls_findings | to_nice_json }}

          Recommendations:
          {{ tls_recommendations | to_nice_json }}

          ============================================================
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 28 - AWX / PIQUICKHEAL OUTPUT
    # ========================================================

    - name: STAGE 28 - Publish PiQuickHeal results
      ansible.builtin.set_stats:
        data:

          piquickheal_issue_type: "tls_certificate"

          piquickheal_status: "{{ tls_diagnosis_status }}"

          piquickheal_remediation_status: >-
            {{ tls_remediation_status }}

          piquickheal_validation_status: >-
            {{ tls_validation_status }}

          piquickheal_renewal_mechanism: >-
            {{ tls_primary_renewal_mechanism }}

          piquickheal_certificate_count: >-
            {{ tls_certificate_records | length }}

          piquickheal_leaf_certificate_count: >-
            {{ tls_leaf_certificates | length }}

          piquickheal_ca_certificate_count: >-
            {{ tls_ca_certificates | length }}

          piquickheal_expired_count: >-
            {{ tls_expired_certificates | length }}

          piquickheal_critical_count: >-
            {{ tls_critical_certificates | length }}

          piquickheal_expiring_soon_count: >-
            {{ tls_expiring_certificates | length }}

          piquickheal_unparseable_count: >-
            {{ tls_unparseable_certificates | length }}

          piquickheal_skipped_count: >-
            {{ tls_skipped_certificates | default([]) | length }}

          piquickheal_candidate_file_count: >-
            {{ tls_certificate_candidates | length }}

          piquickheal_regenerated_count: >-
            {{ tls_regenerated_count | default(0) }}

          piquickheal_selfsigned_results: >-
            {{ tls_selfsigned_results | default([]) }}

          piquickheal_findings: >-
            {{ tls_findings }}

          piquickheal_recommendations: >-
            {{ tls_recommendations }}

          piquickheal_certificate_records: >-
            {{ tls_certificate_records }}

      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 29 - FINAL SUMMARY
    # ========================================================

    - name: STAGE 29 - Display final summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PiQuickHeal TLS Certificate Health"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Diagnosis: {{ tls_diagnosis_status }}"
          - "Remediation: {{ tls_remediation_status }}"
          - "Validation: {{ tls_validation_status }}"
          - "Renewal mechanism: {{ tls_primary_renewal_mechanism }}"
          - "Certificate files: {{ tls_certificate_candidates | length }}"
          - "Leaf certificates: {{ tls_leaf_certificates | length }}"
          - "CA certificates: {{ tls_ca_certificates | length }}"
          - "Expired: {{ tls_expired_certificates | length }}"
          - "Critical: {{ tls_critical_certificates | length }}"
          - "Expiring soon: {{ tls_expiring_certificates | length }}"
          - "Unparseable: {{ tls_unparseable_certificates | length }}"
          - "Skipped files: {{ tls_skipped_certificates | default([]) | length }}"
          - "Self-signed regenerated: {{ tls_regenerated_count | default(0) }}"
          - "============================================================"
      tags:
        - diagnose
        - remediate
        - validate
