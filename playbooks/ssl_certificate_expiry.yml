---
# ============================================================
# PiQuickHeal - Dynamic TLS / SSL Certificate Health
#
# Supported execution:
#
#   Diagnose:
#     ansible-playbook tls_certificate_health.yml \
#       -i inventory \
#       --tags diagnose
#
#   Remediate:
#     ansible-playbook tls_certificate_health.yml \
#       -i inventory \
#       --tags remediate
#
#   Validate:
#     ansible-playbook tls_certificate_health.yml \
#       -i inventory \
#       --tags validate
#
#   Complete:
#     ansible-playbook tls_certificate_health.yml \
#       -i inventory
#
# Design:
#   1. Discover certificates dynamically
#   2. Parse certificate metadata
#   3. Classify leaf/intermediate/root
#   4. Detect certificate provider
#   5. Detect renewal mechanism
#   6. Discover TLS listeners
#   7. Diagnose certificate health
#   8. Remediate only supported/safe mechanisms
#   9. Reload relevant service
#  10. Validate result
#
# IMPORTANT:
#   External/unknown certificate providers are detected but
#   are NOT executed blindly.
# ============================================================

- name: PiQuickHeal - Dynamic TLS SSL Certificate Health
  hosts: all
  become: true
  gather_facts: true

  vars:

    # --------------------------------------------------------
    # General settings
    # --------------------------------------------------------

    tls_log_file: "/var/log/piquickheal/tls_certificate_rotation.log"

    tls_expiry_critical_days: 7
    tls_expiry_warning_days: 30

    tls_probe_timeout: 5

    # --------------------------------------------------------
    # Certificate discovery paths
    #
    # These are roots, not individual certificate files.
    # --------------------------------------------------------

    tls_certificate_roots:

      - /etc/ssl
      - /etc/pki
      - /etc/letsencrypt
      - /etc/nginx
      - /etc/apache2
      - /etc/httpd
      - /etc/haproxy
      - /etc/traefik
      - /etc/envoy
      - /etc/postfix
      - /etc/dovecot
      - /etc/ssl/private
      - /opt
      - /usr/local/etc

    # --------------------------------------------------------
    # Files/directories which should not be scanned
    # --------------------------------------------------------

    tls_excluded_paths:

      - /proc
      - /sys
      - /dev
      - /run
      - /var/lib/docker
      - /var/lib/containers
      - /var/cache
      - /usr/share/doc

    # --------------------------------------------------------
    # Certificate extensions
    # --------------------------------------------------------

    tls_certificate_extensions:

      - "*.pem"
      - "*.crt"
      - "*.cer"
      - "*.der"

    # --------------------------------------------------------
    # Services which can safely be reloaded automatically
    # --------------------------------------------------------

    tls_reload_services:

      - nginx
      - apache2
      - httpd
      - haproxy
      - envoy
      - postfix
      - dovecot

    # --------------------------------------------------------
    # Whether remediation is allowed
    #
    # Default false for safety.
    #
    # Set:
    #
    #   -e tls_allow_remediation=true
    #
    # to enable remediation.
    # --------------------------------------------------------

    tls_allow_remediation: false

    # --------------------------------------------------------
    # Kubernetes namespace used for cert-manager detection
    # --------------------------------------------------------

    tls_cert_manager_namespace: default


  # ==========================================================
  # STAGE 1 - INITIALIZATION
  # ==========================================================

  tasks:

    - name: STAGE 1 - Initialize diagnosis
      ansible.builtin.set_fact:
        tls_run_status: "STARTED"
        tls_diagnosis_status: "UNKNOWN"
        tls_remediation_status: "NOT_RUN"
        tls_validation_status: "NOT_RUN"

        tls_certificate_records: []
        tls_leaf_certificates: []
        tls_ca_certificates: []

        tls_renewal_mechanisms: []
        tls_detected_services: []
        tls_tls_endpoints: []

        tls_findings: []
        tls_recommendations: []

      tags:
        - always
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 2 - REQUIRED BINARIES
    # ========================================================

    - name: STAGE 2 - Check required binaries
      ansible.builtin.command:
        cmd: "command -v {{ item }}"
      register: tls_binary_check
      changed_when: false
      failed_when: false
      loop:
        - openssl
        - find
        - ss
        - awk
        - sed
        - grep
        - date
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 2 - Build available binary list
      ansible.builtin.set_fact:
        tls_available_binaries: >-
          {{
            tls_binary_check.results
            | selectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 2 - Validate required binaries
      ansible.builtin.assert:
        that:
          - "'openssl' in tls_available_binaries"
          - "'find' in tls_available_binaries"
          - "'ss' in tls_available_binaries"
        fail_msg: >
          PiQuickHeal TLS diagnosis requires openssl, find and ss.
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 3 - CERTIFICATE FILE DISCOVERY
    # ========================================================

    - name: STAGE 3 - Discover certificate files
      ansible.builtin.shell: |
        set -o pipefail

        find \
        {% for root in tls_certificate_roots %}
          "{{ root }}" \
        {% endfor %}
          -type f \
          \( \
            -iname "*.pem" \
            -o -iname "*.crt" \
            -o -iname "*.cer" \
            -o -iname "*.der" \
          \) \
          2>/dev/null
      args:
        executable: /bin/bash
      register: tls_discovered_files
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 3 - Build certificate candidate list
      ansible.builtin.set_fact:
        tls_certificate_candidates: >-
          {{
            tls_discovered_files.stdout_lines
            | default([])
            | unique
            | reject('search', '^/proc/')
            | reject('search', '^/sys/')
            | reject('search', '^/dev/')
            | reject('search', '^/run/')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 4 - CERTIFICATE INSPECTION
    # ========================================================

    - name: STAGE 4 - Inspect certificates
      ansible.builtin.shell: |
        set -o pipefail

        FILE="{{ item }}"

        if [ ! -r "$FILE" ]; then
          exit 2
        fi

        # ----------------------------------------------------
        # Determine certificate format
        # ----------------------------------------------------

        if openssl x509 -in "$FILE" -noout >/dev/null 2>&1; then
          INFORM="PEM"

        elif openssl x509 \
            -inform DER \
            -in "$FILE" \
            -noout >/dev/null 2>&1; then

          INFORM="DER"

        else
          exit 2
        fi


        # ----------------------------------------------------
        # Count certificates in PEM bundle
        # ----------------------------------------------------

        if [ "$INFORM" = "PEM" ]; then

          COUNT=$(
            grep -c "BEGIN CERTIFICATE" "$FILE" 2>/dev/null || true
          )

          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            COUNT=1
          fi

        else
          COUNT=1
        fi


        # ----------------------------------------------------
        # Parse certificates
        # ----------------------------------------------------

        i=1

        while [ "$i" -le "$COUNT" ]; do

          if [ "$INFORM" = "DER" ]; then

            SUBJECT=$(
              openssl x509 \
                -inform DER \
                -in "$FILE" \
                -noout \
                -subject 2>/dev/null |
              sed 's/^subject=//'
            )

            ISSUER=$(
              openssl x509 \
                -inform DER \
                -in "$FILE" \
                -noout \
                -issuer 2>/dev/null |
              sed 's/^issuer=//'
            )

            SERIAL=$(
              openssl x509 \
                -inform DER \
                -in "$FILE" \
                -noout \
                -serial 2>/dev/null |
              cut -d= -f2
            )

            FINGERPRINT=$(
              openssl x509 \
                -inform DER \
                -in "$FILE" \
                -noout \
                -fingerprint \
                -sha256 2>/dev/null |
              cut -d= -f2
            )

            NOT_BEFORE=$(
              openssl x509 \
                -inform DER \
                -in "$FILE" \
                -noout \
                -startdate 2>/dev/null |
              cut -d= -f2-
            )

            NOT_AFTER=$(
              openssl x509 \
                -inform DER \
                -in "$FILE" \
                -noout \
                -enddate 2>/dev/null |
              cut -d= -f2-
            )

            BASIC_CONSTRAINTS=$(
              openssl x509 \
                -inform DER \
                -in "$FILE" \
                -noout \
                -text 2>/dev/null |
              grep -A2 "Basic Constraints" |
              head -2
            )

            SAN=$(
              openssl x509 \
                -inform DER \
                -in "$FILE" \
                -noout \
                -ext subjectAltName 2>/dev/null |
              tail -n +2 |
              tr '\n' ' '
            )

          else

            CERT_PEM=$(
              awk -v n="$i" '
                /BEGIN CERTIFICATE/ { count++ }
                count == n { print }
                count == n && /END CERTIFICATE/ { exit }
              ' "$FILE"
            )


            SUBJECT=$(
              printf '%s\n' "$CERT_PEM" |
              openssl x509 \
                -noout \
                -subject 2>/dev/null |
              sed 's/^subject=//'
            )

            ISSUER=$(
              printf '%s\n' "$CERT_PEM" |
              openssl x509 \
                -noout \
                -issuer 2>/dev/null |
              sed 's/^issuer=//'
            )

            SERIAL=$(
              printf '%s\n' "$CERT_PEM" |
              openssl x509 \
                -noout \
                -serial 2>/dev/null |
              cut -d= -f2
            )

            FINGERPRINT=$(
              printf '%s\n' "$CERT_PEM" |
              openssl x509 \
                -noout \
                -fingerprint \
                -sha256 2>/dev/null |
              cut -d= -f2
            )

            NOT_BEFORE=$(
              printf '%s\n' "$CERT_PEM" |
              openssl x509 \
                -noout \
                -startdate 2>/dev/null |
              cut -d= -f2-
            )

            NOT_AFTER=$(
              printf '%s\n' "$CERT_PEM" |
              openssl x509 \
                -noout \
                -enddate 2>/dev/null |
              cut -d= -f2-
            )

            BASIC_CONSTRAINTS=$(
              printf '%s\n' "$CERT_PEM" |
              openssl x509 \
                -noout \
                -text 2>/dev/null |
              grep -A2 "Basic Constraints" |
              head -2
            )

            SAN=$(
              printf '%s\n' "$CERT_PEM" |
              openssl x509 \
                -noout \
                -ext subjectAltName 2>/dev/null |
              tail -n +2 |
              tr '\n' ' '
            )

          fi


          # --------------------------------------------------
          # Convert expiry date to epoch
          # --------------------------------------------------

          END_EPOCH=$(
            date -d "$NOT_AFTER" +%s 2>/dev/null || echo 0
          )

          NOW_EPOCH=$(date +%s)


          # --------------------------------------------------
          # IMPORTANT:
          # Correct Bash arithmetic syntax.
          # --------------------------------------------------

          if [ "$END_EPOCH" -gt 0 ]; then
            DAYS_REMAINING=$(( (END_EPOCH - NOW_EPOCH) / 86400 ))
          else
            DAYS_REMAINING=-99999
          fi


          # --------------------------------------------------
          # Certificate status
          # --------------------------------------------------

          if [ "$DAYS_REMAINING" -lt 0 ]; then
            STATUS="EXPIRED"

          elif [ "$DAYS_REMAINING" -le {{ tls_expiry_critical_days }} ]; then
            STATUS="CRITICAL"

          elif [ "$DAYS_REMAINING" -le {{ tls_expiry_warning_days }} ]; then
            STATUS="EXPIRING_SOON"

          else
            STATUS="HEALTHY"
          fi


          # --------------------------------------------------
          # Certificate type
          # --------------------------------------------------

          IS_CA="false"

          if printf '%s\n' "$BASIC_CONSTRAINTS" |
             grep -qi "CA:TRUE"; then
            IS_CA="true"
          fi


          # --------------------------------------------------
          # Self-signed detection
          # --------------------------------------------------

          SELF_SIGNED="false"

          if [ "$SUBJECT" = "$ISSUER" ]; then
            SELF_SIGNED="true"
          fi


          # --------------------------------------------------
          # Provider / issuer detection
          # --------------------------------------------------

          ISSUER_LOWER=$(printf '%s' "$ISSUER" | tr '[:upper:]' '[:lower:]')

          if printf '%s' "$ISSUER_LOWER" | grep -q "let's encrypt"; then
            PROVIDER="LETS_ENCRYPT"

          elif printf '%s' "$ISSUER_LOWER" | grep -q "digicert"; then
            PROVIDER="DIGICERT"

          elif printf '%s' "$ISSUER_LOWER" | grep -q "godaddy"; then
            PROVIDER="GODADDY"

          elif printf '%s' "$ISSUER_LOWER" |
               grep -Eq "sectigo|comodo"; then
            PROVIDER="SECTIGO_COMODO"

          elif printf '%s' "$ISSUER_LOWER" |
               grep -q "globalsign"; then
            PROVIDER="GLOBALSIGN"

          elif printf '%s' "$ISSUER_LOWER" |
               grep -q "entrust"; then
            PROVIDER="ENTRUST"

          elif printf '%s' "$ISSUER_LOWER" |
               grep -Eq "amazon|aws"; then
            PROVIDER="AMAZON_ACM"

          elif [ "$SELF_SIGNED" = "true" ]; then
            PROVIDER="SELF_SIGNED"

          else
            PROVIDER="UNKNOWN"
          fi


          # --------------------------------------------------
          # Print machine-readable record
          # --------------------------------------------------

          printf '%s\n' \
            "PATH=$FILE" \
            "FORMAT=$INFORM" \
            "CHAIN_INDEX=$i" \
            "CHAIN_TOTAL=$COUNT" \
            "SUBJECT=$SUBJECT" \
            "ISSUER=$ISSUER" \
            "SERIAL=$SERIAL" \
            "FINGERPRINT=$FINGERPRINT" \
            "NOT_BEFORE=$NOT_BEFORE" \
            "NOT_AFTER=$NOT_AFTER" \
            "DAYS_REMAINING=$DAYS_REMAINING" \
            "STATUS=$STATUS" \
            "IS_CA=$IS_CA" \
            "SELF_SIGNED=$SELF_SIGNED" \
            "PROVIDER=$PROVIDER" \
            "SAN=$SAN" \
            "---RECORD-END---"

          i=$((i + 1))

        done

      args:
        executable: /bin/bash

      register: tls_certificate_inspection
      changed_when: false
      failed_when: false

      loop: "{{ tls_certificate_candidates }}"

      loop_control:
        label: "{{ item }}"

      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 5 - BUILD CERTIFICATE RECORDS
    # ========================================================

    - name: STAGE 5 - Initialize flattened certificate records
      ansible.builtin.set_fact:
        tls_certificate_records: []
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 5 - Build certificate records
      ansible.builtin.set_fact:
        tls_certificate_records: >-
          {{
            tls_certificate_records +
            [
              {
                'path': item.item,
                'format': (
                  item.stdout
                  | regex_search('(?m)^FORMAT=(.*)$', '\\1')
                  | default(['UNKNOWN'], true)
                  | first
                ),
                'chain_index': (
                  item.stdout
                  | regex_search('(?m)^CHAIN_INDEX=(.*)$', '\\1')
                  | default(['0'], true)
                  | first
                  | int
                ),
                'chain_total': (
                  item.stdout
                  | regex_search('(?m)^CHAIN_TOTAL=(.*)$', '\\1')
                  | default(['0'], true)
                  | first
                  | int
                ),
                'subject': (
                  item.stdout
                  | regex_search('(?m)^SUBJECT=(.*)$', '\\1')
                  | default([''], true)
                  | first
                ),
                'issuer': (
                  item.stdout
                  | regex_search('(?m)^ISSUER=(.*)$', '\\1')
                  | default([''], true)
                  | first
                ),
                'serial': (
                  item.stdout
                  | regex_search('(?m)^SERIAL=(.*)$', '\\1')
                  | default([''], true)
                  | first
                ),
                'fingerprint': (
                  item.stdout
                  | regex_search('(?m)^FINGERPRINT=(.*)$', '\\1')
                  | default([''], true)
                  | first
                ),
                'not_before': (
                  item.stdout
                  | regex_search('(?m)^NOT_BEFORE=(.*)$', '\\1')
                  | default([''], true)
                  | first
                ),
                'not_after': (
                  item.stdout
                  | regex_search('(?m)^NOT_AFTER=(.*)$', '\\1')
                  | default([''], true)
                  | first
                ),
                'days_remaining': (
                  item.stdout
                  | regex_search('(?m)^DAYS_REMAINING=(-?[0-9]+)$', '\\1')
                  | default(['-99999'], true)
                  | first
                  | int
                ),
                'status': (
                  item.stdout
                  | regex_search('(?m)^STATUS=(.*)$', '\\1')
                  | default(['UNKNOWN'], true)
                  | first
                ),
                'is_ca': (
                  item.stdout
                  | regex_search('(?m)^IS_CA=(.*)$', '\\1')
                  | default(['false'], true)
                  | first
                ),
                'self_signed': (
                  item.stdout
                  | regex_search('(?m)^SELF_SIGNED=(.*)$', '\\1')
                  | default(['false'], true)
                  | first
                ),
                'provider': (
                  item.stdout
                  | regex_search('(?m)^PROVIDER=(.*)$', '\\1')
                  | default(['UNKNOWN'], true)
                  | first
                ),
                'san': (
                  item.stdout
                  | regex_search('(?m)^SAN=(.*)$', '\\1')
                  | default([''], true)
                  | first
                )
              }
            ]
          }}
      loop: "{{ tls_certificate_inspection.results }}"
      when:
        - item.rc | default(1) == 0
        - "'---RECORD-END---' in item.stdout"
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 6 - CLASSIFY CERTIFICATES
    # ========================================================

    - name: STAGE 6 - Identify leaf certificates
      ansible.builtin.set_fact:
        tls_leaf_certificates: >-
          {{
            tls_certificate_records
            | selectattr('is_ca', 'equalto', 'false')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 6 - Identify CA certificates
      ansible.builtin.set_fact:
        tls_ca_certificates: >-
          {{
            tls_certificate_records
            | selectattr('is_ca', 'equalto', 'true')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 7 - DETECT CERTBOT
    # ========================================================

    - name: STAGE 7 - Detect Certbot
      ansible.builtin.shell: |
        if command -v certbot >/dev/null 2>&1; then
          certbot --version 2>&1
          exit 0
        fi

        exit 1
      args:
        executable: /bin/bash
      register: tls_certbot_detection
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 7 - Get Certbot certificates
      ansible.builtin.command:
        cmd: certbot certificates
      register: tls_certbot_inventory
      changed_when: false
      failed_when: false
      when: tls_certbot_detection.rc == 0
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 8 - DETECT CERT-MANAGER
    # ========================================================

    - name: STAGE 8 - Detect cert-manager binary
      ansible.builtin.command:
        cmd: kubectl get crd certificates.cert-manager.io
      register: tls_cert_manager_detection
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 8 - Detect cert-manager certificates
      ansible.builtin.command:
        cmd: >
          kubectl get certificates
          --all-namespaces
          -o wide
      register: tls_cert_manager_inventory
      changed_when: false
      failed_when: false
      when: tls_cert_manager_detection.rc == 0
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 9 - DETECT SYSTEMD RENEWAL
    # ========================================================

    - name: STAGE 9 - Discover systemd renewal units
      ansible.builtin.shell: |
        systemctl list-unit-files --type=timer --no-legend 2>/dev/null |
        awk '{print $1}' |
        grep -Ei 'cert|ssl|acme|renew' || true
      args:
        executable: /bin/bash
      register: tls_systemd_timers
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 9 - Discover systemd renewal services
      ansible.builtin.shell: |
        systemctl list-unit-files --type=service --no-legend 2>/dev/null |
        awk '{print $1}' |
        grep -Ei 'cert|ssl|acme|renew' || true
      args:
        executable: /bin/bash
      register: tls_systemd_services
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 10 - DETECT EXTERNAL RENEWAL SCRIPTS
    # ========================================================

    - name: STAGE 10 - Search for certificate renewal scripts
      ansible.builtin.shell: |
        set -o pipefail

        find \
          /etc \
          /opt \
          /usr/local/bin \
          /usr/local/sbin \
          -type f \
          \( \
            -iname "*cert*renew*" \
            -o -iname "*ssl*renew*" \
            -o -iname "*acme*" \
          \) \
          2>/dev/null |
        head -100
      args:
        executable: /bin/bash
      register: tls_renewal_scripts
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 11 - DETERMINE RENEWAL MECHANISM
    # ========================================================

    - name: STAGE 11 - Determine renewal mechanisms
      ansible.builtin.set_fact:
        tls_renewal_mechanisms: >-
          {{
            []
            +
            (
              ['CERTBOT']
              if tls_certbot_detection.rc == 0
              else []
            )
            +
            (
              ['CERT_MANAGER']
              if tls_cert_manager_detection.rc == 0
              else []
            )
            +
            (
              ['SYSTEMD']
              if
              (
                (tls_systemd_timers.stdout_lines | default([]) | length > 0)
                or
                (tls_systemd_services.stdout_lines | default([]) | length > 0)
              )
              else []
            )
            +
            (
              ['EXTERNAL_OR_CUSTOM']
              if (tls_renewal_scripts.stdout_lines | default([]) | length > 0)
              else []
            )
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 11 - Set primary renewal mechanism
      ansible.builtin.set_fact:
        tls_primary_renewal_mechanism: >-
          {{
            (
              tls_renewal_mechanisms | first
            )
            | default('MANUAL_OR_UNKNOWN')
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 12 - DISCOVER TLS LISTENERS
    # ========================================================

    - name: STAGE 12 - Discover listening TCP sockets
      ansible.builtin.shell: |
        ss -lntH 2>/dev/null
      args:
        executable: /bin/bash
      register: tls_listeners
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 12 - Build candidate TLS ports
      ansible.builtin.set_fact:
        tls_candidate_ports: >-
          {{
            tls_listeners.stdout_lines
            | default([])
            | map('regex_search', ':(\\d+)\\s*$', '\\1')
            | select('string')
            | map('first')
            | map('int')
            | select('in',
              [
                443, 8443, 9443, 10443,
                4443, 6443, 7443,
                25, 465, 587,
                110, 995,
                143, 993,
                389, 636,
                5222
              ])
            | list
            | unique
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 13 - DISCOVER WEB SERVER NAMES
    # ========================================================

    - name: STAGE 13 - Discover nginx server names
      ansible.builtin.shell: |
        if command -v nginx >/dev/null 2>&1; then
          nginx -T 2>/dev/null |
          awk '
            $1 == "server_name" {
              for (i=2; i<=NF; i++) {
                gsub(";", "", $i)
                if ($i != "_" && $i !~ /^#/ && $i !~ /:/) {
                  print $i
                }
              }
            }
          '
        fi
      args:
        executable: /bin/bash
      register: tls_nginx_names
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 13 - Discover Apache ServerName
      ansible.builtin.shell: |
        if command -v apachectl >/dev/null 2>&1; then
          apachectl -S 2>/dev/null |
          grep -E "namevhost|alias" |
          awk '{print $4}' |
          sed 's/:.*//' |
          grep -E '^[A-Za-z0-9._-]+\.[A-Za-z]{2,}$' || true

        elif command -v httpd >/dev/null 2>&1; then
          httpd -S 2>/dev/null |
          grep -E "namevhost|alias" |
          awk '{print $4}' |
          sed 's/:.*//' |
          grep -E '^[A-Za-z0-9._-]+\.[A-Za-z]{2,}$' || true
        fi
      args:
        executable: /bin/bash
      register: tls_apache_names
      changed_when: false
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 13 - Build safe hostname list
      ansible.builtin.set_fact:
        tls_hostnames: >-
          {{
            (
              ['localhost']
              +
              (tls_nginx_names.stdout_lines | default([]))
              +
              (tls_apache_names.stdout_lines | default([]))
            )
            | map('trim')
            | reject('equalto', '')
            | reject('search', ':')
            | reject('search', '/')
            | unique
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 14 - TLS ENDPOINT PROBING
    #
    # We only probe well-known TLS ports.
    # We do NOT assume every listening TCP socket is TLS.
    # ========================================================

    - name: STAGE 14 - Probe TLS endpoints
      ansible.builtin.shell: |
        set -o pipefail

        HOST="{{ item.0 }}"
        PORT="{{ item.1 }}"

        timeout "{{ tls_probe_timeout }}" \
          openssl s_client \
          -connect "${HOST}:${PORT}" \
          -servername "${HOST}" \
          </dev/null 2>/dev/null |
        openssl x509 \
          -noout \
          -subject \
          -issuer \
          -serial \
          -fingerprint \
          -startdate \
          -enddate \
          2>/dev/null
      args:
        executable: /bin/bash

      register: tls_endpoint_probes

      changed_when: false
      failed_when: false

      loop: >-
        {{
          tls_hostnames
          | product(tls_candidate_ports)
          | list
        }}

      loop_control:
        label: "{{ item.0 }}:{{ item.1 }}"

      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 15 - BUILD DIAGNOSIS
    # ========================================================

    - name: STAGE 15 - Find expired certificates
      ansible.builtin.set_fact:
        tls_expired_certificates: >-
          {{
            tls_leaf_certificates
            | selectattr('status', 'equalto', 'EXPIRED')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 15 - Find critical certificates
      ansible.builtin.set_fact:
        tls_critical_certificates: >-
          {{
            tls_leaf_certificates
            | selectattr('status', 'equalto', 'CRITICAL')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 15 - Find certificates expiring soon
      ansible.builtin.set_fact:
        tls_expiring_certificates: >-
          {{
            tls_leaf_certificates
            | selectattr('status', 'equalto', 'EXPIRING_SOON')
            | list
          }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 16 - GENERATE FINDINGS
    # ========================================================

    - name: STAGE 16 - Generate certificate findings
      ansible.builtin.set_fact:
        tls_findings:
          - >-
            Discovered {{
              tls_certificate_records | length
            }} certificate records across {{
              tls_certificate_candidates | length
            }} candidate files.

          - >-
            Leaf certificates:
            {{ tls_leaf_certificates | length }}

          - >-
            CA/intermediate certificates:
            {{ tls_ca_certificates | length }}

          - >-
            Expired leaf certificates:
            {{ tls_expired_certificates | length }}

          - >-
            Critical certificates:
            {{ tls_critical_certificates | length }}

          - >-
            Certificates expiring within
            {{ tls_expiry_warning_days }} days:
            {{ tls_expiring_certificates | length }}

          - >-
            Detected renewal mechanism:
            {{ tls_primary_renewal_mechanism }}
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 17 - GENERATE RECOMMENDATIONS
    # ========================================================

    - name: STAGE 17 - Generate recommendations
      ansible.builtin.set_fact:
        tls_recommendations:
          - >-
            Do not renew root/intermediate CA certificates using
            leaf certificate renewal workflows.

          - >-
            Use the detected renewal mechanism for leaf certificates.

          - >-
            Certificates managed by external/custom PKI should be
            renewed through the organization's approved PKI workflow.

          - >-
            Unknown renewal mechanisms require manual investigation
            before automated remediation.
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 18 - REMEDIATION DECISION
    # ========================================================

    - name: STAGE 18 - Determine whether remediation is required
      ansible.builtin.set_fact:
        tls_remediation_required: >-
          {{
            (
              tls_expired_certificates | length > 0
            )
            or
            (
              tls_critical_certificates | length > 0
            )
          }}
      tags:
        - remediate


    # ========================================================
    # STAGE 19 - CERTBOT REMEDIATION
    # ========================================================

    - name: STAGE 19 - Renew certificates using Certbot
      ansible.builtin.command:
        cmd: certbot renew --non-interactive
      register: tls_certbot_renewal
      changed_when: >-
        'No renewals were attempted' not in
        tls_certbot_renewal.stdout
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "CERTBOT"
      tags:
        - remediate


    # ========================================================
    # STAGE 20 - CERT-MANAGER REMEDIATION
    # ========================================================

    - name: STAGE 20 - Trigger cert-manager reconciliation
      ansible.builtin.shell: |
        set -o pipefail

        kubectl get certificates \
          --all-namespaces \
          -o json 2>/dev/null |
        python3 -c '
        import json
        import sys

        try:
            data = json.load(sys.stdin)
        except Exception:
            sys.exit(1)

        for item in data.get("items", []):
            metadata = item.get("metadata", {})
            namespace = metadata.get("namespace")
            name = metadata.get("name")

            if namespace and name:
                print(f"{namespace} {name}")
        '
      args:
        executable: /bin/bash
      register: tls_cert_manager_certificates
      changed_when: false
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "CERT_MANAGER"
      tags:
        - remediate


    - name: STAGE 20 - Request cert-manager renewal
      ansible.builtin.shell: |
        set -o pipefail

        while read -r NAMESPACE NAME; do

          [ -z "$NAMESPACE" ] && continue
          [ -z "$NAME" ] && continue

          kubectl annotate certificate \
            "$NAME" \
            -n "$NAMESPACE" \
            piquickheal.io/renew-request="$(date +%s)" \
            --overwrite

        done <<< "{{ tls_cert_manager_certificates.stdout | default('') }}"
      args:
        executable: /bin/bash
      register: tls_cert_manager_renewal
      changed_when: true
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "CERT_MANAGER"
      tags:
        - remediate


    # ========================================================
    # STAGE 21 - SYSTEMD REMEDIATION
    # ========================================================

    - name: STAGE 21 - Start detected certificate renewal timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
      loop: "{{ tls_systemd_timers.stdout_lines | default([]) }}"
      register: tls_systemd_timer_start
      failed_when: false
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism == "SYSTEMD"
      tags:
        - remediate


    # ========================================================
    # STAGE 22 - EXTERNAL / UNKNOWN PROVIDER
    #
    # IMPORTANT:
    # Do NOT execute arbitrary scripts automatically.
    # ========================================================

    - name: STAGE 22 - Report external/custom renewal
      ansible.builtin.debug:
        msg:
          - "Automatic renewal was not executed."
          - "Detected mechanism: {{ tls_primary_renewal_mechanism }}"
          - "Detected scripts:"
          - "{{ tls_renewal_scripts.stdout_lines | default([]) }}"
          - "External PKI/provider requires an approved renewal handler."
      when:
        - tls_remediation_required | bool
        - tls_primary_renewal_mechanism in
          [
            "EXTERNAL_OR_CUSTOM",
            "MANUAL_OR_UNKNOWN"
          ]
      tags:
        - remediate


    # ========================================================
    # STAGE 23 - SERVICE RELOAD
    #
    # Only reload services which actually exist.
    # ========================================================

    - name: STAGE 23 - Check known TLS services
      ansible.builtin.command:
        cmd: "systemctl is-active {{ item }}"
      register: tls_service_status
      changed_when: false
      failed_when: false
      loop: "{{ tls_reload_services }}"
      tags:
        - remediate


    - name: STAGE 23 - Reload active TLS services
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        state: reloaded
      loop: "{{ tls_service_status.results }}"
      when:
        - tls_allow_remediation | bool
        - tls_remediation_required | bool
        - item.rc == 0
        - item.stdout == "active"
        - item.item in tls_reload_services
      failed_when: false
      tags:
        - remediate


    # ========================================================
    # STAGE 24 - RE-DISCOVER CERTIFICATES
    #
    # This validates the files after remediation.
    # ========================================================

    - name: STAGE 24 - Recheck certificate files
      ansible.builtin.shell: |
        set -o pipefail

        for FILE in {{ tls_certificate_candidates | map('quote') | join(' ') }}; do

          if [ ! -r "$FILE" ]; then
            continue
          fi

          if ! openssl x509 -in "$FILE" -noout >/dev/null 2>&1; then
            continue
          fi

          NOT_AFTER=$(
            openssl x509 \
              -in "$FILE" \
              -noout \
              -enddate 2>/dev/null |
            cut -d= -f2-
          )

          END_EPOCH=$(
            date -d "$NOT_AFTER" +%s 2>/dev/null || echo 0
          )

          NOW_EPOCH=$(date +%s)

          if [ "$END_EPOCH" -gt 0 ]; then
            DAYS_REMAINING=$(( (END_EPOCH - NOW_EPOCH) / 86400 ))
          else
            DAYS_REMAINING=-99999
          fi

          printf '%s|%s|%s\n' \
            "$FILE" \
            "$NOT_AFTER" \
            "$DAYS_REMAINING"

        done
      args:
        executable: /bin/bash
      register: tls_post_remediation_check
      changed_when: false
      failed_when: false
      tags:
        - validate
        - remediate


    # ========================================================
    # STAGE 25 - VALIDATION
    # ========================================================

    - name: STAGE 25 - Determine validation status
      ansible.builtin.set_fact:
        tls_validation_status: >-
          {{
            'PASSED'
            if
            (
              tls_post_remediation_check.rc | default(1) == 0
            )
            else
            'FAILED'
          }}
      tags:
        - validate
        - remediate


    # ========================================================
    # STAGE 26 - DETERMINE FINAL STATUS
    # ========================================================

    - name: STAGE 26 - Determine final diagnosis status
      ansible.builtin.set_fact:
        tls_diagnosis_status: >-
          {{
            'CRITICAL'
            if tls_expired_certificates | length > 0
            else
            'WARNING'
            if tls_critical_certificates | length > 0
            else
            'HEALTHY'
          }}
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 26 - Determine remediation status
      ansible.builtin.set_fact:
        tls_remediation_status: >-
          {{
            'REMEDIATION_DISABLED'
            if not (tls_allow_remediation | bool)
            else
            'REMEDIATION_ATTEMPTED'
            if tls_remediation_required | bool
            else
            'NO_REMEDIATION_REQUIRED'
          }}
      tags:
        - remediate


    # ========================================================
    # STAGE 27 - WRITE LOG
    # ========================================================

    - name: STAGE 27 - Create PiQuickHeal log directory
      ansible.builtin.file:
        path: "{{ tls_log_file | dirname }}"
        state: directory
        mode: "0755"
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    - name: STAGE 27 - Write diagnosis log
      ansible.builtin.copy:
        dest: "{{ tls_log_file }}"
        mode: "0644"
        content: |
          ============================================================
          PiQuickHeal TLS Certificate Health
          ============================================================

          Host:
          {{ inventory_hostname }}

          Date:
          {{ ansible_date_time.iso8601 }}

          Diagnosis:
          {{ tls_diagnosis_status }}

          Remediation:
          {{ tls_remediation_status }}

          Validation:
          {{ tls_validation_status }}

          Renewal Mechanism:
          {{ tls_primary_renewal_mechanism }}

          Certificate Files:
          {{ tls_certificate_candidates | to_nice_json }}

          Certificate Records:
          {{ tls_certificate_records | to_nice_json }}

          Findings:
          {{ tls_findings | to_nice_json }}

          Recommendations:
          {{ tls_recommendations | to_nice_json }}

          ============================================================
      failed_when: false
      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 28 - AWX / PIQUICKHEAL OUTPUT
    # ========================================================

    - name: STAGE 28 - Publish PiQuickHeal results
      ansible.builtin.set_stats:
        data:

          piquickheal_issue_type: "tls_certificate"

          piquickheal_status: "{{ tls_diagnosis_status }}"

          piquickheal_remediation_status: >-
            {{ tls_remediation_status }}

          piquickheal_validation_status: >-
            {{ tls_validation_status }}

          piquickheal_renewal_mechanism: >-
            {{ tls_primary_renewal_mechanism }}

          piquickheal_certificate_count: >-
            {{ tls_certificate_records | length }}

          piquickheal_leaf_certificate_count: >-
            {{ tls_leaf_certificates | length }}

          piquickheal_ca_certificate_count: >-
            {{ tls_ca_certificates | length }}

          piquickheal_expired_count: >-
            {{ tls_expired_certificates | length }}

          piquickheal_critical_count: >-
            {{ tls_critical_certificates | length }}

          piquickheal_expiring_soon_count: >-
            {{ tls_expiring_certificates | length }}

          piquickheal_findings: >-
            {{ tls_findings }}

          piquickheal_recommendations: >-
            {{ tls_recommendations }}

          piquickheal_certificate_records: >-
            {{ tls_certificate_records }}

      tags:
        - diagnose
        - remediate
        - validate


    # ========================================================
    # STAGE 29 - FINAL SUMMARY
    # ========================================================

    - name: STAGE 29 - Display final summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PiQuickHeal TLS Certificate Health"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Diagnosis: {{ tls_diagnosis_status }}"
          - "Remediation: {{ tls_remediation_status }}"
          - "Validation: {{ tls_validation_status }}"
          - "Renewal mechanism: {{ tls_primary_renewal_mechanism }}"
          - "Certificate files: {{ tls_certificate_candidates | length }}"
          - "Leaf certificates: {{ tls_leaf_certificates | length }}"
          - "CA certificates: {{ tls_ca_certificates | length }}"
          - "Expired: {{ tls_expired_certificates | length }}"
          - "Critical: {{ tls_critical_certificates | length }}"
          - "Expiring soon: {{ tls_expiring_certificates | length }}"
          - "============================================================"
      tags:
        - diagnose
        - remediate
        - validate
